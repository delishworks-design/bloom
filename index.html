<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloom · PMOS Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Sansita:wght@400;700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Sansita:wght@400;700&display=swap');
:root{
  --bg:#FBF4EA;--card:#FFFBF5;--ink:#3A2E33;--mut:#7C6B71;
  --pink:#E8A0B4;--rose:#B8456B;--teal:#2A8A87;--tealS:#D6ECEA;--pinkS:#F9DDE5;
  --line:#EADFD2;--sh:0 2px 10px rgba(120,70,80,.08);--shb:0 12px 34px rgba(120,70,80,.16);
  color-scheme: light !important;
}
*{box-sizing:border-box}
html{scrollbar-gutter:stable}
html,body{margin:0;padding:0;min-height:100%;overflow-x:hidden;background:#FBF4EA !important;color:#3A2E33 !important;color-scheme:light !important}
body{font-family:Sansita,system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;background:#FBF4EA !important}
#app,#sheet,#toast{background:#FBF4EA}
@media (prefers-color-scheme: dark){
  :root,html,body,#app,.wrap,.card,.sheet>div,nav,input,select,textarea{color-scheme:light !important;background:#FBF4EA !important;background-color:#FBF4EA !important;color:#3A2E33 !important}
  input,select,textarea{background:#FFFBF5 !important;color:#3A2E33 !important;border-color:#EADFD2 !important}
  .card,nav,.sheet>div{background:#FFFBF5 !important}
}

/* Type hierarchy - fixed */
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:700;line-height:1.2;letter-spacing:-.01em;margin:0}
h1{font-size:28px;margin-bottom:12px}
h2{font-size:22px;margin-bottom:8px}
h3{font-size:18px;margin-bottom:4px}
p{margin:0;line-height:1.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.blob{position:fixed;border-radius:50%;filter:blur(48px);pointer-events:none;z-index:0;opacity:.7}
.blob-a{width:78vw;max-width:340px;aspect-ratio:1;top:-14%;right:-18%;background:radial-gradient(60% 60% at 50% 50%,#F9DDE5 0%,#FBF4EA 62%,transparent 78%)}
.blob-b{width:82vw;max-width:360px;aspect-ratio:1;bottom:-6%;left:-24%;background:radial-gradient(55% 55% at 50% 50%,#D6ECEA 0%,#FBF4EA 55%,transparent 75%)}
.blob-c{width:40vw;max-width:180px;aspect-ratio:1;top:36%;left:42%;background:radial-gradient(circle,#F9DDE5 0%,transparent 70%);opacity:.45}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes ringIn{from{opacity:0;transform:scale(.92) rotate(-3deg)}to{opacity:1;transform:scale(1) rotate(0)}}

/* Layout hierarchy */
.wrap{position:relative;z-index:1;max-width:430px;margin:0 auto;padding:18px 20px 120px;min-height:100dvh;background:#FBF4EA;display:flex;flex-direction:column;gap:20px}
.wrap>*{flex:0 0 auto}
#main{display:flex;flex-direction:column;gap:20px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 0 8px;min-height:52px;animation:fadeUp .5s ease both}
.pchip{display:inline-flex !important;align-items:center !important;height:38px !important;padding:0 14px !important;border-radius:999px !important;background:var(--pinkS) !important;border:1.5px solid rgba(232,160,180,.6) !important;color:var(--rose) !important;font-size:.74rem !important;font-weight:700 !important;white-space:nowrap}
#exitp{height:38px !important;min-height:38px !important;padding:0 16px !important}
.wordmark{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;color:#B8456B;line-height:1}
.wordmark i{font-size:20px;font-weight:400;font-style:normal;vertical-align:super;margin-left:2px}

/* Cards - hierarchy */
.card{background:#FFFBF5 !important;border:1.5px solid #EADFD2;border-radius:22px;padding:18px 16px;box-shadow:0 2px 10px rgba(120,70,80,.08);display:flex;flex-direction:column;gap:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:2px;border-bottom:0}
.card-h h3{font-size:17px;line-height:1.2;margin:0}
.meta{color:#7C6B71;font-size:.84rem;line-height:1.4}
.lbl{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7C6B71;line-height:1.2;display:block;margin-bottom:6px}

/* Buttons - perfect center fix */
button{font-family:Sansita,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.btn{display:inline-flex !important;align-items:center !important;justify-content:center !important;gap:8px;text-align:center !important;line-height:1 !important;white-space:nowrap !important;background:#2A8A87 !important;color:#fff !important;border:0 !important;border-radius:999px !important;padding:0 24px !important;min-height:48px !important;cursor:pointer;font:inherit;font-weight:700 !important;box-shadow:0 4px 14px rgba(42,138,135,.24)}
.btn.pink{background:#B8456B !important;box-shadow:0 4px 14px rgba(184,69,107,.24) !important}
.btn.ghost{background:#FFFBF5 !important;color:#2A8A87 !important;border:1.5px solid #2A8A87 !important;box-shadow:none !important}
.btn.sm{min-height:36px !important;padding:0 16px !important;font-size:.88rem !important}
.profbtn{display:inline-flex !important;align-items:center !important;gap:10px !important;height:42px !important;padding:4px 16px 4px 5px !important;border-radius:999px !important;background:#FFFBF5 !important;border:1.5px solid #EADFD2 !important;box-shadow:0 2px 8px rgba(120,70,80,.06) !important;color:#3A2E33 !important;font-weight:700 !important;line-height:1 !important;white-space:nowrap !important;max-width:62% !important}
.profbtn span{line-height:1 !important;overflow:hidden;text-overflow:ellipsis}
.logpill{width:100% !important;max-width:340px !important;margin:12px auto 0 !important;height:56px !important;border-radius:999px !important;background:#B8456B !important;color:#fff !important;display:flex !important;align-items:center !important;justify-content:center !important;gap:10px !important;font-weight:700 !important;box-shadow:0 8px 20px rgba(184,69,107,.3) !important;border:0 !important}
.logpill .plus{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.24);display:grid;place-items:center;flex-shrink:0}

/* Chips */
.chiprow{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex !important;align-items:center !important;justify-content:center !important;gap:6px;text-align:center !important;line-height:1 !important;white-space:nowrap !important;border:1.5px solid #EADFD2 !important;background:#FFFBF5 !important;border-radius:999px !important;padding:0 18px !important;min-height:40px !important;font-size:.9rem !important;color:#3A2E33 !important;cursor:pointer}
.chip[aria-pressed=true]{background:#F9DDE5 !important;border-color:#B8456B !important;color:#B8456B !important;font-weight:700 !important}

/* QA */
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa button{background:#D6ECEA !important;border:1.5px solid #C8E2E0 !important;border-radius:16px !important;padding:12px 6px !important;min-height:68px !important;display:flex !important;flex-direction:column !important;align-items:center !important;justify-content:center !important;text-align:center !important;gap:5px !important;font-size:.82rem !important;line-height:1.25 !important;color:#3A2E33 !important}

/* Tiles */
.tile{border-radius:20px;padding:18px 16px;display:flex;flex-direction:column;gap:8px;min-height:176px;box-shadow:0 2px 10px rgba(120,70,80,.08);border:1px solid rgba(234,223,210,.8)}
.tile.teal{background:#D6ECEA !important}.tile.blush{background:#F9DDE5 !important}.tile.rose{background:#B8456B !important;color:#fff !important}.tile.pine{background:#2A8A87 !important;color:#fff !important}
.tile .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.tile .ic{width:44px;height:44px;border-radius:50%;background:#fff !important;display:grid;place-items:center;flex:0 0 auto;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.tile h3{margin:10px 0 4px;font-size:16px;line-height:1.2}
.tile p{margin:0;font-size:.88rem;line-height:1.4;opacity:.9}
.tile .badge{background:#fff !important;border-radius:999px;padding:6px 12px;font-size:.78rem;font-weight:700;color:#3A2E33 !important;display:inline-flex;align-items:center;justify-content:center;line-height:1;white-space:nowrap}
.tile .pill{width:100%;margin-top:auto;background:#fff !important;color:#3A2E33 !important;border:0 !important;border-radius:999px !important;padding:0 12px !important;min-height:44px !important;display:flex !important;align-items:center !important;justify-content:center !important;font-weight:700 !important;text-align:center !important;line-height:1.1 !important}

/* Avatar */
.avatar{border-radius:50%;object-fit:cover;display:block;flex:0 0 auto;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.avatar-fb{border-radius:50%;background:linear-gradient(135deg,#F9DDE5,#D6ECEA) !important;display:grid;place-items:center;font-family:'Playfair Display',serif;font-weight:700;color:#B8456B;flex:0 0 auto;border:2px solid #fff}

/* Greet hierarchy */
.greet{animation:fadeUp .5s ease .1s both;display:flex;flex-direction:column;gap:4px;padding:4px 0 6px}
.greet .hi{font-family:'Playfair Display',serif;font-size:22px;font-weight:500;line-height:1.2;color:#3A2E33}
.greet .nm{font-size:36px;line-height:1;font-weight:700;color:#3A2E33;letter-spacing:-.02em}
.greet .date{margin-top:8px;font-size:.9rem;font-style:italic;color:#B8456B;line-height:1.3}

/* Ring - beautiful light version */
.ringlbl{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#7C6B71;line-height:1;margin-left:.2em}
.ringwrap{position:relative;width:100%;max-width:340px;aspect-ratio:1;margin:4px auto 8px;animation:ringIn .8s cubic-bezier(.16,1,.3,1) .15s both;display:grid;place-items:center}
.ringdisc{position:absolute;inset:13%;border-radius:50%;background:radial-gradient(100% 100% at 50% 18%, #FFFFFF 0%, #FFFBF5 58%, #FBF4EA 100%);box-shadow:inset 0 1px 0 #fff,0 12px 32px rgba(120,70,80,.07);pointer-events:none;border:1px solid rgba(234,223,210,.6)}
.ringcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;z-index:2;pointer-events:none}
.ringday{font-family:'Playfair Display',serif;font-size:58px;line-height:.88;font-weight:700;color:#3A2E33;letter-spacing:-.035em}
.ringcap{margin-top:4px;font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#7C6B71;max-width:180px;line-height:1.3;text-align:center}
.ringpill{margin-top:10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;min-height:30px;border-radius:999px;background:#FFFBF5 !important;border:1.5px solid #EADFD2 !important;box-shadow:0 2px 8px rgba(120,70,80,.08) !important;font-size:.8rem;font-weight:700;color:#3A2E33 !important;line-height:1}
.ringwrap svg{position:relative;z-index:1;width:100%;height:100%;display:block}

/* Stats */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:6px 0 2px}
.stat{background:#FFFBF5 !important;border:1.5px solid #EADFD2 !important;border-radius:18px;padding:16px 8px !important;box-shadow:0 2px 10px rgba(120,70,80,.06) !important;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.stat .ic{width:26px;height:26px;border-radius:50%;background:#F9DDE5 !important;display:grid;place-items:center;color:#B8456B !important;margin-bottom:4px}
.stat b{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:#3A2E33;line-height:1.1}
.stat b.word{font-size:14px;line-height:1.2}
.stat .lbl{margin-top:2px}

/* Forms */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
input,select,textarea{font:inherit;color:#3A2E33 !important;width:100%;padding:13px 16px !important;border-radius:14px !important;border:1.5px solid #EADFD2 !important;background:#FFFBF5 !important;margin:6px 0 14px !important;line-height:1.3 !important;box-shadow:0 1px 2px rgba(120,70,80,.04) !important}
input:focus,select:focus,textarea:focus{border-color:#B8456B !important;background:#fff !important;outline:none !important}
label{display:block;font-size:.86rem;color:#7C6B71 !important;margin-top:16px !important;margin-bottom:6px !important;line-height:1.2 !important;font-weight:700 !important;letter-spacing:.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.ck{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed #EADFD2;line-height:1.3;flex:1 1 auto;min-width:0}
.ck input{width:22px;height:22px;margin:0;accent-color:#B8456B;flex:0 0 auto}
.ckt{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;word-break:break-word;color:#3A2E33;font-size:1rem}
.cklist .ck:last-child{border-bottom:0}
.taskrow{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;min-width:0;padding:0;border-bottom:1px dashed #EADFD2}
.taskrow .ck{border-bottom:0;padding:11px 0}
.taskrow:last-child{border-bottom:0}
.taskrow .del{width:30px;height:30px;min-height:30px;padding:0;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;font-size:.95rem;line-height:1}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.calh{font-size:.68rem;font-weight:700;color:#7C6B71;line-height:1;text-align:center;padding:4px 0 2px}
.cal button{position:relative !important;aspect-ratio:1;border:1.5px solid #EADFD2 !important;border-radius:11px !important;background:#FFFBF5 !important;min-height:36px !important;display:flex !important;align-items:center !important;justify-content:center !important;flex-direction:column !important;gap:2px !important;line-height:1 !important;color:#3A2E33 !important;font-weight:700 !important;font-size:.9rem !important;box-shadow:0 1px 3px rgba(120,70,80,.05) !important}
.cal .p{background:#E8A0B4 !important;color:#fff !important;border-color:#E8A0B4 !important;box-shadow:0 4px 12px rgba(232,160,180,.35) !important}
.cal .s{background:#F9DDE5 !important}.cal .t{outline:2.5px solid #2A8A87 !important;outline-offset:1px}
.cal .d::after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#2A8A87}

/* Sheet - light */
.sheet{position:fixed;inset:0;background:rgba(58,46,51,.35) !important;backdrop-filter:blur(8px);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:#FFFBF5 !important;width:100%;max-width:430px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0 !important;padding:24px 20px 28px !important;box-shadow:0 -16px 40px rgba(120,70,80,.18) !important;display:flex;flex-direction:column;gap:14px;border:1.5px solid #EADFD2 !important;border-bottom:0 !important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:#3A2E33 !important;color:#FBF4EA !important;padding:12px 20px !important;border-radius:999px !important;z-index:12;font-size:.85rem;line-height:1;box-shadow:0 8px 20px rgba(0,0,0,.18) !important}

/* Auth */
.auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 20px;background:#FBF4EA !important}
.auth .card{max-width:400px;width:100%;min-height:520px;padding:30px 24px;gap:0;background:#FFFBF5 !important;display:flex;flex-direction:column}
.auth .card>*{flex:0 0 auto}
.auth .card>p.note{margin-top:auto}
.auth .card .brand{margin-bottom:10px}
.auth .card h2{font-size:20px;margin:0 0 2px}
.auth .card label{margin:18px 0 6px !important}
.auth .card input{margin:0 !important}
.auth .card .err{margin-top:10px}
.auth .card #go{margin-top:18px !important}
.auth .card #dm{margin-top:10px !important}
.auth .card p{margin:0}
.auth .card .note{margin-top:18px !important}
input[type=checkbox]{width:22px !important;height:22px !important;min-width:22px;padding:0 !important;margin:0 !important;accent-color:#B8456B;flex:0 0 auto}
.brand{font-family:'Playfair Display',serif;color:#B8456B;font-size:2rem;line-height:1}
.note{background:#F9DDE5 !important;border-radius:14px;padding:12px 14px;font-size:.88rem;line-height:1.45;border:1px solid rgba(232,160,180,.3) !important;color:#3A2E33 !important}
.err{color:#B8456B;font-size:.88rem;min-height:1.2em;line-height:1.3}

/* Details */
details{border-bottom:1px solid #EADFD2;padding:14px 0}summary{cursor:pointer;font-weight:700;line-height:1.3;list-style:none}
.bar{height:8px;border-radius:999px;background:#D6ECEA;overflow:hidden}.bar i{display:block;height:100%;background:#2A8A87}
.weekgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tabsrow{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:4px 0 8px;align-items:center}
.tabsrow::-webkit-scrollbar{display:none}
.tabsrow .chip{flex:0 0 auto;padding:0 14px !important;min-height:38px !important;font-size:.86rem !important}
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed #EADFD2}
.kv span{flex:1 1 auto;min-width:0}
.btn:disabled,.logpill:disabled,.chip:disabled,.glassbtn:disabled,.goalopt:disabled,.facebtn:disabled,.qa button:disabled{opacity:.45 !important;cursor:not-allowed !important;box-shadow:none !important}
.ck input:disabled{opacity:.5}
.syncbox{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border-radius:16px;background:#FBF4EA !important;border:1.5px dashed rgba(184,69,107,.45)}
.synccode{flex:1;font-family:'Playfair Display',serif;font-size:26px;font-weight:700;letter-spacing:.18em;color:#B8456B}
.fun{background:linear-gradient(180deg,#FDF3F0 0%,#F9DDE5 100%) !important;border-color:rgba(232,160,180,.35) !important;padding:12px 14px !important}
.funtext{font-family:'Playfair Display',serif;font-size:13.5px;line-height:1.4;color:#3A2E33;margin:0}
.artrow{padding:14px 0;border-bottom:1px dashed #EADFD2}
.artrow:last-child{border-bottom:0}
.artt{font-family:'Playfair Display',serif;font-size:16.5px;font-weight:700;color:#3A2E33;line-height:1.28}
.artbody{font-size:.88rem;line-height:1.55;color:#5C4A50}
.kv b{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:#3A2E33}
.divider{height:1px;background:#EADFD2;margin:16px 0}
.phasename{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;margin:6px 0 14px;line-height:1.15}
.faces{display:flex;gap:8px;justify-content:space-between;margin:8px 0}
.facebtn{flex:1;background:#FFFBF5 !important;border:1.5px solid #EADFD2 !important;padding:8px 4px !important;border-radius:16px !important;opacity:.55;min-height:58px !important;display:grid !important;place-items:center !important}
.facebtn.on{opacity:1 !important;transform:translateY(-2px);border-color:#B8456B !important;background:#F9DDE5 !important;box-shadow:0 2px 8px rgba(120,70,80,.08) !important}
.glasses{display:flex;justify-content:center;align-items:center;gap:4px;flex-wrap:wrap;margin:16px 0 14px}
.glassbtn{flex:1 1 32px;min-width:32px;max-width:44px;height:44px;background:#FFFBF5 !important;border:1.5px solid #EADFD2 !important;border-radius:12px !important;padding:0 !important;opacity:.4;min-height:44px !important;display:grid !important;place-items:center !important}
.glassbtn.on{opacity:1 !important;transform:translateY(-1px);border-color:#2A8A87 !important;background:#D6ECEA !important}
.waterrow{display:flex;align-items:baseline;gap:6px}.watercount{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:#2A8A87}
.goalbox{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:9px 10px 9px 14px;border-radius:18px;background:#FBF4EA !important;border:1.5px solid #EADFD2 !important}
.goalbox .lbl{margin:0 !important}
.goalopts{display:flex;gap:3px;padding:3px;border-radius:13px;background:#FFFBF5 !important;border:1.5px solid #EADFD2 !important}
.goalopt{min-width:36px !important;height:30px !important;padding:0 9px !important;border:0 !important;border-radius:10px !important;background:transparent !important;color:#7C6B71 !important;font:inherit !important;font-size:.84rem !important;font-weight:700 !important;line-height:1 !important;cursor:pointer !important;transition:background .2s ease,color .2s ease}
.goalopt.on{background:#B8456B !important;color:#fff !important;box-shadow:0 2px 6px rgba(184,69,107,.28) !important}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 0}
.mini{background:#FFFBF5 !important;border:1.5px solid #EADFD2 !important;border-radius:18px !important;padding:14px !important;display:flex !important;flex-direction:column !important;gap:4px !important;box-shadow:0 2px 8px rgba(120,70,80,.06) !important}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0 0}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:392px;height:68px;border-radius:28px;background:#FFFBF5 !important;border:1.5px solid #EADFD2 !important;box-shadow:0 12px 34px rgba(120,70,80,.16) !important;display:flex;align-items:center;justify-content:space-between;padding:6px;z-index:5;gap:4px}

<div class="card"><div class="card-h"><h3>History</h3></div>${s.length?s.slice().reverse().map((x,i,a)=>{const idx=s.length-1-i;const ln=idx>0?Math.round((new Date(x)-new Date(s[idx-1]))/864e5):null;let e=x;while(bleed(addD(e,1)))e=addD(e,1);return`<div class="kv"><span>${fmt(x,{month:'short',day:'numeric',year:'numeric'})} → ${fmt(e)}</span><b>${ln?ln+' d':'First'}</b></div>`}).join(''):'<p class="meta">No periods logged</p>'}</div>`;
 $('#bk').onclick=()=>{view='cycle';shell()};
 $('#pv').onclick=()=>{calM=iso(new Date(y,mo-2,1)).slice(0,7);monthView()};$('#nxm').onclick=()=>{calM=iso(new Date(y,mo,1)).slice(0,7);monthView()};
 if(!RO)document.querySelectorAll('.cal [data-d]').forEach(b=>b.onclick=()=>dayLog(b.dataset.d))}
function planner(){const d=today();tab=tab||'day';
 $('#main').innerHTML=`<h1>Planner</h1><div class="tabsrow" role="tablist">${(RO?[['day','Today'],['week','Week'],['meals','Meals']]:[['day','Today'],['week','Week'],['meals','Meals'],['journal','Journal']]).map(([k,l])=>`<button class="chip" role="tab" data-tb="${k}" aria-pressed="${tab==k}">${l}</button>`).join('')}</div><div id="pb" style="margin-top:12px"></div>`;
 document.querySelectorAll('[data-tb]').forEach(b=>b.onclick=()=>{tab=b.dataset.tb;planner()});({day:pDay,week:pWeek,meals:pMeals,journal:pJournal})[tab]()}
function pDay(){const d=today(),ts=tasksFor(d);$('#pb').innerHTML=`<div class="card"><div class="card-h"><h3>Today</h3>${RO?'':'<button class="btn ghost sm" id="gp">Generate plan</button>'}</div><div style="margin-top:6px">${ts.length?ts.map(t=>`<div class="taskrow">${ck(t,d).replace('<input type="checkbox"',`<input type="checkbox" ${RO?'disabled':''}`)}${RO?'':`<button class="btn ghost sm del" data-del="${t.id}" aria-label="Delete ${E(t.t)}">✕</button>`}</div>`).join(''):'<p class="meta">No tasks</p>'}</div>
${RO?'':`<form id="af" style="margin-top:14px"><input id="nt" maxlength="80" placeholder="Add a task" aria-label="New task" style="width:100%;margin:0 0 10px"><div class="row" style="gap:10px"><select id="rp" aria-label="Repeat" style="flex:1;margin:0"><option value="all">Every day</option><option value="wk">Weekdays</option><option value="one">Today only</option></select><button class="btn" type="submit" style="flex:0 0 auto">Add</button></div></form><div class="err" id="er"></div></div>`}`;
 bindCk(d,planner);$('#gp').onclick=()=>{genPlan();planner()};
 $('#af').onsubmit=e=>{e.preventDefault();const t=$('#nt').value.trim();if(!t)return $('#er').textContent='Please type a task.';const r=$('#rp').value;D.tasks.push({id:uid(),t,days:r=='wk'?[1,2,3,4,5]:r=='one'?[new Date().getDay()]:undefined,once:r=='one'?d:undefined});save();planner()};
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{D.tasks=D.tasks.filter(t=>t.id!=b.dataset.del);save();planner()})}
function pWeek(){const days=[...Array(7)].map((_,i)=>addD(today(),i-new Date().getDay()+0));$('#pb').innerHTML=`<div class="weekgrid">`+days.map(d=>{const ts=tasksFor(d),n=ts.filter(t=>isDone(t.id,d)).length;return`<div class="card"><div class="card-h"><h3 style="font-size:1rem">${fmt(d,{weekday:'long',day:'numeric'})}${d==today()?' · today':''}</h3><span class="meta">${n}/${ts.length}</span></div><div style="margin-top:6px">${ts.map(t=>`<div class="meta">${isDone(t.id,d)?'✓':'○'} ${E(t.t)}</div>`).join('')||'<span class="meta">Rest day</span>'}</div></div>`}).join('')+`</div>`}
function pMeals(){const d=today(),m=D.meals[d]||[],bud=D.p.bud||999;
 const fi=(foodPos+FOOD.length)%FOOD.length;
 const pool=t=>MEALS.filter(x=>x.t==t&&x.c<=bud);
 const wk=D.plan.week||null;
 $('#pb').innerHTML=`<div class="card"><div class="card-h"><h3>Today’s meals</h3><span class="meta">${m.length}</span></div>${m.length?m.map((x,i)=>`<div class="row sp ck"><span>${TN[x.t]}: ${E(x.n)}</span><button class="btn ghost sm" data-rm="${i}" aria-label="Remove">✕</button></div>`).join(''):'<p class="meta">None logged</p>'}
${RO?'':`<label for="ml" style="margin-top:14px">Add a meal</label><select id="ml"><option value="">Choose…</option>${MEALS.map((x,i)=>`<option value="${i}">${TN[x.t]} · ${E(x.n)}</option>`).join('')}</select><label for="mc">Or type your own</label><input id="mc" maxlength="60" placeholder="Meal name"><button class="btn" id="la" style="width:100%">Add</button>`}</div>
<div class="card"><div class="card-h"><h3>Weekly plan</h3></div>${RO?'':`<label for="bd">Budget per meal (₱)</label><select id="bd"><option value="">Any</option>${[50,80,100,130].map(v=>`<option value="${v}" ${D.p.bud==v?'selected':''}>up to ₱${v}</option>`).join('')}</select><button class="btn pink" id="gw" style="width:100%">Build my week</button>`}
${wk?`<div class="divider"></div>`+wk.map((r,i)=>`<div class="kv"><span>Day ${i+1}</span><b style="font-size:.85rem;font-family:inherit;font-weight:400;text-align:right">${r.map(x=>E(x.n)).join(' · ')}</b></div>`).join('')+`<h3 style="margin-top:14px">Grocery list</h3><p class="meta">${[...new Set(wk.flat().flatMap(x=>x.ing))].sort().join(', ')}</p>`:''}</div>
 <div class="card fun"><span class="lbl" style="margin:0 0 2px">Food tip</span><p class="funtext" id="foodText">${E(FOOD[fi][1])}</p></div>
 `;
 if(!RO)$('#la').onclick=()=>{const i=$('#ml').value,c=$('#mc').value.trim();let it=null;if(i!=='')it={n:MEALS[i].n,t:MEALS[i].t};else if(c)it={n:c,t:'s'};if(!it)return toast('Choose or type a meal');D.meals[d]=[...m,it];save();pMeals()};
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{if(RO)return;m.splice(+b.dataset.rm,1);D.meals[d]=m;save();pMeals()});
 if(foodTimer)clearInterval(foodTimer);foodTimer=setInterval(()=>{foodPos=(foodPos+1)%FOOD.length;paintFood()},5000);
 if(!RO)$('#gw').onclick=()=>{D.p.bud=+$('#bd').value||0;const b=D.p.bud||999;const pk=t=>{const p=MEALS.filter(x=>x.t==t&&x.c<=b);return p.length?p:MEALS.filter(x=>x.t==t)};
  D.plan.week=[...Array(7)].map((_,i)=>['b','l','d','s'].map(t=>{const p=pk(t);return p[(i+Math.floor(Math.random()*p.length))%p.length]}));save();pMeals()}}
function pJournal(){if(RO)return;const J=D.journal;$('#pb').innerHTML=`<div class="card"><div class="card-h"><h3>New entry</h3></div><label for="jt" class="lbl">Entry</label><textarea id="jt" rows="3" placeholder="Anything on your mind"></textarea><div class="err" id="er"></div><button class="btn" id="js" style="width:100%">Save entry</button></div>${J.length?J.slice().reverse().map(j=>`<div class="card"><div class="meta">${fmt(j.d,{month:'long',day:'numeric'})}</div><p style="white-space:pre-wrap">${E(j.t)}</p><div class="row" style="gap:8px;margin-top:10px"><button class="btn ghost sm" data-e="${j.id}">Edit</button> <button class="btn ghost sm" data-x="${j.id}">Delete</button></div></div>`).join(''):''}`;
 $('#js').onclick=()=>{const t=$('#jt').value.trim();if(!t)return $('#er').textContent='Write something first.';J.push({id:uid(),d:today(),t});save();pJournal()};
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{if(confirm('Delete this entry?')){D.journal=J.filter(j=>j.id!=b.dataset.x);save();pJournal()}});
 document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const j=J.find(x=>x.id==b.dataset.e);sheet(`<h2>Edit entry</h2><textarea id="et" rows="5">${E(j.t)}</textarea><div class="row sp"><button class="btn ghost" id="c2">Cancel</button><button class="btn" id="s2">Save</button></div>`);$('#c2').onclick=()=>sheet();$('#s2').onclick=()=>{const v=$('#et').value.trim();if(!v)return;j.t=v;save();sheet();pJournal()}})}

async function saveFile(name,data){try{const dl=await claude.use('downloads');if(dl){await dl.save({filename:name,data});return}}catch(e){}try{await navigator.clipboard.writeText(data);toast('Copied to clipboard')}catch(e){sheet(`<h2>${E(name)}</h2><textarea rows="10" readonly>${E(data)}</textarea><button class="btn" id="c3">Close</button>`);$('#c3').onclick=()=>sheet()}}
function exportSum(days){const c=cycleStats();let t=`Health summary for ${D.p.name||user} — ${days[0]} to ${days[days.length-1]}\nThis is self-recorded data, not a medical record.\n\nPeriod starts (recorded): ${starts().join(', ')||'none'}\n${c.n>=2?`Cycle length (calculated): ${c.min}–${c.max} days, avg ${c.avg}\n`:''}\nDaily logs:\n`;days.forEach(d=>{const l=L(d);if(Object.keys(l).some(k=>k!='water'))t+=`${d}: ${[l.flow&&'bleeding '+l.flow,l.mood&&'mood '+l.mood+'/5',l.energy&&'energy '+l.energy+'/5',l.sleep&&'sleep '+l.sleep+'h',(l.tags||[]).join('/'),l.note].filter(Boolean).join('; ')}\n`});

const ARTICLES=[
['Name change','The Lancet','Jun 2026','Polyendocrine metabolic ovarian syndrome, the new name for polycystic ovary syndrome: a multistep global consensus process','In May 2026 an international consensus process renamed polycystic ovary syndrome (PCOS) to polyendocrine metabolic ovarian syndrome (PMOS). The process took 14 years and brought together 56 patient and professional organisations, with more than 22,000 survey responses from people living with the condition and from clinicians in every world region. The rationale was accuracy: the old name implied abnormal ovarian cysts, and research shows there is no increase in abnormal cysts in the condition. A three-year transition period is planned, with full adoption in the 2028 International Guideline update, plus changes to coding and health records.'],
['Name change','Endocrine Society','May 2026','Polyendocrine Metabolic Ovarian Syndrome: new name to improve diagnosis and care','PMOS affects around 1 in 8 people — more than 170 million worldwide. The Endocrine Society was one of 56 organisations in the naming process and says the change should reduce missed diagnoses and inadequate treatment. PMOS is characterised by hormonal fluctuations that affect weight, metabolic and mental health, skin and the reproductive system. Professor Helena Teede, who led the process, called it the largest effort ever made to change the name of a medical condition. Patient and clinician resources are available in many languages, including Mandarin, Spanish, French, German, Portuguese, Arabic, Japanese and Urdu.'],
['Name change','ASRM','May 2026','PCOS is now PMOS: understanding the name change','The American Society for Reproductive Medicine has endorsed the name change, noting that the old name reduced a complex, long-term endocrine disorder to a misunderstanding about cysts and a focus on the ovaries — which contributed to missed diagnoses and inadequate treatment. The new name is intended to reflect endocrine, metabolic, ovarian, dermatological and psychological features, and to improve awareness. Existing diagnoses remain valid: you do not need to be re-diagnosed, and it is fine to keep using the term PCOS with your clinician until systems catch up.'],
['Name change','CNN','May 2026','PCOS gets a new name: PMOS','PCOS affects an estimated 10–13% of reproductive-aged women worldwide, and around 70% do not know they have it. Symptoms can include irregular cycles, difficulty conceiving, female-pattern hair loss, acne, and higher risk of type 2 diabetes and cardiovascular disease. The rename, published in The Lancet in May 2026, aims to clear up the myth of ovarian cysts and push diagnosis earlier. Experts note the condition is often only recognised once fertility problems appear — which is far too late for the metabolic side of the picture.'],
['Name change','The Guardian','May 2026','What is PCOS, what are the symptoms and treatment, and why is it being renamed PMOS?','A plain-language explainer on symptoms, diagnosis, treatment and risk. Prof Colin Duncan of the MRC Centre for Reproductive Health notes that symptoms usually begin in late adolescence, and that people present differently at different stages of life. The old name implied ovarian cysts, which are usually not there. Diagnosis still follows the Rotterdam consensus: two of three features — irregular periods, signs of high androgens, and polycystic ovaries on ultrasound.'],
['Name change','Yale Medicine','Jun 2026','PCOS is renamed PMOS: what you need to know','Your diagnosis has not changed because of the rename. Lubna Pal, a reproductive endocrinologist at Yale Medicine, describes the shift as moving from a microscopic to a telescopic view: the condition involves menstrual and ovulatory dysfunction, psychological burden and metabolic effects including insulin resistance and raised cholesterol, not just ovaries. Expect to still see PCOS on medical records and prescriptions for the foreseeable time. It is worth asking whether your care addresses blood sugar, cholesterol and cardiovascular risk, and not only your cycle.'],
['Name change','National Geographic','Sep 2026','Are we treating PMOS all wrong?','Interviews clinicians and patients about the missed-diagnosis history, and why the metabolic picture is now central. Insulin resistance leads the pancreas to overproduce insulin, which signals the ovaries and adrenal glands to make more androgens — driving ovulation problems, weight gain and acne. Diagnostic criteria are unlikely to change immediately, but researchers argue blood markers may deserve more weight than imaging, and that broader screening for lipids, glucose, sleep and mood disorders should follow a diagnosis.'],
['Name change','UHN','Sep 2026','PMOS: how renaming the condition may change the way it is diagnosed and treated','PMOS is a lifelong hormonal, metabolic and reproductive condition that can change across a lifetime. Dr Ahmad describes the rename as a way of asking different questions: better questions lead to more comprehensive care. Long-term risks include diabetes, high blood pressure, high cholesterol, cardiovascular disease, obesity, sleep apnoea and endometrial cancer. PMOS is a diagnosis of exclusion — clinicians rule out thyroid disease, prolactin problems and other causes first, then apply the two-of-three Rotterdam criteria.'],
['Name change','eClinicalMedicine','2026','Naming disease, shaping care: patient perspectives matter','Why patient perspectives matter when renaming a disease. Nomenclature drives research agendas, influences diagnosis and shapes how society sees a condition. Globally 7–12% of people are affected and up to 70% are undiagnosed. In the consensus process, patients co-led survey design and workshops, and voted 3:1 in favour of a new name over health professionals. Comparable shifts include long COVID and the renaming of fatty liver disease — a template for involving patients in how conditions are named.'],
['Name change','Monash University','May 2026','Polyendocrine Metabolic Ovarian Syndrome: new name to improve diagnosis and care','The 14-year journey behind the rename, led by Professor Helena Teede with Professor Terhi Piltonen, Anuja Dokras and Rachel Morman, working with 56 organisations. A suite of papers was published alongside the Lancet article, covering adolescent health, maternal health, clinical practice, policy reform and research. One related finding: there is no increase in abnormal ovarian cysts in the condition. A three-year transition is backed by a global education and awareness campaign.'],
['Guideline','NICE (draft)','Jul 2026','Polyendocrine metabolic ovarian syndrome: assessment and management (draft for consultation)','The UK draft guideline for PMOS in people aged 10 and over. Highlights: an annual review should be offered to everyone with a PMOS diagnosis, covering menstrual irregularity, excess hair growth, medication and long-term risk; irregular or absent cycles with signs of high testosterone should prompt investigation; PMOS should not be discounted in people who have been through menopause; and low mood, depression and anxiety are common and should not be dismissed on the basis of weight. The draft was open for consultation until 11 August 2026, with final publication set for December 2026.'],
['Guideline','EMJ','Jul 2026','Women with PMOS should get annual review, says NICE','Summarises the NICE draft: annual reviews for symptom, treatment and long-term risk monitoring; investigation of irregular cycles with signs of high testosterone; recognition that depression and anxiety are common across all ages; that PMOS may be more prevalent in Black, Asian and mixed-ethnicity groups; and fertility advice covering weight, nutrition, exercise, sleep and mental health, with IVF offered to those meeting access criteria.'],
['Guideline','Monash MCHRI','2026','International evidence-based guideline for PMOS','The reference for PMOS care, built by more than 100 multidisciplinary experts from six continents and 71 countries, with over 3,000 health professionals engaged. It supports shared decision-making, and is the basis NICE adapted for the UK. A free short course for clinicians and a wide range of patient resources are available. The guideline is next due for update in 2028, when the new name will be fully implemented.'],
['Guideline','MCHRI resources','2026','Resources for women with PMOS','Patient-facing resources in twelve languages, including simple messages, an explanation of how the new name was chosen, and why a new name was needed. AskPMOS offers expert-led information, question prompts for talking to clinicians, a symptoms tracker with analysis, and a moderated forum. There is also a statewide PMOS clinic service in Victoria, Australia, co-designed with people with PMOS and staffed by a multidisciplinary team.'],
['Facts','WHO','Jan 2026','Polycystic ovary syndrome — fact sheet','PCOS affects an estimated 10–13% of reproductive-aged women, and up to 70% do not know they have it. It is the most common cause of anovulation globally and a leading cause of infertility. Diagnosis requires at least two of three features after other causes are excluded: signs of high androgens, irregular or absent periods, and polycystic ovaries on ultrasound — so ovarian cysts are not required. Higher long-term risks include type 2 diabetes, hypertension, high cholesterol, cardiovascular disease, obesity, sleep apnoea, metabolic steatohepatitis, and endometrial hyperplasia or cancer.'],
['Facts','NHS','2026','Polyendocrine metabolic ovarian syndrome (PMOS)','Symptoms usually start in puberty and continue until menopause, and can affect anyone with ovaries. Listed signs include irregular periods or long gaps between them, excessive hair growth or hair loss, weight gain, difficulty getting pregnant, depression or anxiety, oily skin and acne, deep tiredness, and thick dark patches of skin on the neck or armpits. After menopause some symptoms stop or change. Tests include hormone blood tests, checks for insulin resistance, and an ultrasound for people over 18.'],
['Facts','ACOG','2026','Polycystic Ovary Syndrome (PCOS) — FAQ','Common signs include irregular periods, infertility, excess hair growth affecting more than 7 in 10, severe or adult-onset acne, oily skin, and thickened darkened patches of skin. PMOS affects all areas of the body, not just the reproductive system: insulin resistance raises the risk of type 2 diabetes and cardiovascular disease, irregular periods can lead to thickening of the uterine lining, and sleep apnoea and depression are more common. Causes are not fully known but likely involve insulin resistance, androgen levels and cycle irregularity working together.'],
['Facts','Mayo Clinic','May 2026','Polycystic ovary syndrome: diagnosis and treatment','There is no single test. Diagnosis starts with a conversation about symptoms, a physical exam for signs of male-pattern hair growth, insulin resistance and acne, then blood tests for hormones, cholesterol, triglycerides and glucose response, plus an ultrasound of the ovaries and uterine lining. Once diagnosed, regular checks of blood pressure, glucose tolerance and cholesterol are recommended, along with screening for depression, anxiety and obstructive sleep apnoea. Even a 5% weight loss can improve symptoms, and no single diet has been shown to beat another for weight loss.'],
['Facts','CDC','2024','Diabetes and Polycystic Ovary Syndrome (PCOS)','PMOS and diabetes: insulin resistance means the body cannot use insulin effectively, raising the risk of type 2 diabetes. Women with PMOS are also at higher risk of gestational diabetes, heart disease, high blood pressure, unfavourable cholesterol, sleep apnoea and stroke, and the link with depression and anxiety is not fully understood. Symptoms can begin as young as 11 or 12. Ask about being tested for type 2 diabetes, and about medicines that can help ovulation, acne and hair growth.'],
['Facts','BMJ Best Practice','2026','Polycystic ovary syndrome — symptoms, diagnosis and treatment','A clinical topic summary: PMOS is associated with insulin resistance, metabolic syndrome, metabolic dysfunction-associated steatotic liver disease, and increased risk of type 2 diabetes. It covers diagnostic criteria and phenotypes, investigations, and management including lifestyle, pharmacological and fertility options, with links to related guidance.'],
['Research','Journal of Ovarian Research','Jul 2026','Anti-androgen therapy in PMOS: efficacy, safety and phenotype-oriented decisions','A comprehensive review of hyperandrogenism in PMOS, comparing combined oral contraceptives, spironolactone, cyproterone acetate and finasteride, and outlining a phenotype-guided framework. Current guidelines place combined oral contraceptives first line and anti-androgens second line. For hyperandrogenic PMOS without major metabolic disturbance, a combined pill with a low-androgenic or anti-androgenic progestin is preferred; if hirsutism or acne persists after 6–9 months, spironolactone is added, with reliable contraception alongside. Special considerations are covered for adolescents, pregnancy planning and metabolic comorbidity.'],
['Research','Frontiers in Endocrinology','Feb 2026','Effects of inositol in women with PCOS: an umbrella review of meta-analyses','Thirteen meta-analyses of randomised controlled trials were reviewed. Inositol lowered luteinising hormone, total and free testosterone, and raised sex hormone-binding globulin; it improved insulin resistance measures and reproductive outcomes, with roughly double the live-birth rate and a higher ovulation rate than placebo. Evidence certainty was mostly low to very low. Myo-inositol with folic acid looked better than myo-inositol alone, while d-chiro-inositol on its own should be used with caution. Trials typically ran at least 12 weeks, and a daily dose of 2–4g is commonly suggested.'],
['Research','PubMed','Mar 2026','GLP-1 receptor agonist treatment in women with PCOS: systematic review and meta-analysis','Eleven randomised trials were included. GLP-1 receptor agonists as an add-on produced a modest reduction in BMI — about 1.4 kg/m² — compared with control, with no clear difference in LDL cholesterol or triglycerides and insufficient evidence for glucose, insulin, hirsutism or cycle regularity. No studies assessed quality of life, mental health or cost-effectiveness. The conclusion: promising for weight, still unproven for the reproductive and psychological parts of the condition.'],
['Research','CU Anschutz','Jun 2026','Injectable semaglutide shows early promise to improve fertility in women with PMOS','Early results from the RESTORE trial, published in Fertility and Sterility, suggest injectable semaglutide may improve reproductive health in PMOS, not only weight. The proof-of-concept analysis looked at participants aged 12–35 who achieved at least 10% body weight loss; reproductive improvements appeared earlier than expected. Larger, longer studies are needed to confirm the durability of those benefits, and the trial is still enrolling and following participants.'],
['Research','CCJM','Mar 2026','Polycystic ovary syndrome: an update on diagnosis and management','A review for clinicians incorporating the key 2023 guideline updates. Diagnosis is sequential: clinical and biochemical assessment first, then selective use of ultrasonography or anti-Müllerian hormone measurement in adults. Management is individualised and starts with lifestyle modification, then options for cycle irregularity, hyperandrogenism, obesity — where GLP-1 medicines can improve the metabolic profile and support ovarian function — and fertility care.'],
['Research','PMC review','Jun 2026','PMOS/PCOS: current and future trends','Reviews diagnostic criteria, pathophysiology, management and future research. Mental health disorders are also more common, with roughly three times the odds of depressive symptoms and four times the odds of anxiety symptoms. Current guidance recommends a lipid panel, blood pressure and glucose tolerance testing at diagnosis, with the 75g oral glucose tolerance test preferred; blood pressure at least annually and glucose testing every one to two years. Ethnic differences in metabolic risk are noted, as are the practical barriers to measuring insulin resistance.'],
['Adolescents','Lancet Child & Adolescent Health','May 2026','From PCOS to PMOS: the adolescent voice in setting clinical and research priorities','PMOS affects about 6.3% of adolescent girls, with metabolic, dermatological, psychological and reproductive manifestations from puberty onwards. Type 2 diabetes rates are 8–18 times higher, and endometrial carcinoma risk 6–8 times higher. The polycystic changes seen on ultrasound in adolescents are arrested follicles — a normal feature of the maturing ovarian axis — found in up to 40% of girls two years after menarche, with little long-term clinical relevance. Guidelines therefore advise against pelvic ultrasound until eight years after menarche, and require both hyperandrogenism and menstrual dysfunction for diagnosis.'],
['Adolescents','J Pediatric Adolesc Gynecol','Jun 2026','From PCOS to PMOS: implications for adolescent gynecologic care','How the rename offers a chance to reframe adolescent care. Diagnosis in adolescents is difficult because pubertal physiology overlaps with the condition, so current criteria require both irregular ovulation and hyperandrogenism while excluding ovarian criteria. The term PCOS was perceived as confusing and stigmatising by adolescents, parents and clinicians, contributing to diagnostic delay and communication barriers. Implementation of the new name is now underway, including changing ICD codes and reclassifying the disorder beyond the ovary.'],
['Adolescents','JCEM','May 2026','Approach to the diagnosis and treatment of PCOS in adolescent patients','Diagnosis in adolescence is particularly challenging, because physiological pubertal changes overlap with key features, so a definitive diagnosis requires clear and persistent evidence of both hyperandrogenism and menstrual irregularity. A teenager with only one feature should be considered at risk and followed longitudinally, balancing under- and over-diagnosis. Alternative diagnoses must be excluded. Management prioritises lifestyle modification, with combined oral contraceptives first line for cycle irregularity and hyperandrogenism, and metformin first line for metabolic comorbidity. Counselling on contraception and STI protection is an important part of that visit.'],
['Adolescents','BMC Medicine','Mar 2025','International evidence-based recommendations for PCOS in adolescents','The adolescent recommendations of the 2023 guideline. Diagnosis requires menstrual irregularity defined by years post-menarche, plus clinical or biochemical hyperandrogenism, after excluding mimics. Ultrasound and anti-Müllerian hormone are not used in adolescents. Those with one feature are "at risk" and need follow-up. Free testosterone and the free androgen index perform best for diagnosing hyperandrogenism. Lifelong planning should include healthy lifestyles, screening for depression and metabolic features, and a planned transition to adult care — with weight-related risks explained without weight stigma.'],
['Adolescents','Best Practice & Research Clinical OBGYN','Jan 2026','Diagnosis and treatment of PCOS in adolescents: a summary for practitioners','A practitioner summary of adolescent guidelines and systematic reviews, covering diagnostic approaches, the risk of over- and under-diagnosis, first-line pharmacological options, and the psychosocial and long-term metabolic consequences of leaving adolescent PMOS unrecognised.'],
['Adolescents','UpToDate','May 2026','PCOS in adolescents: treatment','PMOS should be considered in any adolescent with hirsutism or menstrual irregularity; acanthosis nigricans, treatment-resistant acne, scalp hair loss or hyperhidrosis may be the presenting complaint, and obesity is a common co-complaint. Studies suggest treatment is delayed by more than two years in a third of adults and by up to ten years in 18% of women. Clinicians are encouraged to start managing symptoms in the first one to two years, even when the diagnosis is still provisional.'],
['Adolescents','Advances in Therapy','May 2026','The management of PCOS in adolescents with obesity','Managing PMOS in adolescents with obesity. PMOS is a diagnosis of exclusion — congenital adrenal hyperplasia, hyperprolactinaemia, adrenal tumours and low body weight can all mimic it. Menstrual irregularity is normal for one to three years after menarche, which complicates diagnosis. The review covers metabolic disturbance, obstructive sleep apnoea, and argues for progesterone-only options such as drospirenone, desogestrel or levonorgestrel where oestrogen-based therapy would compound endometrial hyperplasia risk in adolescents with obesity.'],
['Lifestyle','Mass General Brigham','2026','Managing PCOS with diet','Nutrition guidance from Dr Priyanka Mahalingaiah. PMOS nutrition looks a lot like diabetes nutrition: food type and timing both matter. Most people with PMOS have insulin resistance, so pairing carbohydrate with protein and fibre slows glucose release. Eat the largest meal just before your most active time rather than at night, and keep meals small and regular. Limit ultra-processed food, refined flour, fried food, sugary drinks and white rice. Build meals around leafy greens, fibre-rich whole foods, lean protein and whole grains — and skip fad diets, intermittent fasting and binge eating.'],
['Guideline','International Guideline (full text)','2023','Evidence-based guideline for the assessment and management of PCOS','The full evidence base behind current practice. It strengthens recognition of broader features beyond reproduction — metabolic risk factors, cardiovascular disease, sleep apnoea, the very high prevalence of psychological features, and high risk of adverse outcomes during pregnancy. It keeps a maintained emphasis on healthy lifestyle, emotional wellbeing and quality of life, is alert to and tries to avoid weight stigma, and supports evidence-based medical therapy.']
