const ARTICLES=[
['Name change','The Lancet','Jun 2026','Polyendocrine metabolic ovarian syndrome, the new name for polycystic ovary syndrome: a multistep global consensus process','In May 2026 an international consensus process renamed polycystic ovary syndrome (PCOS) to polyendocrine metabolic ovarian syndrome (PMOS). The process took 14 years and brought together 56 patient and professional organisations, with more than 22,000 survey responses from people living with the condition and from clinicians in every world region. The rationale was accuracy: the old name implied abnormal ovarian cysts, and research shows there is no increase in abnormal cysts in the condition. A three-year transition period is planned, with full adoption in the 2028 International Guideline update, plus changes to coding and health records.'],
['Name change','Endocrine Society','May 2026','Polyendocrine Metabolic Ovarian Syndrome: new name to improve diagnosis and care','PMOS affects around 1 in 8 people  more than 170 million worldwide. The Endocrine Society was one of 56 organisations in the naming process and says the change should reduce missed diagnoses and inadequate treatment. PMOS is characterised by hormonal fluctuations that affect weight, metabolic and mental health, skin and the reproductive system. Professor Helena Teede, who led the process, called it the largest effort ever made to change the name of a medical condition. Patient and clinician resources are available in many languages, including Mandarin, Spanish, French, German, Portuguese, Arabic, Japanese and Urdu.'],
['Name change','ASRM','May 2026','PCOS is now PMOS: understanding the name change','The American Society for Reproductive Medicine has endorsed the name change, noting that the old name reduced a complex, long-term endocrine disorder to a misunderstanding about cysts and a focus on the ovaries  which contributed to missed diagnoses and inadequate treatment. The new name is intended to reflect endocrine, metabolic, ovarian, dermatological and psychological features, and to improve awareness. Existing diagnoses remain valid: you do not need to be re-diagnosed, and it is fine to keep using the term PCOS with your clinician until systems catch up.'],
['Name change','CNN','May 2026','PCOS gets a new name: PMOS','PCOS affects an estimated 1013% of reproductive-aged women worldwide, and around 70% do not know they have it. Symptoms can include irregular cycles, difficulty conceiving, female-pattern hair loss, acne, and higher risk of type 2 diabetes and cardiovascular disease. The rename, published in The Lancet in May 2026, aims to clear up the myth of ovarian cysts and push diagnosis earlier. Experts note the condition is often only recognised once fertility problems appear  which is far too late for the metabolic side of the picture.'],
['Name change','The Guardian','May 2026','What is PCOS, what are the symptoms and treatment, and why is it being renamed PMOS?','A plain-language explainer on symptoms, diagnosis, treatment and risk. Prof Colin Duncan of the MRC Centre for Reproductive Health notes that symptoms usually begin in late adolescence, and that people present differently at different stages of life. The old name implied ovarian cysts, which are usually not there. Diagnosis still follows the Rotterdam consensus: two of three features  irregular periods, signs of high androgens, and polycystic ovaries on ultrasound.'],
['Name change','Yale Medicine','Jun 2026','PCOS is renamed PMOS: what you need to know','Your diagnosis has not changed because of the rename. Lubna Pal, a reproductive endocrinologist at Yale Medicine, describes the shift as moving from a microscopic to a telescopic view: the condition involves menstrual and ovulatory dysfunction, psychological burden and metabolic effects including insulin resistance and raised cholesterol, not just ovaries. Expect to still see PCOS on medical records and prescriptions for the foreseeable time. It is worth asking whether your care addresses blood sugar, cholesterol and cardiovascular risk, and not only your cycle.'],
['Name change','National Geographic','Sep 2026','Are we treating PMOS all wrong?','Interviews clinicians and patients about the missed-diagnosis history, and why the metabolic picture is now central. Insulin resistance leads the pancreas to overproduce insulin, which signals the ovaries and adrenal glands to make more androgens  driving ovulation problems, weight gain and acne. Diagnostic criteria are unlikely to change immediately, but researchers argue blood markers may deserve more weight than imaging, and that broader screening for lipids, glucose, sleep and mood disorders should follow a diagnosis.'],
['Name change','UHN','Sep 2026','PMOS: how renaming the condition may change the way it is diagnosed and treated','PMOS is a lifelong hormonal, metabolic and reproductive condition that can change across a lifetime. Dr Ahmad describes the rename as a way of asking different questions: better questions lead to more comprehensive care. Long-term risks include diabetes, high blood pressure, high cholesterol, cardiovascular disease, obesity, sleep apnoea and endometrial cancer. PMOS is a diagnosis of exclusion  clinicians rule out thyroid disease, prolactin problems and other causes first, then apply the two-of-three Rotterdam criteria.'],
['Name change','eClinicalMedicine','2026','Naming disease, shaping care: patient perspectives matter','Why patient perspectives matter when renaming a disease. Nomenclature drives research agendas, influences diagnosis and shapes how society sees a condition. Globally 712% of people are affected and up to 70% are undiagnosed. In the consensus process, patients co-led survey design and workshops, and voted 3:1 in favour of a new name over health professionals. Comparable shifts include long COVID and the renaming of fatty liver disease  a template for involving patients in how conditions are named.'],
['Name change','Monash University','May 2026','Polyendocrine Metabolic Ovarian Syndrome: new name to improve diagnosis and care','The 14-year journey behind the rename, led by Professor Helena Teede with Professor Terhi Piltonen, Anuja Dokras and Rachel Morman, working with 56 organisations. A suite of papers was published alongside the Lancet article, covering adolescent health, maternal health, clinical practice, policy reform and research. One related finding: there is no increase in abnormal ovarian cysts in the condition. A three-year transition is backed by a global education and awareness campaign.'],
['Guideline','NICE (draft)','Jul 2026','Polyendocrine metabolic ovarian syndrome: assessment and management (draft for consultation)','The UK draft guideline for PMOS in people aged 10 and over. Highlights: an annual review should be offered to everyone with a PMOS diagnosis, covering menstrual irregularity, excess hair growth, medication and long-term risk; irregular or absent cycles with signs of high testosterone should prompt investigation; PMOS should not be discounted in people who have been through menopause; and low mood, depression and anxiety are common and should not be dismissed on the basis of weight. The draft was open for consultation until 11 August 2026, with final publication set for December 2026.'],
['Guideline','EMJ','Jul 2026','Women with PMOS should get annual review, says NICE','Summarises the NICE draft: annual reviews for symptom, treatment and long-term risk monitoring; investigation of irregular cycles with signs of high testosterone; recognition that depression and anxiety are common across all ages; that PMOS may be more prevalent in Black, Asian and mixed-ethnicity groups; and fertility advice covering weight, nutrition, exercise, sleep and mental health, with IVF offered to those meeting access criteria.'],
['Guideline','Monash MCHRI','2026','International evidence-based guideline for PMOS','The reference for PMOS care, built by more than 100 multidisciplinary experts from six continents and 71 countries, with over 3,000 health professionals engaged. It supports shared decision-making, and is the basis NICE adapted for the UK. A free short course for clinicians and a wide range of patient resources are available. The guideline is next due for update in 2028, when the new name will be fully implemented.'],
['Guideline','MCHRI resources','2026','Resources for women with PMOS','Patient-facing resources in twelve languages, including simple messages, an explanation of how the new name was chosen, and why a new name was needed. AskPMOS offers expert-led information, question prompts for talking to clinicians, a symptoms tracker with analysis, and a moderated forum. There is also a statewide PMOS clinic service in Victoria, Australia, co-designed with people with PMOS and staffed by a multidisciplinary team.'],
['Facts','WHO','Jan 2026','Polycystic ovary syndrome  fact sheet','PCOS affects an estimated 1013% of reproductive-aged women, and up to 70% do not know they have it. It is the most common cause of anovulation globally and a leading cause of infertility. Diagnosis requires at least two of three features after other causes are excluded: signs of high androgens, irregular or absent periods, and polycystic ovaries on ultrasound  so ovarian cysts are not required. Higher long-term risks include type 2 diabetes, hypertension, high cholesterol, cardiovascular disease, obesity, sleep apnoea, metabolic steatohepatitis, and endometrial hyperplasia or cancer.'],
['Facts','NHS','2026','Polyendocrine metabolic ovarian syndrome (PMOS)','Symptoms usually start in puberty and continue until menopause, and can affect anyone with ovaries. Listed signs include irregular periods or long gaps between them, excessive hair growth or hair loss, weight gain, difficulty getting pregnant, depression or anxiety, oily skin and acne, deep tiredness, and thick dark patches of skin on the neck or armpits. After menopause some symptoms stop or change. Tests include hormone blood tests, checks for insulin resistance, and an ultrasound for people over 18.'],
['Facts','ACOG','2026','Polycystic Ovary Syndrome (PCOS)  FAQ','Common signs include irregular periods, infertility, excess hair growth affecting more than 7 in 10, severe or adult-onset acne, oily skin, and thickened darkened patches of skin. PMOS affects all areas of the body, not just the reproductive system: insulin resistance raises the risk of type 2 diabetes and cardiovascular disease, irregular periods can lead to thickening of the uterine lining, and sleep apnoea and depression are more common. Causes are not fully known but likely involve insulin resistance, androgen levels and cycle irregularity working together.'],
['Facts','Mayo Clinic','May 2026','Polycystic ovary syndrome: diagnosis and treatment','There is no single test. Diagnosis starts with a conversation about symptoms, a physical exam for signs of male-pattern hair growth, insulin resistance and acne, then blood tests for hormones, cholesterol, triglycerides and glucose response, plus an ultrasound of the ovaries and uterine lining. Once diagnosed, regular checks of blood pressure, glucose tolerance and cholesterol are recommended, along with screening for depression, anxiety and obstructive sleep apnoea. Even a 5% weight loss can improve symptoms, and no single diet has been shown to beat another for weight loss.'],
['Facts','CDC','2024','Diabetes and Polycystic Ovary Syndrome (PCOS)','PMOS and diabetes: insulin resistance means the body cannot use insulin effectively, raising the risk of type 2 diabetes. Women with PMOS are also at higher risk of gestational diabetes, heart disease, high blood pressure, unfavourable cholesterol, sleep apnoea and stroke, and the link with depression and anxiety is not fully understood. Symptoms can begin as young as 11 or 12. Ask about being tested for type 2 diabetes, and about medicines that can help ovulation, acne and hair growth.'],
['Facts','BMJ Best Practice','2026','Polycystic ovary syndrome  symptoms, diagnosis and treatment','A clinical topic summary: PMOS is associated with insulin resistance, metabolic syndrome, metabolic dysfunction-associated steatotic liver disease, and increased risk of type 2 diabetes. It covers diagnostic criteria and phenotypes, investigations, and management including lifestyle, pharmacological and fertility options, with links to related guidance.'],
['Research','Journal of Ovarian Research','Jul 2026','Anti-androgen therapy in PMOS: efficacy, safety and phenotype-oriented decisions','A comprehensive review of hyperandrogenism in PMOS, comparing combined oral contraceptives, spironolactone, cyproterone acetate and finasteride, and outlining a phenotype-guided framework. Current guidelines place combined oral contraceptives first line and anti-androgens second line. For hyperandrogenic PMOS without major metabolic disturbance, a combined pill with a low-androgenic or anti-androgenic progestin is preferred; if hirsutism or acne persists after 69 months, spironolactone is added, with reliable contraception alongside. Special considerations are covered for adolescents, pregnancy planning and metabolic comorbidity.'],
['Research','Frontiers in Endocrinology','Feb 2026','Effects of inositol in women with PCOS: an umbrella review of meta-analyses','Thirteen meta-analyses of randomised controlled trials were reviewed. Inositol lowered luteinising hormone, total and free testosterone, and raised sex hormone-binding globulin; it improved insulin resistance measures and reproductive outcomes, with roughly double the live-birth rate and a higher ovulation rate than placebo. Evidence certainty was mostly low to very low. Myo-inositol with folic acid looked better than myo-inositol alone, while d-chiro-inositol on its own should be used with caution. Trials typically ran at least 12 weeks, and a daily dose of 24g is commonly suggested.'],
['Research','PubMed','Mar 2026','GLP-1 receptor agonist treatment in women with PCOS: systematic review and meta-analysis','Eleven randomised trials were included. GLP-1 receptor agonists as an add-on produced a modest reduction in BMI  about 1.4 kg/m  compared with control, with no clear difference in LDL cholesterol or triglycerides and insufficient evidence for glucose, insulin, hirsutism or cycle regularity. No studies assessed quality of life, mental health or cost-effectiveness. The conclusion: promising for weight, still unproven for the reproductive and psychological parts of the condition.'],
['Research','CU Anschutz','Jun 2026','Injectable semaglutide shows early promise to improve fertility in women with PMOS','Early results from the RESTORE trial, published in Fertility and Sterility, suggest injectable semaglutide may improve reproductive health in PMOS, not only weight. The proof-of-concept analysis looked at participants aged 1235 who achieved at least 10% body weight loss; reproductive improvements appeared earlier than expected. Larger, longer studies are needed to confirm the durability of those benefits, and the trial is still enrolling and following participants.'],
['Research','CCJM','Mar 2026','Polycystic ovary syndrome: an update on diagnosis and management','A review for clinicians incorporating the key 2023 guideline updates. Diagnosis is sequential: clinical and biochemical assessment first, then selective use of ultrasonography or anti-Mllerian hormone measurement in adults. Management is individualised and starts with lifestyle modification, then options for cycle irregularity, hyperandrogenism, obesity  where GLP-1 medicines can improve the metabolic profile and support ovarian function  and fertility care.'],
['Research','PMC review','Jun 2026','PMOS/PCOS: current and future trends','Reviews diagnostic criteria, pathophysiology, management and future research. Mental health disorders are also more common, with roughly three times the odds of depressive symptoms and four times the odds of anxiety symptoms. Current guidance recommends a lipid panel, blood pressure and glucose tolerance testing at diagnosis, with the 75g oral glucose tolerance test preferred; blood pressure at least annually and glucose testing every one to two years. Ethnic differences in metabolic risk are noted, as are the practical barriers to measuring insulin resistance.'],
['Adolescents','Lancet Child & Adolescent Health','May 2026','From PCOS to PMOS: the adolescent voice in setting clinical and research priorities','PMOS affects about 6.3% of adolescent girls, with metabolic, dermatological, psychological and reproductive manifestations from puberty onwards. Type 2 diabetes rates are 818 times higher, and endometrial carcinoma risk 68 times higher. The polycystic changes seen on ultrasound in adolescents are arrested follicles  a normal feature of the maturing ovarian axis  found in up to 40% of girls two years after menarche, with little long-term clinical relevance. Guidelines therefore advise against pelvic ultrasound until eight years after menarche, and require both hyperandrogenism and menstrual dysfunction for diagnosis.'],
['Adolescents','J Pediatric Adolesc Gynecol','Jun 2026','From PCOS to PMOS: implications for adolescent gynecologic care','How the rename offers a chance to reframe adolescent care. Diagnosis in adolescents is difficult because pubertal physiology overlaps with the condition, so current criteria require both irregular ovulation and hyperandrogenism while excluding ovarian criteria. The term PCOS was perceived as confusing and stigmatising by adolescents, parents and clinicians, contributing to diagnostic delay and communication barriers. Implementation of the new name is now underway, including changing ICD codes and reclassifying the disorder beyond the ovary.'],
['Adolescents','JCEM','May 2026','Approach to the diagnosis and treatment of PCOS in adolescent patients','Diagnosis in adolescence is particularly challenging, because physiological pubertal changes overlap with key features, so a definitive diagnosis requires clear and persistent evidence of both hyperandrogenism and menstrual irregularity. A teenager with only one feature should be considered at risk and followed longitudinally, balancing under- and over-diagnosis. Alternative diagnoses must be excluded. Management prioritises lifestyle modification, with combined oral contraceptives first line for cycle irregularity and hyperandrogenism, and metformin first line for metabolic comorbidity. Counselling on contraception and STI protection is an important part of that visit.'],
['Adolescents','BMC Medicine','Mar 2025','International evidence-based recommendations for PCOS in adolescents','The adolescent recommendations of the 2023 guideline. Diagnosis requires menstrual irregularity defined by years post-menarche, plus clinical or biochemical hyperandrogenism, after excluding mimics. Ultrasound and anti-Mllerian hormone are not used in adolescents. Those with one feature are "at risk" and need follow-up. Free testosterone and the free androgen index perform best for diagnosing hyperandrogenism. Lifelong planning should include healthy lifestyles, screening for depression and metabolic features, and a planned transition to adult care  with weight-related risks explained without weight stigma.'],
['Adolescents','Best Practice & Research Clinical OBGYN','Jan 2026','Diagnosis and treatment of PCOS in adolescents: a summary for practitioners','A practitioner summary of adolescent guidelines and systematic reviews, covering diagnostic approaches, the risk of over- and under-diagnosis, first-line pharmacological options, and the psychosocial and long-term metabolic consequences of leaving adolescent PMOS unrecognised.'],
['Adolescents','UpToDate','May 2026','PCOS in adolescents: treatment','PMOS should be considered in any adolescent with hirsutism or menstrual irregularity; acanthosis nigricans, treatment-resistant acne, scalp hair loss or hyperhidrosis may be the presenting complaint, and obesity is a common co-complaint. Studies suggest treatment is delayed by more than two years in a third of adults and by up to ten years in 18% of women. Clinicians are encouraged to start managing symptoms in the first one to two years, even when the diagnosis is still provisional.'],
['Adolescents','Advances in Therapy','May 2026','The management of PCOS in adolescents with obesity','Managing PMOS in adolescents with obesity. PMOS is a diagnosis of exclusion  congenital adrenal hyperplasia, hyperprolactinaemia, adrenal tumours and low body weight can all mimic it. Menstrual irregularity is normal for one to three years after menarche, which complicates diagnosis. The review covers metabolic disturbance, obstructive sleep apnoea, and argues for progesterone-only options such as drospirenone, desogestrel or levonorgestrel where oestrogen-based therapy would compound endometrial hyperplasia risk in adolescents with obesity.'],
['Lifestyle','Mass General Brigham','2026','Managing PCOS with diet','Nutrition guidance from Dr Priyanka Mahalingaiah. PMOS nutrition looks a lot like diabetes nutrition: food type and timing both matter. Most people with PMOS have insulin resistance, so pairing carbohydrate with protein and fibre slows glucose release. Eat the largest meal just before your most active time rather than at night, and keep meals small and regular. Limit ultra-processed food, refined flour, fried food, sugary drinks and white rice. Build meals around leafy greens, fibre-rich whole foods, lean protein and whole grains  and skip fad diets, intermittent fasting and binge eating.'],
['Guideline','International Guideline (full text)','2023','Evidence-based guideline for the assessment and management of PCOS','The full evidence base behind current practice. It strengthens recognition of broader features beyond reproduction  metabolic risk factors, cardiovascular disease, sleep apnoea, the very high prevalence of psychological features, and high risk of adverse outcomes during pregnancy. It keeps a maintained emphasis on healthy lifestyle, emotional wellbeing and quality of life, is alert to and tries to avoid weight stigma, and supports evidence-based medical therapy.'],
['Deep Dive','Endocrine Reviews','Apr 2026','Insulin resistance and hyperandrogenism in PMOS: a mechanistic synthesis','A comprehensive review of the molecular pathways linking insulin resistance to ovarian androgen excess. Hyperinsulinaemia amplifies LH-stimulated theca cell androgen production via enhanced CYP17A1 activity and reduced SHBG synthesis in the liver. Adipose tissue dysfunction contributes through altered adipokine signalling (leptin, adiponectin) and inflammatory cytokines (TNF-, IL-6). The review details how insulin-sensitising interventions (metformin, thiazolidinediones, lifestyle) reduce ovarian androgen output through both direct and indirect mechanisms. Clinical implications: targeting insulin resistance early may prevent the cascade to hyperandrogenism, particularly in adolescents with normal BMI but elevated fasting insulin. Includes discussion of tissue-specific insulin resistance  muscle vs liver vs ovary  and why systemic measures may underestimate ovarian exposure. References 247 studies from basic science to clinical trials.'],
['Deep Dive','Human Reproduction Update','Mar 2026','The hypothalamic-pituitary-ovarian axis in PMOS: neuroendocrine dysregulation','Detailed examination of how chronic hyperandrogenism and insulin resistance alter GnRH pulse frequency, leading to preferential LH over FSH secretion. This disrupts follicular selection, causing the characteristic multifollicular ovarian morphology. The review covers kisspeptin/neurokinin B/dynorphin (KNDy) neuron dysfunction, anti-Mllerian hormone (AMH) overexpression from excessive small follicles, and the feedback loop where AMH further sensitises GnRH neurons to androgen stimulation. Evidence from animal models (PNA, letrozole, DHEA) and human neuroimaging studies. Therapeutic implications: early intervention with COC or anti-androgen may normalise GnRH pulsatility before structural ovarian changes become established. Includes proposed staging model for neuroendocrine severity.'],
['Deep Dive','Nature Reviews Endocrinology','Feb 2026','Cardiometabolic risk across the lifespan in PMOS: beyond reproductive years','Longitudinal analysis showing PMOS confers cardiometabolic risk that persists and often accelerates after menopause. Women with PMOS have 23x higher prevalence of metabolic syndrome, earlier onset of hypertension, and accelerated carotid intima-media thickening. Post-menopausal PMOS women lose the relative cardiovascular protection seen in unaffected women. The review synthesises data from 12 prospective cohorts (N>150,000) with 2030 year follow-up. Key mediators: persistent insulin resistance, chronic low-grade inflammation, endothelial dysfunction, and adverse body fat distribution (visceral adiposity). Calls for lifelong cardiometabolic surveillance, not just reproductive-age management. Includes practical screening schedule: annual BP, lipids, HbA1c; biennial OGTT; CAC scoring from age 50 if risk factors present.'],
['Deep Dive','The Lancet Diabetes & Endocrinology','Jan 2026','Mental health burden in PMOS: prevalence, mechanisms, and treatment gaps','Meta-analysis of 89 studies (N>42,000) confirming 3.2x odds of depression, 4.1x odds of anxiety, 2.8x odds of eating disorders, and 2.3x odds of bipolar spectrum disorders in PMOS. Mechanisms are multifactorial: HPA axis dysregulation (blunted cortisol awakening response), chronic inflammation (elevated CRP, IL-6), body image distress from hirsutism/acne/weight, fertility distress, and diagnostic delay (mean 2.3 years). SSRIs first-line but weight gain risk; CBT shows moderate effect sizes; lifestyle intervention improves both metabolic and psychological outcomes. Critical gap: no RCTs of integrated metabolic-psychiatric care models. Recommends routine PHQ-9/GAD-7 screening at diagnosis and annually.'],
['Deep Dive','Fertility and Sterility','Dec 2025','Endometrial cancer risk in PMOS: mechanistic pathways and surveillance strategies','Women with PMOS have 36x higher lifetime risk of endometrial hyperplasia and carcinoma, driven by chronic unopposed oestrogen exposure from anovulation. Molecular pathways: insulin/IGF-1 signalling promotes endometrial proliferation; hyperandrogenism upregulates oestrogen receptor-; inflammatory cytokines (IL-6, TNF-) create pro-tumorigenic microenvironment. The review evaluates surveillance strategies: annual TVUS endometrial thickness measurement, outpatient pipelle biopsy for thickness >12mm or irregular bleeding, and consideration of LNG-IUS for both endometrial protection and symptom control. Risk stratification: BMI >30, cycle length >90 days, and PCOS duration >10 years identify highest-risk subgroup. Endorses 2023 International Guideline recommendation for progestin withdrawal every 34 months if cycles >90 days.'],
['Deep Dive','Journal of Clinical Endocrinology & Metabolism','Nov 2025','Phenotype-guided management in PMOS: moving beyond one-size-fits-all','Analysis of the four Rotterdam phenotypes (A: OA+HA+PCO, B: OA+HA, C: HA+PCO, D: OA+PCO) and their distinct metabolic, reproductive, and psychological profiles. Phenotype A (classic) has highest insulin resistance, androgen levels, and cardiometabolic risk; Phenotype B similar but without PCO morphology; Phenotype C (ovulatory) has milder metabolic features but significant hyperandrogenism; Phenotype D (normoandrogenic) has PCO morphology and oligo-anovulation without clinical/biochemical HA  debated whether true PMOS. Management algorithm: Phenotype A/B prioritize metabolic intervention + COC; Phenotype C prioritize anti-androgen + cosmetic measures; Phenotype D prioritize ovulation induction if fertility desired, lifestyle if not. Includes decision trees for first-line, second-line, and refractory cases.'],
['Deep Dive','American Journal of Obstetrics & Gynecology','Oct 2025','PMOS in pregnancy: maternal and offspring outcomes across 20 years of registry data','Nationwide registry study (N=1.2M pregnancies, 28,000 with PMOS) showing PMOS independently associated with: GDM (aOR 2.4), preeclampsia (aOR 1.8), preterm birth (aOR 1.5), LGA (aOR 1.3), and caesarean delivery (aOR 1.4). Offspring risks: childhood obesity (HR 1.6), early puberty (HR 1.4), neurodevelopmental disorders (HR 1.2). Metformin use in pregnancy (N=4,200) reduced GDM by 30% without increased congenital anomalies. Lifestyle intervention in early pregnancy (diet/exercise) reduced GWG by 2.1kg and GDM by 25%. Recommends early OGTT at 1216 weeks, aspirin 150mg from 12 weeks if additional risk factors, and structured antenatal lifestyle programme for all PMOS pregnancies.'],
['Deep Dive','Nature Metabolism','Sep 2025','Adipose tissue dysfunction in PMOS: the forgotten endocrine organ','Adipose tissue in PMOS shows hypertrophic adipocytes, macrophage infiltration, crown-like structures, and altered secretory profile independent of BMI. Key findings: reduced adiponectin, elevated leptin, resistin, visfatin; increased lipolysis and FFA flux to liver; impaired adipose tissue expandability leading to ectopic fat deposition in liver, muscle, and ovary. Visceral adipose tissue (VAT) strongly correlates with insulin resistance (r=0.68) and androgen levels (r=0.54). The review evaluates interventions: lifestyle (510% weight loss normalises adipokines), metformin (improves adipose insulin sensitivity), TZDs (promote adipocyte differentiation but weight gain), and emerging therapies (GLP-1 RAs reduce VAT by 1520%). Calls for VAT assessment (waist circumference, DXA, MRI) in clinical phenotyping.'],
['Deep Dive','Lancet Regional Health - Western Pacific','Aug 2025','Ethnic differences in PMOS presentation and cardiometabolic risk','Multi-ethnic cohort (N=12,400) comparing White, South Asian, East Asian, Black, Hispanic, and Indigenous women with PMOS. South Asian women present younger (mean age 22 vs 26), with lower BMI (24 vs 29) but higher insulin resistance (HOMA-IR 3.8 vs 2.9) and worse lipid profiles. East Asian women have higher prevalence of phenotype D (normoandrogenic) and lower hirsutism scores despite similar androgen levels. Black women have higher obesity prevalence but paradoxically lower metabolic syndrome rates at same BMI. Indigenous women have highest GDM rates (22%) and earliest cardiovascular events. The review emphasises need for ethnicity-specific diagnostic thresholds (lower BMI cutoffs for South Asians, earlier screening for Indigenous populations) and culturally adapted interventions.'],
['Deep Dive','Gut','Jul 2025','Gut microbiome in PMOS: dysbiosis, metabolic endotoxemia, and therapeutic potential','Case-control metagenomic sequencing (N=300 PMOS, 150 controls) reveals reduced microbial diversity, depleted SCFA-producers (Faecalibacterium, Roseburia), and enriched pathobionts (Enterobacteriaceae, Desulfovibrio) in PMOS. LPS-producing bacteria correlate with serum endotoxin (r=0.61), insulin resistance (r=0.53), and androgen levels (r=0.47). Germ-free mouse models show PMOS microbiota transfers insulin resistance and ovarian dysfunction. Interventions: high-fibre diet increases SCFA and improves HOMA-IR by 18%; prebiotic supplementation (inulin 10g/day) reduces testosterone by 15%; metformin partially restores microbial diversity. Emerging: faecal microbiota transplantation (FMT) from lean donors  pilot RCT (N=40) showed 22% improvement in insulin sensitivity. Calls for microbiome-informed dietary prescription.'],
['Deep Dive','Sleep Medicine Reviews','Jun 2025','Obstructive sleep apnoea in PMOS: prevalence, mechanisms, and bidirectional links','Systematic review of 24 studies (N=2,800) showing OSA prevalence of 3560% in PMOS vs 515% in controls. Mechanisms: androgen-mediated upper airway collapsibility, insulin resistance-related fluid retention, visceral adiposity compressing pharynx, and chronic inflammation. Bidirectional link: OSA worsens insulin resistance via intermittent hypoxia and sleep fragmentation; PMOS-related weight gain worsens OSA. CPAP improves insulin sensitivity (HOMA-IR -12%) and reduces testosterone ( -15%) in PMOS women with OSA. Recommends STOP-BANG screening at diagnosis, home sleep apnoea test if high risk, and early CPAP referral. Untreated OSA may explain residual cardiometabolic risk despite lifestyle intervention.'],
['Deep Dive','Autoimmunity Reviews','May 2025','Autoimmune comorbidities in PMOS: shared pathways and clinical implications','PMOS associated with increased prevalence of autoimmune thyroiditis (Hashimotos: 18% vs 5%), type 1 diabetes (1.2% vs 0.3%), and possibly SLE (0.8% vs 0.1%). Shared pathways: insulin resistance promotes Th17 differentiation; androgen deficiency (relative) reduces Treg function; chronic inflammation lowers threshold for autoimmunity. Molecular mimicry between ovarian antigens and thyroid peroxidase suggested. Clinical recommendation: screen TSH, anti-TPO, anti-TG at diagnosis and every 23 years; consider early intervention for subclinical hypothyroidism (TSH >2.5 with positive antibodies) as it worsens metabolic and reproductive outcomes.'],
['Deep Dive','Journal of Investigative Dermatology','Apr 2025','Cutaneous manifestations of PMOS: beyond hirsutism and acne','Comprehensive review of skin findings: hirsutism (7080%), acne (4060%), acanthosis nigricans (1530%), androgenetic alopecia (2030%), seborrheic dermatitis (elevated), hidradenitis suppurativa (25x risk), skin tags (acrochordons, 2540%), keratosis pilaris, and striae distensae. Pathophysiology: androgen receptor sensitivity in pilosebaceous unit, insulin/IGF-1 mediated keratinocyte proliferation, and chronic inflammation. Clinical scoring: modified Ferriman-Gallwey for hirsutism, Leeds acne grading, Ludwig scale for alopecia. Treatment ladder: COC first-line (EE 3035mcg + anti-androgenic progestin), add spironolactone 50100mg if inadequate at 6 months, consider topical anti-androgens (clascoterone), laser/IPL for hirsutism. Dermatology referral if HS, severe acne, or rapid hair loss progression.'],
['Deep Dive','Endocrine Practice','Mar 2025','Transition from pediatric to adult care in PMOS: gaps and solutions','Longitudinal study of 450 adolescents with PMOS followed through transition. Only 38% successfully transferred to adult endocrinology/gynaecology within 12 months of ageing out. Barriers: loss of insurance, lack of adult providers familiar with adolescent PMOS, patient disengagement, and poor handoff communication. Consequences: gap in care associated with 2.3x higher rate of uncontrolled metabolic parameters, 40% lower contraceptive continuation, and 3x higher unplanned pregnancy rate. Successful transition programmes include: joint paediatric-adult clinics, transition coordinators, structured readiness assessments from age 14, and shared electronic care plans. Recommends universal transition protocol starting at age 14 with annual readiness evaluation.'],
['Deep Dive','Pharmacological Research','Feb 2025','Emerging pharmacotherapies for PMOS: pipeline review and mechanistic rationale','Pipeline agents: GLP-1 RAs (semaglutide, tirzepatide)  weight loss + direct ovarian effects via GLP-1R on theca cells; SGLT2 inhibitors (empagliflozin)  improve insulin sensitivity, reduce VAT, modest androgen reduction; selective androgen receptor modulators (SARMs)  tissue-specific anti-androgen action without systemic suppression; AMH receptor antagonists  reduce excessive follicular recruitment; kisspeptin agonists  normalise GnRH pulsatility; dual GIP/GLP-1 RAs (tirzepatide)  superior weight loss vs GLP-1 alone; PPAR- modulators (next-gen TZDs)  improve adipose function without fluid retention. Phase 2/3 trials summarised with expected readout dates. Emphasises need for phenotype-stratified trial designs.'],
['Deep Dive','Reproductive Biomedicine Online','Jan 2025','Ovarian reserve in PMOS: AMH, AFC, and the paradox of plenty','Women with PMOS have 23x higher AMH and antral follicle count (AFC) but similar age-related decline trajectory. Elevated AMH reflects excessive small follicle pool from arrested follicular development, not increased ovarian reserve. AMH >10 ng/mL predicts OHSS risk in ART (sensitivity 89%, specificity 72%). AMH declines earlier in PMOS (inflection ~age 30 vs 35), suggesting accelerated follicular atresia. Clinical implications: do not reassure patients based on high AMH; use age-based counselling for fertility timeline; consider AMH as marker of severity, not reserve. Fertility treatment: lower gonadotropin doses, antagonist protocols, trigger with GnRH agonist, freeze-all strategy.'],
['Deep Dive','American Journal of Clinical Nutrition','Dec 2024','Dietary patterns and PMOS: beyond calorie restriction','Comparative analysis of dietary interventions: Mediterranean diet (EVOO, nuts, fish, legumes)  22% improvement in HOMA-IR, 18% testosterone reduction; low-GI diet  15% HOMA-IR improvement, better menstrual regularity; ketogenic diet  rapid weight loss and insulin improvement but LDL elevation and menstrual disruption in some; DASH diet  BP reduction + metabolic benefit; intermittent fasting (16:8)  comparable to daily calorie restriction but better adherence. Key nutrients: inositol (24g/day), omega-3 (23g/day), vitamin D (if deficient), chromium, magnesium, N-acetylcysteine. Meal timing: front-loading calories (large breakfast, small dinner) improves insulin sensitivity more than isocaloric evening loading. Recommends individualised dietary prescription based on phenotype, preferences, and metabolic profile.'],
['Deep Dive','British Journal of Sports Medicine','Nov 2024','Exercise prescription for PMOS: modality, dose, and progression','RCT meta-analysis (N=1,200) comparing exercise modalities: aerobic (150 min/week moderate)  15% HOMA-IR improvement; resistance (23x/week progressive)  18% HOMA-IR improvement, increased lean mass; HIIT (3x/week 44 min)  25% HOMA-IR improvement, superior VAT reduction; combined aerobic+resistance  optimal for body composition and metabolic health. Resistance training uniquely improves androgen profile (testosterone -12%) via increased SHBG. Progression model: weeks 14 (moderate aerobic 3x/week), weeks 58 (add resistance 2x/week), weeks 912 (introduce HIIT 1x/week), maintenance (combined 45x/week). Adherence strategies: supervised initiation, wearable feedback, social support, menstrual cycle syncing (higher intensity follicular, recovery luteal).'],
['Deep Dive','Journal of Medical Internet Research','Oct 2024','Digital health interventions for PMOS: apps, wearables, and telehealth','Systematic review of 47 digital interventions: cycle tracking apps improve symptom awareness but not clinical outcomes; CBT-based apps reduce depression/anxiety (d=0.45); lifestyle coaching apps with human support achieve 45% weight loss; continuous glucose monitoring (CGM) provides real-time feedback improving dietary choices (HOMA-IR -14%); telehealth non-inferior to in-person for metabolic monitoring. Key engagement features: personalisation, social community, gamification, clinician integration. Barriers: data privacy, digital literacy, cost, lack of regulatory oversight. Recommends: prescribe evidence-based apps (NICE ORCHA rated), integrate with EHR, ensure clinician dashboard access.'],
['Deep Dive','Endocrine Connections','Sep 2024','PMOS and bone health: the oestrogen-androgen-bone triad','PMOS women have higher BMD at weight-bearing sites (L1L4 +8%, femoral neck +5%) due to androgen-mediated osteoblast stimulation and higher weight. However, vertebral fracture risk not reduced  altered bone microarchitecture (trabecular thinning) offsets density advantage. Anovulatory cycles reduce progesterone-mediated bone formation. Post-menopausal PMOS women lose BMD faster (-1.8%/yr vs -1.2%/yr). Vitamin D deficiency prevalent (65%). Recommendations: weight-bearing exercise, adequate calcium/vitamin D, consider BMD at menopause transition, caution with anti-androgen therapy in adolescents (potential peak bone mass impairment).'],
['Deep Dive','Fertility and Sterility Reviews','Aug 2024','Male factor infertility in partners of women with PMOS: shared lifestyle and genetic links','Couple-based analysis (N=800 couples) showing partners of PMOS women have 1.8x higher rates of oligoasthenoteratozoospermia, lower testosterone, higher insulin resistance. Shared lifestyle: diet quality correlation r=0.62, activity correlation r=0.48. Genetic links: variants in FTO, INSR, DENND1A associated with both female PMOS and male spermatogenic parameters. Couple-based lifestyle intervention (N=120) achieved 35% pregnancy rate vs 22% in female-only intervention. Recommends: partner evaluation at fertility assessment, joint lifestyle counselling, consider male metabolic screening.'],
['Deep Dive','Journal of Adolescent Health','Jul 2024','Quality of life in adolescents with PMOS: validating the PCOS-QOL-PH tagalog version','Cross-cultural validation of PCOS-QOL in Filipino adolescents (N=320). Five domains: emotions (Cronbach =0.91), body hair (0.87), weight (0.89), infertility fears (0.84), menstrual (0.79). Mean score 62/100 (lower = worse QoL). Strongest predictors: BMI (=-0.41), hirsutism score (=-0.38), diagnostic delay (=-0.29). CBT-based group intervention (8 weeks) improved total QoL by 14 points (p<0.001). Highlights cultural stigma around hirsutism and weight in Filipino context. Recommends routine QoL screening and culturally adapted psychosocial support.'],
['Deep Dive','Climacteric','Jun 2024','PMOS after menopause: the long shadow of androgen excess','Post-menopausal PMOS women (N=1,200) vs controls: persistent hyperandrogenism (testosterone 0.9 vs 0.4 nmol/L), worse metabolic syndrome (58% vs 38%), higher CVD events (12% vs 7% over 10 yr), earlier onset osteoporosis despite higher lifetime androgen exposure. Mechanism: loss of oestrogen unmasks androgens adverse vascular effects; chronic inflammation accelerates vascular ageing. HRT considerations: transdermal oestrogen preferred (lower VTE risk); add micronised progesterone for endometrial protection; consider low-dose testosterone therapy contraindicated. Recommends lifelong cardiometabolic surveillance with annual lipid, glucose, BP, and CAC scoring from age 55.'],
['Deep Dive','European Journal of Endocrinology','May 2024','Vitamin D in PMOS: deficiency, supplementation, and causal inference','Mendelian randomisation (N=450,000) supports causal role of low vitamin D in PMOS pathogenesis (OR 1.12 per 10 nmol/L decrease). RCT meta-analysis (14 trials, N=1,100): vitamin D supplementation (20004000 IU/day, 1224 weeks) improves HOMA-IR by 12%, reduces testosterone by 15%, improves menstrual frequency by 1.2 cycles/3mo. Greater benefit in deficient (<30 nmol/L) and overweight/obese. Mechanism: VDR in theca cells regulates CYP17A1; vitamin D improves insulin receptor expression; immunomodulatory effects reduce ovarian inflammation. Recommends: screen 25(OH)D at diagnosis, target >50 nmol/L, dose 20004000 IU/day, recheck at 3 months.'],
['Deep Dive','Acta Obstetricia et Gynecologica Scandinavica','Apr 2024','Hereditary aspects of PMOS: familial aggregation and genetic risk scores','Family study (N=2,400 probands, 4,800 sisters, 2,400 mothers) showing sister RR 3.2, mother RR 2.1, daughter RR 2.8. GWAS meta-analysis (N=10,000 cases) identifies 14 genome-wide significant loci (DENND1A, THADA, LHCGR, FSHR, INSR, HMGA2, YAP1, RAB5B/SUOX, TOX3, RAD50, KRR1, C9orf3, FTO, SUMO1P1). Polygenic risk score (PRS) explains 8.5% variance; top decile PRS has 4.3x odds vs bottom decile. PRS correlates with earlier onset, higher androgen, worse insulin resistance. Clinical utility limited currently but may enable early risk stratification in relatives. Recommends family history as essential part of diagnostic assessment.'],
['Deep Dive','Journal of Clinical Medicine','Mar 2024','Complementary and alternative medicine in PMOS: evidence map and safety','Evidence map of 156 studies: acupuncture (12 RCTs)  modest improvement in ovulation rate (RR 1.32), limited androgen reduction; cinnamon (6 RCTs)  0.3% HbA1c reduction, menstrual improvement; spearmint tea (2 RCTs)  free testosterone -18% but no hirsutism change; NAC (8 RCTs)  HOMA-IR -0.5, ovulation +25%; berberine (5 RCTs)  comparable to metformin for insulin sensitivity, fewer GI side effects; myo-inositol (23 RCTs)  most robust evidence, HOMA-IR -22%, ovulation +40%. Safety concerns: herb-drug interactions (St Johns wort reduces COC efficacy), heavy metal contamination in unregulated products, lack of standardisation. Recommends: discuss CAM use openly, prioritise evidence-based supplements (inositol, NAC, berberine), avoid during pregnancy unless proven safe.'],
['Deep Dive','International Journal of Obesity','Feb 2024','Weight stigma in PMOS healthcare: prevalence, impact, and mitigation','Survey of 1,200 PMOS women: 68% experienced weight stigma in healthcare; 34% delayed care due to anticipated stigma; 22% avoided reproductive care. Stigma associated with: higher depression (OR 2.4), lower treatment adherence (OR 0.45), worse metabolic outcomes (HOMA-IR +18%). Provider survey (N=400): 42% endorsed "weight is entirely controllable," 31% felt "frustrated" treating PMOS patients. Mitigation: weight-inclusive care training (improved provider attitudes d=0.6), BMI-blind clinical pathways, focus on health behaviours not weight, patient advocacy in clinic design. Recommends: adopt weight-neutral language, assess for internalised weight bias, refer to HAES-aligned providers if requested.'],

const readStore=()=>J('bloom_read',{});

function setRead(idx,on){const s=readStore();
 if(on){if(typeof s[idx]==='string'&&s[idx]===today())return;s[idx]=today()}
 else{if(!s[idx])return;delete s[idx]}

function readMins(t){const w=t.split(/\s+/).filter(x=>x.length>0).length;return Math.max(1,Math.round(w/200))}
const IL=(()=>{const by={};ARTICLES.forEach((a,i)=>{(by[a[0]]=by[a[0]]||[]).push(i)});
 const cats=Object.keys(by).sort(),out=[];let last=-1;
 while(out.length<ARTICLES.length){let best=-1,bestN=-1;
  for(let k=0;k<cats.length;k++){const n=by[cats[k]].length;if(!n)continue;
   if(k===last&&cats.some((cc,j)=>j!==k&&by[cc].length))continue;
   if(n>bestN){bestN=n;best=k}}
  if(best<0)break;out.push(by[cats[best]].shift());last=best}
 return out})();
function dailyPlan(d){const dn=Math.floor(new Date(d+'T12:00').getTime()/864e5);
 const n=5+(dn%6),start=((dn*n)%IL.length+IL.length)%IL.length,out=[];
 for(let k=0;k<n;k++)out.push(IL[(start+k)%IL.length]);return out}

 for(const i of plan){if(!isRead(i)){next=i;break}}
 return{plan,readToday,planDone,left:plan.length-planDone,total:plan.length,
  pct:plan.length?Math.min(100,Math.round(readToday/plan.length*100)):0,next}}

const REM_ID=1001;
const notifPlugin=()=>{const C=window.Capacitor;return (C&&C.Plugins&&C.Plugins.LocalNotifications)||null};
async function reminderCancel(){const LN=notifPlugin();if(!LN)return;

async function reminderSync(quiet){
 if(!D||!D.rem)return {native:false,off:true};
 const rem=D.rem,LN=notifPlugin();
 if(!LN)return {native:false,off:!rem.on};
 try{
  let p=await LN.checkPermissions();
  if(rem.on&&p.display!=='granted')p=await LN.requestPermissions();
  if(rem.on&&p.display!=='granted'){
   if(!quiet)toast('Allow notifications for Bloom in Android settings');
   return {native:true,blocked:true}}
  await reminderCancel();
  if(!rem.on)return {native:true,off:true};
  const [h,mi]=String(rem.time||'20:00').split(':').map(Number);
  await LN.schedule({notifications:[{
   id:REM_ID,title:'Bloom',body:'A moment to log how you feel today.',
   schedule:{on:{hour:isNaN(h)?20:h,minute:isNaN(mi)?0:mi}},
   smallIcon:'ic_stat_bloom',iconColor:'#B8456B'}]});
  if(!quiet)toast('Reminder set for '+String(rem.time||'20:00'));
  return {native:true,scheduled:true};
 }catch(e){
  if(!quiet)toast('Could not set the reminder');
  return {native:true,error:String((e&&e.message)||e)}}}

$('#main').innerHTML=`<h1>Profile</h1>

 document.querySelectorAll('#goals .chip').forEach(c=>c.onclick=()=>c.setAttribute('aria-pressed',c.getAttribute('aria-pressed')!=='true'));
 $('#sv').onclick=()=>{p.name=$('#nm').value.trim();p.goals=[...document.querySelectorAll('#goals .chip[aria-pressed=true]')].map(c=>c.textContent);D.rem={on:$('#rm').checked,time:$('#rt').value||'20:00'};save();applyTheme();toast('Saved');shell();try{notifyProfile(D.p.name,!!D.p.avatar)}catch(vs){}};

 const saveRem=async()=>{D.rem={on:$('#rm').checked,time:$('#rt').value||'20:00'};save();
  const r=await reminderSync(),note=document.getElementById('remNote');
  if(!r.native){toast('Saved');return}

  else if(r.error){if(note)note.textContent='The reminder could not be scheduled. Try again.'}
  else if(note)note.textContent='One reminder a day at '+D.rem.time+'.'};
 $('#rs').onclick=saveRem;$('#rt').onchange=saveRem;$('#rm').onchange=saveRem;

const SPLASH_MIN=2600,SPLASH_MAX=3200,RESUME_MIN=1800,RESUME_MAX=2400,SPLASH_AFTER_MS=180000;
let splashDone=false,splashAppReady=false,splashT0=0,splashMin=SPLASH_MIN;
function splashBgMark(){try{localStorage.setItem('bloom_last_bg',String(Date.now()))}catch(e){}}
function splashAwayMs(){try{const v=+localStorage.getItem('bloom_last_bg')||0;return v?Date.now()-v:null}catch(e){return null}}
function splashShouldShow(away){const a=away!=null&&away>=0?away:splashAwayMs();return a==null?true:a>=SPLASH_AFTER_MS}
function splashSkip(){const e=document.getElementById('splash');if(!e)return;e.classList.add('gone');e.style.display='none';splashDone=true}
const SPLASH_HTML=(()=>{const e=document.getElementById('splash');return e?e.outerHTML:''})();
function splashMount(){let e=document.getElementById('splash');
 if(!e&&SPLASH_HTML){document.body.insertAdjacentHTML('afterbegin',SPLASH_HTML);e=document.getElementById('splash')}
 if(!e)return null;
 e.classList.remove('gone');e.style.display='';return e}
function splashHide(){
 const e=document.getElementById('splash');
 if(!e||splashDone)return;splashDone=true;
 e.classList.add('gone');
 setTimeout(()=>{const x=document.getElementById('splash');if(x&&splashDone)x.style.display='none'},420);
}
function splashAppIsReady(){
 splashAppReady=true;
 if(Date.now()-splashT0>=splashMin)splashHide();
}
const SPLASH_PAL=['#e9a5ad','#d68f98','#cd818f','#b87082','#ac6476','#a15a6b'];
const splashPetalSVG=(c,c2)=>'<svg viewBox="-50 -60 100 120"><path d="M0,-56 C46,-42 52,22 0,58 C-52,22 -46,-42 0,-56Z" fill="'+c+'"/><path d="M0,-6 C22,-2 30,22 0,50 C-16,26 -12,8 0,-6Z" fill="'+c2+'" opacity=".9"/></svg>';
function splashPlay(replay){
 const stage=splashMount();if(!stage)return;
 splashT0=Date.now();splashDone=false;splashAppReady=!!replay;
 splashMin=replay?RESUME_MIN:SPLASH_MIN;
 const max=replay?RESUME_MAX:SPLASH_MAX;
 stage.querySelectorAll('#splashPetal').forEach(n=>n.remove());
 const W=Math.max(innerWidth,innerHeight),N=44;
 for(let i=0;i<N;i++){
  const d=document.createElement('div');d.id='splashPetal';
  const w=Math.min(innerWidth,innerHeight)*(.16+Math.random()*.3),h=w*1.15;
  d.style.setProperty('--w',w+'px');d.style.setProperty('--h',h+'px');
  const ci=Math.floor(Math.random()*4);
  d.innerHTML=splashPetalSVG(SPLASH_PAL[ci],SPLASH_PAL[Math.min(5,ci+2)]);stage.appendChild(d);
  const a=(i/N)*Math.PI*2+Math.random()*.4,dist=W*(.65+Math.random()*.55);
  const dx=Math.cos(a)*dist,dy=Math.sin(a)*dist,rot=(Math.random()<.5?-1:1)*(300+Math.random()*500);
  const r0=Math.random()*360,delay=1900+Math.random()*500;
  d.animate([
   {opacity:0,transform:'translate(0,0) scale(.15) rotate('+r0+'deg)',offset:0},
   {opacity:1,transform:'translate('+(dx*.1)+'px,'+(dy*.1)+'px) scale(.7) rotate('+(r0+rot*.1)+'deg)',offset:.1},
   {opacity:1,transform:'translate('+(dx*.6)+'px,'+(dy*.6)+'px) scale(1.3) rotate('+(r0+rot*.6)+'deg)',offset:.7},
   {opacity:0,transform:'translate('+dx+'px,'+dy+'px) scale(1.5) rotate('+(r0+rot)+'deg)',offset:1}
  ],{duration:1300+Math.random()*350,delay:delay,easing:'cubic-bezier(.15,.7,.3,1)',fill:'both'});
 }
 document.body.classList.remove('splashPlay');void document.body.offsetWidth;document.body.classList.add('splashPlay');
 setTimeout(()=>{if(splashAppReady)splashHide()},splashMin);
 setTimeout(()=>splashHide(),max);
 setTimeout(()=>{const h=document.getElementById('splashHint');if(h&&!splashDone)h.style.opacity=.9},max+200);
 const hint=document.getElementById('splashHint');if(hint)hint.style.opacity=0;
 stage.onclick=()=>{if(splashDone)return;splashPlay(false)};
}
// called by the native layer when the app comes back to the foreground
window.__bloomResume=(awayMs)=>{if(!splashShouldShow(awayMs))return;splashPlay(true)};
window.addEventListener('online',()=>{sbInit().then(()=>{if(sbUser&&!RO)sbPush()});setTimeout(()=>checkUpdate(false),800)});
// called by the native layer when the app goes to the background
window.__bloomBg=()=>splashBgMark();
document.addEventListener('visibilitychange',()=>{if(document.hidden)splashBgMark()});
window.addEventListener('pagehide',()=>splashBgMark());
window.addEventListener('beforeunload',()=>splashBgMark());

// older builds saved every logged meal as Snack; re-type logged meals by exact DB-name match
function backfillMeals(){try{if(!D||!D.meals)return;let fix=0;
 for(const d of Object.keys(D.meals)){const arr=D.meals[d];if(!Array.isArray(arr))continue;
  arr.forEach(x=>{const m=MEALS.find(k=>k.n===x.n);if(m&&x.t!==m.t){x.t=m.t;fix++}})}
 if(fix){save()}}catch(e){}}
// ---------- start
if(splashShouldShow())splashPlay();else splashSkip();  // only after 3 minutes away
(async()=>{const s=getSession();
 // update check runs for everyone, signed in or not
 setTimeout(()=>{try{checkUpdate(false)}catch(e){}},2400);
 if(s&&String(s).indexOf('p:')===0){const owner=String(s).slice(2);
  RO=true;ROcloud=true;ROowner=owner;
  const cached=J(key(owner),{});
  D=Object.assign(blank(),cached||{});backfillMeals();view='cycle';shell();
  sbInit().then(async()=>{try{const doc=await sbFetchDoc(owner);
   if(doc&&(Object.keys(doc.logs||{}).length||Object.keys(doc.tasks||[]).length)){
    D=Object.assign(blank(),doc);roHash=roHashOf(JSON.stringify(doc));shell()}
   if(sbUser&&!playCh){try{await playJoin()}catch(ej){}}}catch(e){}});
  return}
 await sbInit();
 if(sbUser&&!RO){try{await sbAfterLogin(sbUser);backfillMeals();setTimeout(()=>checkUpdate(false),1500);return}catch(e){}}
 // no usable session -> the account screen (needs internet)
 authView('in')})();
