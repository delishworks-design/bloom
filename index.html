// ---------- flower splash ----------
const SPLASH_MIN=2600,SPLASH_MAX=3200,RESUME_MIN=1800,RESUME_MAX=2400,SPLASH_AFTER_MS=180000;
let splashDone=false,splashAppReady=false,splashT0=0,splashMin=SPLASH_MIN;
function splashBgMark(){try{localStorage.setItem('bloom_last_bg',String(Date.now()))}catch(e){}}
function splashAwayMs(){try{const v=+localStorage.getItem('bloom_last_bg')||0;return v?Date.now()-v:null}catch(e){return null}}
function splashShouldShow(away){const a=away!=null&&away>=0?away:splashAwayMs();return a==null?true:a>=SPLASH_AFTER_MS}
function splashSkip(){const e=document.getElementById('splash');if(!e)return;e.classList.add('gone');e.style.display='none';splashDone=true}
const SPLASH_HTML=(()=>{const e=document.getElementById('splash');return e?e.outerHTML:''})();
function splashMount(){let e=document.getElementById('splash');
 if(!e&&SPLASH_HTML){document.body.insertAdjacentHTML('afterbegin',SPLASH_HTML);e=document.getElementById('splash')}
 if(!e)return null;
 e.classList.remove('gone');e.style.display='';return e}
function splashHide(){
 const e=document.getElementById('splash');
 if(!e||splashDone)return;splashDone=true;
 e.classList.add('gone');
 setTimeout(()=>{const x=document.getElementById('splash');if(x&&splashDone)x.style.display='none'},420);
}
function splashAppIsReady(){
 splashAppReady=true;
 if(Date.now()-splashT0>=splashMin)splashHide();
}
const SPLASH_PAL=['#e9a5ad','#d68f98','#cd818f','#b87082','#ac6476','#a15a6b'];
const splashPetalSVG=(c,c2)=>'<svg viewBox="-50 -60 100 120"><path d="M0,-56 C46,-42 52,22 0,58 C-52,22 -46,-42 0,-56Z" fill="'+c+'"/><path d="M0,-6 C22,-2 30,22 0,50 C-16,26 -12,8 0,-6Z" fill="'+c2+'" opacity=".9"/></svg>';
function splashPlay(replay){
 const stage=splashMount();if(!stage)return;
 splashT0=Date.now();splashDone=false;splashAppReady=!!replay;
 splashMin=replay?RESUME_MIN:SPLASH_MIN;
 const max=replay?RESUME_MAX:SPLASH_MAX;
 stage.querySelectorAll('#splashPetal').forEach(n=>n.remove());
 const W=Math.max(innerWidth,innerHeight),N=44;
 for(let i=0;i<N;i++){
  const d=document.createElement('div');d.id='splashPetal';
  const w=Math.min(innerWidth,innerHeight)*(.16+Math.random()*.3),h=w*1.15;
  d.style.setProperty('--w',w+'px');d.style.setProperty('--h',h+'px');
  const ci=Math.floor(Math.random()*4);
  d.innerHTML=splashPetalSVG(SPLASH_PAL[ci],SPLASH_PAL[Math.min(5,ci+2)]);stage.appendChild(d);
  const a=(i/N)*Math.PI*2+Math.random()*.4,dist=W*(.65+Math.random()*.55);
  const dx=Math.cos(a)*dist,dy=Math.sin(a)*dist,rot=(Math.random()<.5?-1:1)*(300+Math.random()*500);
  const r0=Math.random()*360,delay=1900+Math.random()*500;
  d.animate([
   {opacity:0,transform:'translate(0,0) scale(.15) rotate('+r0+'deg)',offset:0},
   {opacity:1,transform:'translate('+(dx*.1)+'px,'+(dy*.1)+'px) scale(.7) rotate('+(r0+rot*.1)+'deg)',offset:.1},
   {opacity:1,transform:'translate('+(dx*.6)+'px,'+(dy*.6)+'px) scale(1.3) rotate('+(r0+rot*.6)+'deg)',offset:.7},
   {opacity:0,transform:'translate('+dx+'px,'+dy+'px) scale(1.5) rotate('+(r0+rot)+'deg)',offset:1}
  ],{duration:1300+Math.random()*350,delay:delay,easing:'cubic-bezier(.15,.7,.3,1)',fill:'both'});
 }
 document.body.classList.remove('splashPlay');void document.body.offsetWidth;document.body.classList.add('splashPlay');
 setTimeout(()=>{if(splashAppReady)splashHide()},splashMin);
 setTimeout(()=>splashHide(),max);
 setTimeout(()=>{const h=document.getElementById('splashHint');if(h&&!splashDone)h.style.opacity=.9},max+200);
 const hint=document.getElementById('splashHint');if(hint)hint.style.opacity=0;
 stage.onclick=()=>{if(splashDone)return;splashPlay(false)};
}
// called by the native layer when the app comes back to the foreground
window.__bloomResume=(awayMs)=>{if(!splashShouldShow(awayMs))return;splashPlay(true)};
// called by the native layer when the app goes to the background
window.__bloomBg=()=>splashBgMark();
document.addEventListener('visibilitychange',()=>{if(document.hidden)splashBgMark()});
window.addEventListener('pagehide',()=>splashBgMark());
window.addEventListener('beforeunload',()=>splashBgMark());

if(splashShouldShow())splashPlay();else splashSkip();  // only after 3 minutes away
