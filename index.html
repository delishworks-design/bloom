<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloom  PMOS Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Sansita:wght@400;700&display=swap" rel="stylesheet">
<script src="supabase-bundle.js" defer></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Sansita:wght@400;700&display=swap');
:root{
  --bg:#FBF4EA;--card:#FFFBF5;--ink:#3A2E33;--mut:#7C6B71;
  --pink:#E8A0B4;--rose:#B8456B;--teal:#2A8A87;--tealS:#D6ECEA;--pinkS:#F9DDE5;
  --line:#EADFD2;--sh:0 2px 10px rgba(120,70,80,.08);--shb:0 12px 34px rgba(120,70,80,.16);
  color-scheme: light !important;
}
*{box-sizing:border-box}
html{scrollbar-gutter:stable}
html,body{margin:0;padding:0;min-height:100%;overflow-x:hidden;background:#FBF4EA !important;color:#3A2E33 !important;color-scheme:light !important}
body::before{content:'';position:fixed;z-index:0;top:0;left:0;right:0;height:170px;background:linear-gradient(180deg,rgba(58,46,51,.075),rgba(58,46,51,0));pointer-events:none}
body{font-family:Sansita,system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;background:#FBF4EA !important}
#app,#sheet,#toast{background:#FBF4EA}
@media (prefers-color-scheme: dark){
  :root,html,body,#app,.wrap,.card,.sheet>div,nav,input,select,textarea{color-scheme:light !important;background:#FBF4EA !important;background-color:#FBF4EA !important;color:#3A2E33 !important}
  input,select,textarea{background:#FFFBF5 !important;color:#3A2E33 !important;border-color:#EADFD2 !important}
  .card,nav,.sheet>div{background:#FFFBF5 !important}
}

/* Type hierarchy - fixed */
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:700;line-height:1.2;letter-spacing:-.01em;margin:0}
h1{font-size:28px;margin-bottom:12px}
h2{font-size:22px;margin-bottom:8px}
h3{font-size:18px;margin-bottom:4px}
p{margin:0;line-height:1.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.blob{position:fixed;border-radius:50%;filter:blur(48px);pointer-events:none;z-index:0;opacity:.7}
.blob-a{width:78vw;max-width:340px;aspect-ratio:1;top:-14%;right:-18%;background:radial-gradient(60% 60% at 50% 50%,#F9DDE5 0%,#FBF4EA 62%,transparent 78%)}
.blob-b{width:82vw;max-width:360px;aspect-ratio:1;bottom:-6%;left:-24%;background:radial-gradient(55% 55% at 50% 50%,#D6ECEA 0%,#FBF4EA 55%,transparent 75%)}
.blob-c{width:40vw;max-width:180px;aspect-ratio:1;top:36%;left:42%;background:radial-gradient(circle,#F9DDE5 0%,transparent 70%);opacity:.45}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes ringIn{from{opacity:0;transform:scale(.92) rotate(-3deg)}to{opacity:1;transform:scale(1) rotate(0)}}

/* Layout hierarchy */
.wrap{position:relative;z-index:1;max-width:430px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 20px 120px;min-height:100dvh;background:#FBF4EA;display:flex;flex-direction:column;gap:18px}
.wrap>*{flex:0 0 auto}
#main{display:flex;flex-direction:column;gap:20px}
#pb{display:flex;flex-direction:column;gap:14px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:2px 0 8px;min-height:54px;animation:fadeUp .5s ease both}
.pchip{display:inline-flex !important;align-items:center !important;height:38px !important;padding:0 14px !important;border-radius:999px !important;background:var(--pinkS) !important;border:1.5px solid rgba(232,160,180,.6) !important;color:var(--rose) !important;font-size:.74rem !important;font-weight:700 !important;white-space:nowrap}
.wordmark{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;color:#B8456B;line-height:1}
.wordmark i{font-size:20px;font-weight:400;font-style:normal;vertical-align:super;margin-left:2px}

/* Cards - hierarchy */
.card{background:#FFFBF5 !important;border:1.5px solid #EADFD2;border-radius:22px;padding:18px 16px;box-shadow:0 2px 10px rgba(120,70,80,.08);display:flex;flex-direction:column;gap:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:2px;border-bottom:0}
.card-h h3{font-size:17px;line-height:1.2;margin:0}
.btn{position:relative;padding:14px 24px;border-radius:16px;border:none;font:inherit;font-weight:700;font-size:1rem;color:#FBF4EA;background:linear-gradient(180deg,#C4567A 0%,#B8456B 100%);cursor:pointer;transition:transform .08s,box-shadow .15s,filter .15s;box-shadow:0 4px 14px rgba(184,69,107,.35),0 2px 6px rgba(120,70,80,.15),inset 0 1px 0 rgba(255,255,255,.25);overflow:hidden}
.btn::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.25) 0%,transparent 50%,rgba(0,0,0,.15) 100%);pointer-events:none}
.btn:active{transform:translateY(2px) scale(.99);box-shadow:0 2px 6px rgba(184,69,107,.3),0 1px 3px rgba(120,70,80,.12),inset 0 1px 3px rgba(0,0,0,.2);filter:brightness(.98)}
.btn:focus-visible{outline:2px solid #B8456B;outline-offset:3px}
.btn.ghost{background:transparent;color:#B8456B;box-shadow:none;border:1.5px solid rgba(232,160,180,.6)}
.btn.ghost::before{display:none}
.btn.ghost:active{background:#F9DDE5;transform:translateY(1px) scale(.99)}
.btn.sm{padding:10px 16px;font-size:.875rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;border:1.5px solid #EADFD2;background:#FFFBF5;color:#3A2E33;font:inherit;font-size:.875rem;font-weight:600;cursor:pointer;transition:all .15s;box-shadow:0 2px 6px rgba(120,70,80,.08)}
.chip:hover{border-color:#E8A0B4;background:#FFF8F5;box-shadow:0 4px 12px rgba(184,69,107,.15);transform:translateY(-1px)}
.chip:active{transform:translateY(1px);box-shadow:0 1px 3px rgba(120,70,80,.1)}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,#FFF0F5 0%,#F9DDE5 100%);border-color:#E8A0B4;color:#B8456B;box-shadow:0 4px 14px rgba(184,69,107,.25),inset 0 1px 0 rgba(255,255,255,.3)}
.article-full{max-width:720px;margin:0 auto;padding:0 4px}
.statcard{background:#FFFBF5;border:1.5px solid #EADFD2;border-radius:14px;padding:16px 12px;text-align:center}
.statnum{display:block;font-size:1.8rem;font-weight:800;color:#B8456B;line-height:1.2;font-family:'Playfair Display',serif}
.statlbl{display:block;font-size:.75rem;color:#7C6B71;margin-top:4px;text-transform:uppercase;letter-spacing:.05em}
.artbody p{margin:0 0 1.2em}
.artbody strong{color:#B8456B}
.field-btn{width:100%;text-align:left;padding:14px 16px;background:#F9F2ED;border:1.5px solid #EADFD2;border-radius:14px;color:#3A2E33;font:inherit;font-size:1rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:background .15s,border-color .15s}
.field-btn:hover{background:#F1E6D7;border-color:#E8A0B4}
.field-btn:focus-visible{outline:2px solid #B8456B;outline-offset:2px}
.field-btn .chev{color:#7C6B71;font-size:.8rem}
.pickrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;background:#FFFBF5;border:1.5px solid #EADFD2;border-radius:14px;font:inherit;font-size:.92rem;font-weight:600;color:#3A2E33;cursor:pointer;transition:all .15s}
.pickrow:hover{border-color:#E8A0B4;background:#FFF8F5;box-shadow:0 4px 12px rgba(184,69,107,.1)}
.pickrow .sub{font-size:.75rem;color:#7C6B71;font-weight:400;margin-left:auto;white-space:nowrap}
.cal button:disabled{opacity:.3}
.rolepick{display:flex;flex-direction:column;gap:10px}
.rolebtn{display:flex;flex-direction:column;gap:4px;text-align:left;padding:15px 16px;background:#FFFBF5;border:1.5px solid #EADFD2;border-radius:16px;font:inherit;cursor:pointer;transition:all .15s}
.rolebtn:hover{border-color:#E8A0B4;background:#FFF8F5;box-shadow:0 4px 14px rgba(184,69,107,.12);transform:translateY(-1px)}
.rolebtn:active{transform:translateY(1px)}
.rolebtn b{font-size:1rem;font-weight:700;color:#3A2E33;line-height:1.3}
.rolebtn span{font-size:.82rem;color:#7C6B71;line-height:1.4}
.spark{height:48px;margin-top:8px}
.spark svg{width:100%;height:100%;display:block}
.spark.empty{height:auto;font-size:.78rem;color:#7C6B71;opacity:.8;line-height:1.4}
.meta{color:#7C6B71;font-size:.84rem;line-height:1.4}
.lbl{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7C6B71;line-height:1.2;display:block;margin-bottom:6px}

/* Buttons - perfect center fix */
button{font-family:Sansita,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.btn{display:inline-flex !important;align-items:center !important;justify-content:center !important;gap:8px;text-align:center !important;line-height:1 !important;white-space:nowrap !important;background:#2A8A87 !important;color:#fff !important;border:0 !important;border-radius:999px !important;padding:0 24px !important;min-height:48px !important;cursor:pointer;font:inherit;font-weight:700 !important;box-shadow:0 4px 14px rgba(42,138,135,.24)}
.btn.pink{background:#B8456B !important;box-shadow:0 4px 14px rgba(184,69,107,.24) !important}
.btn.ghost{background:#FFFBF5 !important;color:#2A8A87 !important;border:1.5px solid #2A8A87 !important;box-shadow:none !important}
.btn.sm{min-height:36px !important;padding:0 16px !important;font-size:.88rem !important}
.profbtn{display:inline-flex !important;align-items:center !important;gap:10px !important;height:52px !important;padding:4px 16px 4px 4px !important;border-radius:999px !important;background:#FFFBF5 !important;border:1.5px solid #EADFD2 !important;box-shadow:0 2px 8px rgba(120,70,80,.06) !important;color:#3A2E33 !important;font-weight:700 !important;line-height:1 !important;white-space:nowrap !important;max-width:62% !important}
.profbtn span{line-height:1 !important;overflow:hidden;text-overflow:ellipsis}
.logpill{width:100% !important;max-width:340px !important;margin:12px auto 0 !important;height:56px !important;border-radius:999px !important;background:#B8456B !important;color:#fff !important;display:flex !important;align-items:center !important;justify-content:center !important;gap:10px !important;font-weight:700 !important;box-shadow:0 8px 20px rgba(184,69,107,.3) !important;border:0 !important}
.logpill .plus{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.24);display:grid;place-items:center;flex-shrink:0}

/* Chips */
.card>label{margin-top:0 !important}
.chipfield{display:flex;flex-direction:column;gap:8px}
.chipfield .lbl{margin:0}
.chiprow{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex !important;align-items:center !important;justify-content:center !important;gap:6px;text-align:center !important;line-height:1 !important;white-space:nowrap !important;border:1.5px solid #EADFD2 !important;background:#FFFBF5 !important;border-radius:999px !important;padding:0 18px !important;min-height:40px !important;font-size:.9rem !important;color:#3A2E33 !important;cursor:pointer}
.chip[aria-pressed=true]{background:#F9DDE5 !important;border-color:#B8456B !important;color:#B8456B !important;font-weight:700 !important}

/* QA */
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa button{background:#D6ECEA !important;border:1.5px solid #C8E2E0 !important;border-radius:16px !important;padding:12px 6px !important;min-height:68px !important;display:flex !important;flex-direction:column !important;align-items:center !important;justify-content:center !important;text-align:center !important;gap:5px !important;font-size:.82rem !important;line-height:1.25 !important;color:#3A2E33 !important}
/* floating quick actions */
.fab{position:fixed;left:0;top:0;width:58px;height:58px;box-sizing:border-box;border-radius:50%;display:grid;place-items:center;padding:0;border:0;background:none;box-shadow:none;z-index:6;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:none;transition:left .22s cubic-bezier(.2,.9,.25,1),top .22s cubic-bezier(.2,.9,.25,1),transform .16s}
.fab.drag{transition:none}
.fab:active{transform:scale(.96)}
.fab:focus-visible{outline:2px solid #B8456B;outline-offset:3px}
.fab img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 6px 12px rgba(120,70,80,.32))}
.qaic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#D6ECEA;color:#2A8A87}
.qaring{position:fixed;inset:0;z-index:8;touch-action:none}
.qaring-scrim{position:absolute;inset:0;background:rgba(58,46,51,.30);opacity:0;transition:opacity .25s}
.qaring.on .qaring-scrim{opacity:1}
.qaring-core{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;box-sizing:border-box;padding:0;border:0;border-radius:50%;background:none;display:grid;place-items:center;cursor:pointer;transform:translate(var(--sx,0px),var(--sy,0px)) rotate(0deg) scale(1);transition:transform .75s cubic-bezier(.2,.9,.25,1);z-index:2}
.qaring.on .qaring-core{transform:translate(0,0) rotate(720deg) scale(1.06)}
.fab:focus,.fab:focus-visible,.qaring-core:focus,.qaring-core:focus-visible{outline:0}
.qaring-core img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 8px 18px rgba(120,70,80,.38))}
.qaring-item{position:absolute;left:50%;top:50%;width:80px;height:94px;margin:-47px 0 0 -40px;padding:0;border:0;background:none;cursor:pointer;transform-origin:50% 50%;transform:translate(0,0) rotate(calc(var(--r,0deg) + var(--spin,0deg))) scale(.15);opacity:0;transition:transform .74s cubic-bezier(.16,1.15,.3,1),opacity .22s;transition-delay:var(--d,0s);z-index:1;outline:0;-webkit-tap-highlight-color:transparent}
.qaring:not(.on) .qaring-item{transition-delay:0s}
.qaring.on .qaring-item{transform:translate(var(--x),var(--y)) rotate(var(--r,0deg)) scale(1);opacity:1}
.petal-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 7px 16px rgba(184,69,107,.18))}
.petal-fill{fill:#F9DDE5}
.petal-back{fill:#F7D2DE;opacity:.95}

.qaring-item:nth-child(odd) .petal-fill{fill:#F5CFDA}
.qaring-item:nth-child(odd) .petal-back{fill:#F2C4D1}
.petal-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding-top:2px;transform:rotate(calc(-1 * var(--r,0deg)));color:#B8456B;pointer-events:none}
.pi{display:grid;place-items:center;width:24px;height:24px}
.pl{font-size:.58rem;font-weight:700;line-height:1;color:#8E3454;white-space:nowrap}

/* Tiles */

/* Avatar */
.avatar{border-radius:50%;object-fit:cover;display:block;flex:0 0 auto;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.avatar-wrap{display:block;flex:0 0 auto;position:relative;overflow:hidden;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.08);background:#F9F2ED}
.avatar-wrap .avatar{width:100%;height:100%;border:0;border-radius:0;box-shadow:none;object-fit:cover}
.adjbox{width:min(64vw,250px);aspect-ratio:1;margin:0 auto;border-radius:20px;overflow:hidden;background:#F9F2ED;border:1.5px solid #EADFD2;touch-action:none;cursor:grab}
.adjbox:active{cursor:grabbing}
.adjbox img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent !important;padding:0 !important;border:0 !important;box-shadow:none !important}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:#EADFD2}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:#B8456B;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);margin-top:-10px}
.avatar-fb{border-radius:50%;background:linear-gradient(135deg,#F9DDE5,#D6ECEA) !important;display:grid;place-items:center;font-family:'Playfair Display',serif;font-weight:700;color:#B8456B;flex:0 0 auto;border:2px solid #fff}

/* Greet hierarchy */
.greet{animation:fadeUp .5s ease .1s both;display:flex;flex-direction:column;gap:4px;padding:4px 0 6px}
.greet .hi{font-family:'Playfair Display',serif;font-size:22px;font-weight:500;line-height:1.2;color:#3A2E33}
.greet .nm{font-size:36px;line-height:1;font-weight:700;color:#3A2E33;letter-spacing:-.02em}
.greet .date{margin-top:8px;font-size:.9rem;font-style:italic;color:#B8456B;line-height:1.3}

/* Ring - beautiful light version */
.ringlbl{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#7C6B71;line-height:1;margin-left:.2em}
.ringwrap{position:relative;width:100%;max-width:340px;aspect-ratio:1;margin:4px auto 8px;animation:ringIn .8s cubic-bezier(.16,1,.3,1) .15s both;display:grid;place-items:center}
.ringdisc{position:absolute;inset:13%;border-radius:50%;background:radial-gradient(100% 100% at 50% 18%, #FFFFFF 0%, #FFFBF5 58%, #FBF4EA 100%);box-shadow:inset 0 1px 0 #fff,0 12px 32px rgba(120,70,80,.07);pointer-events:none;border:1px solid rgba(234,223,210,.6)}
.ringcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;z-index:2;pointer-events:none}
.ringday{font-family:'Playfair Display',serif;font-size:58px;line-height:.88;font-weight:700;color:#3A2E33;letter-spacing:-.035em}
.ringcap{margin-top:4px;font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#7C6B71;max-width:180px;line-height:1.3;text-align:center}
.ringpill{margin-top:10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;min-height:30px;border-radius:999px;background:#FFFBF5 !important;border:1.5px solid #EADFD2 !important;box-shadow:0 2px 8px rgba(120,70,80,.08) !important;font-size:.8rem;font-weight:700;color:#3A2E33 !important;line-height:1}
.ringwrap svg{position:relative;z-index:1;width:100%;height:100%;display:block}

/* Stats */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:6px 0 2px}
.stat{background:#FFFBF5 !important;border:1.5px solid #EADFD2 !important;border-radius:18px;padding:16px 8px !important;box-shadow:0 2px 10px rgba(120,70,80,.06) !important;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.stat .ic{width:26px;height:26px;border-radius:50%;background:#F9DDE5 !important;display:grid;place-items:center;color:#B8456B !important;margin-bottom:4px}
.stat b{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:#3A2E33;line-height:1.1}
.stat b.word{font-size:14px;line-height:1.2}
.stat .lbl{margin-top:2px}

/* Forms */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
input,select,textarea{font:inherit;color:#3A2E33 !important;width:100%;padding:13px 16px !important;border-radius:14px !important;border:1.5px solid #EADFD2 !important;background:#FFFBF5 !important;margin:6px 0 14px !important;line-height:1.3 !important;box-shadow:0 1px 2px rgba(120,70,80,.04) !important}
textarea{resize:none !important;overflow:hidden !important;min-height:78px}
textarea.grow{overflow-y:auto !important}
input:focus,select:focus,textarea:focus{border-color:#B8456B !important;background:#fff !important;outline:none !important}
label{display:block;font-size:.86rem;color:#7C6B71 !important;margin-top:16px !important;margin-bottom:6px !important;line-height:1.2 !important;font-weight:700 !important;letter-spacing:.01em}
.ck{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed #EADFD2;line-height:1.3;flex:1 1 auto;min-width:0}
.ck input{width:22px;height:22px;margin:0;accent-color:#B8456B;flex:0 0 auto}
.ckt{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;word-break:break-word;color:#3A2E33;font-size:1rem}
.cklist .ck:last-child{border-bottom:0}
.taskrow{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;min-width:0;padding:0;border-bottom:1px dashed #EADFD2}
.taskrow .ck{border-bottom:0;padding:11px 0}
.taskrow:last-child{border-bottom:0}
.taskrow .del{width:30px;height:30px;min-height:30px;padding:0;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;font-size:.95rem;line-height:1}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.calh{font-size:.68rem;font-weight:700;color:#7C6B71;line-height:1;text-align:center;padding:4px 0 2px}
.cal button{position:relative !important;aspect-ratio:1;border:1.5px solid #EADFD2 !important;border-radius:11px !important;background:#FFFBF5 !important;min-height:36px !important;display:flex !important;align-items:center !important;justify-content:center !important;flex-direction:column !important;gap:2px !important;line-height:1 !important;color:#3A2E33 !important;font-weight:700 !important;font-size:.9rem !important;box-shadow:0 1px 3px rgba(120,70,80,.05) !important}
.cal .p{background:#E8A0B4 !important;color:#fff !important;border-color:#E8A0B4 !important;box-shadow:0 4px 12px rgba(232,160,180,.35) !important}
.cal .s{background:#F9DDE5 !important}.cal .t{outline:2.5px solid #2A8A87 !important;outline-offset:1px}
.cal .d::after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#2A8A87}

/* Sheet - light */
.sheet{position:fixed;inset:0;background:rgba(58,46,51,.35) !important;backdrop-filter:blur(8px);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:#FFFBF5 !important;width:100%;max-width:430px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0 !important;padding:24px 20px 28px !important;box-shadow:0 -16px 40px rgba(120,70,80,.18) !important;display:flex;flex-direction:column;gap:14px;border:1.5px solid #EADFD2 !important;border-bottom:0 !important}
.sheet>div{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px)) !important}
.toast,#toast{display:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));bottom:auto;background:#3A2E33 !important;color:#FBF4EA !important;padding:12px 20px !important;border-radius:999px !important;z-index:12;font-size:.85rem;line-height:1;box-shadow:0 10px 24px rgba(0,0,0,.22) !important;animation:toastIn .28s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}

/* Auth */
.auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 20px;background:#FBF4EA !important}
.auth .card{max-width:420px;width:100%;margin:auto;padding:28px 24px 22px;gap:0;background:#FFFBF5 !important;display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:26px;box-shadow:0 12px 40px rgba(120,70,80,.12)}
.auth .card>*{flex:0 0 auto}
.auth-head{padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.auth .card .brand{margin:0 0 12px;font-size:1.9rem}
.auth .card h2{font-size:1.4rem;line-height:1.25;margin:0 0 6px}
.auth .lede{margin:0;font-size:.9rem;line-height:1.45;color:var(--mut)}
.auth .field{margin:0 0 16px}
.auth .field label{display:block;margin:0 0 7px !important;font-size:.84rem;letter-spacing:.01em;color:var(--mut) !important}
.auth .field input{margin:0 !important;padding:14px 15px !important;border-radius:14px !important;font-size:1rem;transition:border-color .15s,box-shadow .15s,background .15s}
.auth .field input:focus{border-color:var(--teal) !important;background:#fff !important;box-shadow:0 0 0 3px rgba(42,138,135,.14) !important}
.auth .field.invalid input{border-color:var(--rose) !important;box-shadow:0 0 0 3px rgba(184,69,107,.12) !important}
.auth .hint{display:none;margin:7px 0 0;font-size:.8rem;line-height:1.35;color:var(--rose)}
.auth .field.invalid .hint{display:block}
.auth .pwwrap{position:relative}
.auth .pwwrap input{padding-right:66px !important}
.auth .field input.code{text-align:center;text-transform:uppercase;letter-spacing:.22em;text-indent:.22em;font-size:1.3rem;font-weight:700;padding:16px 15px !important}
.auth .reveal{position:absolute;right:5px;top:50%;transform:translateY(-50%);height:34px;padding:0 10px;border:0;background:transparent;color:var(--teal);font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;border-radius:10px}
.auth .reveal:hover{background:var(--tealS)}
.auth .reveal:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.auth .rule{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-size:.8rem;line-height:1.3;color:var(--mut)}
.auth .rule::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line);flex:0 0 auto;transition:background .15s}
.auth .rule.ok{color:var(--teal)}
.auth .rule.ok::before{background:var(--teal)}
.auth .cons{display:flex !important;align-items:flex-start;gap:11px;margin:18px 0 0 !important;font-size:.86rem;font-weight:400 !important;line-height:1.4;letter-spacing:0;color:var(--ink) !important}
.auth .cons input[type=checkbox]{width:20px !important;height:20px !important;min-width:20px;margin:1px 0 0 !important}
.auth .err{display:none;margin:16px 0 0;padding:11px 13px;border-radius:12px;background:var(--pinkS);border:1px solid rgba(232,160,180,.8);color:var(--rose);font-size:.86rem;line-height:1.4}
.auth .err.on{display:block}
.auth .card #go{width:100%;min-height:50px !important;margin-top:20px !important}
.auth .card #go[disabled]{opacity:.75;cursor:default;transform:none}
.auth .spinner{display:inline-block;width:15px;height:15px;margin-right:9px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:authspin .7s linear infinite;vertical-align:-2px}
@keyframes authspin{to{transform:rotate(360deg)}}
.auth-foot{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.auth .status{display:inline-flex;align-items:center;gap:8px;margin:0;font-size:.8rem;line-height:1.3;color:var(--mut)}
.auth .status .dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:0 0 auto;transition:background .2s}
.auth .status.ok .dot{background:var(--teal)}
.auth .status.bad .dot{background:var(--rose)}
.auth .switch{margin:0;font-size:.9rem;line-height:1.4;color:var(--mut)}
.auth .link{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--teal);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px;text-decoration-color:rgba(42,138,135,.45)}
.auth .link:hover{text-decoration-color:var(--teal)}
.auth .link:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:4px}
input[type=checkbox]{width:22px !important;height:22px !important;min-width:22px;padding:0 !important;margin:0 !important;accent-color:#B8456B;flex:0 0 auto}
.brand{font-family:'Playfair Display',serif;color:#B8456B;font-size:2rem;line-height:1}
.err{color:#B8456B;font-size:.88rem;min-height:1.2em;line-height:1.3}

/* Details */
details{border-bottom:1px solid #EADFD2;padding:14px 0}summary{cursor:pointer;font-weight:700;line-height:1.3;list-style:none}
.bar{height:8px;border-radius:999px;background:#D6ECEA;overflow:hidden}.bar i{display:block;height:100%;background:#2A8A87}
.weekgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tabsrow{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:4px 0 8px;align-items:center}
.tabsrow::-webkit-scrollbar{display:none}
.tabsrow .chip{flex:0 0 auto;padding:0 14px !important;min-height:38px !important;font-size:.86rem !important}
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed #EADFD2}
.kv span{flex:1 1 auto;min-width:0}
.btn:disabled,.logpill:disabled,.chip:disabled,.glassbtn:disabled,.goalopt:disabled,.facebtn:disabled,.qa button:disabled{opacity:.45 !important;cursor:not-allowed !important;box-shadow:none !important}
.ck input:disabled{opacity:.5}
.syncbox{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border-radius:16px;background:#FBF4EA !important;border:1.5px dashed rgba(184,69,107,.45)}
.synccode{flex:1;font-family:'Playfair Display',serif;font-size:26px;font-weight:700;letter-spacing:.18em;color:#B8456B}
.linkrow{display:flex;align-items:center;gap:10px;margin-top:12px}
.linkbtn{background:none;border:0;padding:2px 0;font:inherit;font-size:.82rem;font-weight:600;color:var(--rose);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;text-decoration-color:rgba(184,69,107,.3)}
.linkdot{color:var(--mut);font-size:.8rem}
.fun{background:linear-gradient(180deg,#FDF3F0 0%,#F9DDE5 100%) !important;border-color:rgba(232,160,180,.35) !important;padding:12px 14px !important}
.funtext{font-family:'Playfair Display',serif;font-size:13.5px;line-height:1.4;color:#3A2E33;margin:0}
.artbody{font-size:.88rem;line-height:1.55;color:#5C4A50}
.kv b{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:#3A2E33}
.kv.kvstack{flex-direction:column;align-items:flex-start;gap:2px}
.kv.kvstack span{flex:0 0 auto;min-width:auto;font-weight:600}
.kv.kvstack b{font-family:inherit;font-size:.95rem;font-weight:600;line-height:1.5;text-align:left;overflow-wrap:anywhere;max-width:100%}
.divider{height:1px;background:#EADFD2;margin:16px 0}
.faces{display:flex;gap:8px;justify-content:space-between;margin:8px 0}
.facebtn{flex:1;background:#FFFBF5 !important;border:1.5px solid #EADFD2 !important;padding:8px 4px !important;border-radius:16px !important;opacity:.55;min-height:58px !important;display:grid !important;place-items:center !important}
.facebtn.on{opacity:1 !important;transform:translateY(-2px);border-color:#B8456B !important;background:#F9DDE5 !important;box-shadow:0 2px 8px rgba(120,70,80,.08) !important}
.glasses{display:flex;justify-content:center;align-items:center;gap:4px;flex-wrap:wrap;margin:16px 0 14px}
.glassbtn{flex:1 1 32px;min-width:32px;max-width:44px;height:44px;background:#FFFBF5 !important;border:1.5px solid #EADFD2 !important;border-radius:12px !important;padding:0 !important;opacity:.4;min-height:44px !important;display:grid !important;place-items:center !important}
.glassbtn.on{opacity:1 !important;transform:translateY(-1px);border-color:#2A8A87 !important;background:#D6ECEA !important}
.waterrow{display:flex;align-items:baseline;gap:6px}.watercount{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:#2A8A87}
.goalbox{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:9px 10px 9px 14px;border-radius:18px;background:#FBF4EA !important;border:1.5px solid #EADFD2 !important}
.goalbox .lbl{margin:0 !important}
.goalopts{display:flex;gap:3px;padding:3px;border-radius:13px;background:#FFFBF5 !important;border:1.5px solid #EADFD2 !important}
.goalopt{min-width:36px !important;height:30px !important;padding:0 9px !important;border:0 !important;border-radius:10px !important;background:transparent !important;color:#7C6B71 !important;font:inherit !important;font-size:.84rem !important;font-weight:700 !important;line-height:1 !important;cursor:pointer !important;transition:background .2s ease,color .2s ease}
.goalopt.on{background:#B8456B !important;color:#fff !important;box-shadow:0 2px 6px rgba(184,69,107,.28) !important}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:392px;height:68px;border-radius:28px;background:#FFFBF5 !important;border:1.5px solid #EADFD2 !important;box-shadow:0 12px 34px rgba(120,70,80,.16) !important;display:flex;align-items:center;justify-content:space-between;padding:6px;z-index:5;gap:4px}
nav button{flex:1;height:52px;border:0 !important;background:none !important;border-radius:20px !important;color:#7C6B71 !important;font-size:.72rem !important;font-weight:700 !important;display:flex !important;flex-direction:column !important;align-items:center !important;justify-content:center !important;gap:4px !important;line-height:1 !important;text-align:center !important}
nav button[aria-current=page]{background:#B8456B !important;color:#fff !important;box-shadow:0 6px 16px rgba(184,69,107,.28) !important}
/* Learn - daily reads */
.dr-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}
.dr-date{font-family:'Playfair Display',serif;font-size:1.06rem;font-weight:700;color:var(--ink);line-height:1.2}
.dr-streak{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;background:#F9DDE5;border:1px solid rgba(232,160,180,.45);color:#B8456B;font-size:.74rem;font-weight:700;white-space:nowrap;flex:0 0 auto}
.dr-card{background:#FFFBF5;border:1.5px solid #EADFD2;border-radius:18px;padding:16px 18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(120,70,80,.05)}
.dr-count{font-family:'Playfair Display',serif;font-size:2rem;font-weight:800;color:#B8456B;line-height:1}
.dr-count-of{font-size:.92rem;font-weight:600;color:#7C6B71}
.dr-next{font-size:.82rem;color:#7C6B71;line-height:1.45;margin-top:10px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dr-done{text-align:center;font-size:.85rem;font-weight:700;color:#2A8A87;padding:6px 0 2px}
.dr-sec{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7C6B71;margin:0 0 10px}
.dr-search{margin:0 0 14px}
.dr-search input{margin:0 !important;padding:11px 14px !important;font-size:.88rem !important;line-height:1.3 !important}
.dr-warn{font-size:.74rem;line-height:1.5;color:#7C6B71;border-left:2.5px solid #E8A0B4;padding:1px 0 1px 10px;margin:24px 0 0}
.dr-h1{font-family:'Playfair Display',serif;font-size:1.42rem;font-weight:700;line-height:1.3;color:var(--ink);margin:0 0 14px}
.readrow{display:flex;align-items:flex-start;gap:12px;padding:12px 13px;margin-bottom:8px;background:#FFFBF5;border:1.5px solid #EADFD2;border-radius:14px;transition:all .15s}
.readrow:hover{border-color:#E8A0B4;box-shadow:0 4px 14px rgba(184,69,107,.1)}
.readrow-ic{flex:0 0 auto;width:24px;height:24px;min-height:24px;border-radius:50%;border:1.5px solid #EADFD2;background:#fff;display:grid;place-items:center;padding:0;margin:0;cursor:pointer;color:transparent;transition:all .15s}
.readrow-ic:hover{border-color:#2A8A87}
.readrow.done .readrow-ic{background:#2A8A87;border-color:#2A8A87;color:#fff}
.readrow-txt{flex:1 1 auto;min-width:0;text-align:left;background:none;border:0;padding:0;margin:0;font:inherit;cursor:pointer;color:inherit;display:block}
.readrow-title{display:block;font-size:.92rem;font-weight:600;color:#3A2E33;line-height:1.38}
.readrow.done .readrow-title{color:#8A7A80;font-weight:500}
.readrow-meta{display:block;font-size:.73rem;color:#7C6B71;margin-top:3px;line-height:1.3}
.readrow-cat{flex:0 0 auto;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#7C6B71;background:#F9F2ED;border-radius:999px;padding:4px 8px;margin-top:2px;white-space:nowrap}
.readrow.done .readrow-cat{opacity:.55}
.arttools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}

 --bg:#EEF3F6;--card:#FAFCFD;--ink:#2A353D;--mut:#66757E;

}

.pgcarousel{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-top:4px}
.pgcarousel::-webkit-scrollbar{display:none}
.pgtrack{display:flex;gap:10px}

.pgcard b{display:block;font-size:1rem;font-weight:700;line-height:1.3;color:var(--ink)}
.pgcard p{font-size:.9rem;line-height:1.5;color:var(--mut)}

/* ---------- flower splash ---------- */
#splash{position:fixed;inset:0;z-index:9999;background:#fdf3ee;display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:1;transition:opacity .38s ease}
#splash.gone{opacity:0;pointer-events:none}
#splashWash{position:absolute;inset:0;background:#a15a6b;opacity:0}
#splashFlower{width:min(58vmin,340px);height:min(58vmin,340px);opacity:0;transform:scale(.1);will-change:transform;z-index:2}
#splashFlower svg{width:100%;height:100%;display:block;overflow:visible}
#splashPetal{position:absolute;left:50%;top:50%;width:var(--w);height:var(--h);margin:calc(var(--h)/-2) 0 0 calc(var(--w)/-2);opacity:0;z-index:5;will-change:transform,opacity}
#splashPetal svg{width:100%;height:100%;display:block;overflow:visible}
#splashHint{position:absolute;z-index:9;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font:14px system-ui,sans-serif;color:#fdf3ee;opacity:0;transition:opacity .6s;pointer-events:none}

function phaseInfo(dt,len){if(dt<=5)return{t:'Menstrual phase',k:'Menstrual',c:'var(--rose)'};
 if(dt<=Math.round(len*.45))return{t:'Follicular phase',k:'Follicular',c:'var(--teal)'};
 if(dt<=Math.round(len*.58))return{t:'Ovulation window',k:'Ovulation',c:'var(--pink)'};

function miniBars(k,n,col){const days=[...Array(n)].map((_,i)=>addD(today(),i-n+1)),vals=days.map(d=>L(d)[k]);
 if(!vals.some(v=>v!=null))return `<div class="spark empty">No data in the last ${n} days</div>`;
 return `<div class="spark"><svg viewBox="0 0 ${n*16} 44" preserveAspectRatio="none" role="img" aria-label="${k} over the last ${n} days">${vals.map((v,i)=>v==null?`<rect x="${i*16+2}" y="4" width="12" height="36" rx="3" fill="#F1E6D7"/>`:`<rect x="${i*16+2}" y="${(44-(v/5)*38).toFixed(1)}" width="12" height="${((v/5)*38).toFixed(1)}" rx="3" fill="${col}"/>`).join('')}</svg></div>`}
function ringSVG(){const c=cycleStats(),len=c.avg||28,has=!!c.last;
 const T=RO?{track:'#DCE6EC',mark:'#2F6B7E',num:'#22313A',g:['#245A6B','#3E8195','#A8C6D4']}:{track:'#F1E6D7',mark:'#B8456B',num:'#2B1E1E',g:['#A83A5E','#C4567A','#E8A0B4']};
 const day=has?Math.round((new Date(today())-new Date(c.last))/864e5)+1:1,dt=((day-1)%len)+1;
 const R=88,C=2*Math.PI*R,frac=dt/len,step=len>20?2:1;let nums='';
 for(let i=0;i<len;i++){const d=i+1;if(has&&d===dt)continue;if((d-1)%step)continue;
  const a=(-90+360*(i/len))*Math.PI/180,nx=110+R*Math.cos(a),ny=110+R*Math.sin(a);
  nums+=`<text x="${nx.toFixed(1)}" y="${(ny+3.4).toFixed(1)}" text-anchor="middle" letter-spacing="0.5" style="fill:${T.num};font-size:9.4px;font-weight:700;font-family:'Playfair Display',serif">${d}</text>`}
 let mark='';
 if(has){const a=(-90+360*((dt-1)/len))*Math.PI/180,bx=110+R*Math.cos(a),by=110+R*Math.sin(a);
  mark=`<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="15" fill="#FFFFFF" stroke="${T.mark}" stroke-width="2.2" style="filter:drop-shadow(0 5px 10px rgba(47,107,126,.25))"/><text x="${bx.toFixed(1)}" y="${(by+4.6).toFixed(1)}" text-anchor="middle" style="fill:${T.mark};font-size:13px;font-weight:700;font-family:'Playfair Display',serif">${dt}</text>`}
 return `<svg viewBox="0 0 220 220" style="width:100%;height:100%;display:block" role="img" aria-label="${has?'Cycle day '+dt:'No cycle logged yet'}"><defs><linearGradient id="bloomRingGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${T.g[0]}"/><stop offset="55%" stop-color="${T.g[1]}"/><stop offset="100%" stop-color="${T.g[2]}"/></linearGradient></defs><circle cx="110" cy="110" r="${R}" fill="none" stroke="${T.track}" stroke-width="12"/>${has?`<circle cx="110" cy="110" r="${R}" fill="none" stroke="url(#bloomRingGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(C*frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 110 110)" style="transition:stroke-dasharray .7s ease"/>`:''}${nums}${mark}</svg>`}

function guidePick(out){
 const seen={},uniq=[];
 out.forEach(x=>{if(seen[x.t])return;seen[x.t]=1;uniq.push(x)});

 return uniq.slice(0,10);
}
function partnerGuideData(){

 const ph=has?phaseInfo(dt,len):null,l=L(today());
 const sym=Object.keys(P_SYMPTOM).filter(t=>(l.tags||[]).includes(t)).slice(0,3);
 const out=sym.map(t=>({t:t,b:P_SYMPTOM[t]}));

}

function initPartnerCarousel(){

 const car=document.getElementById('pgCar');if(!car)return;
 const dots=document.querySelectorAll('#pgDots .pgdot');
 const N=dots.length||1;
 const cards=car.querySelectorAll('.pgcard');if(cards.length<N*3)return;
 const stp=()=>Math.max(1,cards[0].getBoundingClientRect().width+10);
 const w=stp();if(w<20){setTimeout(initPartnerCarousel,80);return}
 const jump=v=>{car.scrollLeft=v};
 const paint=()=>{const i=Math.round(car.scrollLeft/stp());pgIdx=((i%N)+N)%N;dots.forEach((x,k)=>x.classList.toggle('on',k===pgIdx))};
 const place=()=>{jump((N+pgIdx)*stp());paint()};
 place();if(typeof requestAnimationFrame==='function')requestAnimationFrame(place);
 car.onscroll=()=>{clearTimeout(pgSettle);pgSettle=setTimeout(()=>{
   const step=stp(),i=Math.round(car.scrollLeft/step);
   if(i<N)jump((i+N)*step);else if(i>=2*N)jump((i-N)*step);
   paint();
 },120)};
 if(!window.__pgRz){window.__pgRz=1;window.addEventListener('resize',()=>{clearTimeout(pgSettle);pgSettle=setTimeout(()=>{if(document.getElementById('pgCar'))initPartnerCarousel()},150)})}

let fabEl=null,fabCorner=(()=>{try{return localStorage.getItem('bloom_fab')||'br'}catch(e){return 'br'}})();
const FAB_SZ=58;

 const W=Math.min(430,innerWidth),l0=(innerWidth-W)/2,r0=l0+W;
 const navTop=innerHeight-88;

}
function fabPlace(){
 if(!fabEl)return;
 const b=fabBounds();
 fabEl.style.left=(fabCorner[1]==='l'?b.l:b.r)+'px';
 fabEl.style.top=(fabCorner[0]==='t'?b.t:b.b)+'px';
}
function fabMount(){
 if(fabEl)return;
 fabEl=document.createElement('button');
 fabEl.id='fab';fabEl.className='fab';
 fabEl.setAttribute('aria-label','Quick actions');
 fabEl.innerHTML='<img src="'+LOGO+'" alt="">';
 document.body.appendChild(fabEl);
 let drag=null;
 const move=e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved&&Math.abs(dx)+Math.abs(dy)<7)return;
  drag.moved=true;
  const nx=Math.max(0,Math.min(innerWidth-FAB_SZ,drag.ox+dx));
  const ny=Math.max(0,Math.min(innerHeight-FAB_SZ,drag.oy+dy));
  fabEl.style.left=nx+'px';fabEl.style.top=ny+'px';
  if(e.cancelable)e.preventDefault();
 };
 const up=e=>{
  if(!drag||e.pointerId!==drag.id)return;
  window.removeEventListener('pointermove',move);
  window.removeEventListener('pointerup',up);
  window.removeEventListener('pointercancel',up);
  const moved=drag.moved;drag=null;fabEl.classList.remove('drag');
  if(!moved){openQuickRing(fabEl,qaAct);return}
  const b=fabBounds(),r=fabEl.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  fabCorner=(cy<(b.t+b.b)/2?'t':'b')+(cx<(b.l+b.r)/2?'l':'r');
  try{localStorage.setItem('bloom_fab',fabCorner)}catch(err){}
  fabPlace();
 };
 fabEl.addEventListener('pointerdown',e=>{
  if(e.button&&e.button!==0)return;
  const r=fabEl.getBoundingClientRect();
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,ox:r.left,oy:r.top,moved:false};
  fabEl.classList.add('drag');
  try{fabEl.setPointerCapture(e.pointerId)}catch(err){}
  window.addEventListener('pointermove',move,{passive:false});
  window.addEventListener('pointerup',up);
  window.addEventListener('pointercancel',up);
 });
 fabEl.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openQuickRing(fabEl,qaAct)}});
}

 const spins=[-210,190,-170,230,-200,220];

 let closed=false;
