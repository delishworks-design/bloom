<style>
:root{
  --bg:#FBF4EA;--bg2:#FFF9F2;--card:#FFFBF5;--card2:#FFF9F0;--ink:#3A2E33;--ink2:#2A353D;--deep:#4A3D42;--mut:#7C6B71;--faded:#B8A8AE;
  --pink:#E8A0B4;--rose:#B8456B;--roseD:#A8355A;--teal:#2A8A87;--tealS:#D6ECEA;--tealInk:#173F4B;
  --pinkS:#F9DDE5;--creamDeep:#EADFD2;--chip:#FFF5EC;--coverSkel:#F6E8E9;--coverEmpty:#1F181B;--muted:#7C6B71;
  --line:#EADFD2;--line2:#EFE4DC;--sh:0 2px 10px rgba(120,70,80,.08);--shb:0 12px 34px rgba(120,70,80,.16);--scrim:#FBF4EA;
  color-scheme: light;
}
html[data-theme=dark]{
  color-scheme: dark;
  --bg:#1B1419;--bg2:#201920;--card:#221B21;--card2:#241E24;--ink:#EDE0E5;--ink2:#D9CED3;--deep:#C9B7BE;--mut:#8E8490;--faded:#6F656F;
  --pink:#C97A92;--rose:#D96B8C;--roseD:#E0788F;--teal:#3FA49E;--tealS:#1E3C34;--tealInk:#7FD4CF;--pinkS:#3A222D;--creamDeep:#2E2530;--chip:#2C232C;--coverSkel:#2C232B;--coverEmpty:#262026;--muted:#8E8490;
  --line:#2E2530;--line2:#352C35;--sh:0 2px 12px rgba(0,0,0,.32);--shb:0 12px 34px rgba(0,0,0,.46);--scrim:#1B1419;
  --roBg:#1E262E;--roCard:#232D36;--roCard2:#2A3540;--roInk:#DCE7EB;--roInk2:#A8D3DC;--roLine:#31414D;--roBgGrad:#0F1650;
}
:root{
  --roBg:#eef5f7;--roCard:#FAFCFD;--roCard2:#E7EEF3;--roInk:#1E262E;--roInk2:#2F6B7E;--roLine:#DCE6EC;--roBgGrad:#eef5f7;
}
*{box-sizing:border-box}
html{scrollbar-gutter:stable}
html,body{margin:0;padding:0;min-height:100%;overflow-x:hidden;background:var(--scrim) !important;color:var(--ink) !important}
body::before{content:'';position:fixed;z-index:0;top:0;left:0;right:0;height:170px;background:linear-gradient(180deg,rgba(58,46,51,.075),rgba(58,46,51,0));pointer-events:none}
html[data-theme=dark] body::before{background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0))}
body{font-family:Sansita,system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;background:var(--scrim) !important}
#app,#sheet,#toast{background:var(--scrim)}
html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea,html[data-theme=dark] .pwwrap input,html[data-theme=dark] .dr-search input{background:var(--card2) !important;color:var(--ink) !important;border-color:var(--line) !important}

/* Type hierarchy - fixed */
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:700;line-height:1.2;letter-spacing:-.01em;margin:0}
h1{font-size:28px;margin-bottom:12px}
h2{font-size:22px;margin-bottom:8px}
h3{font-size:18px;margin-bottom:4px}
p{margin:0;line-height:1.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.blob{position:fixed;border-radius:50%;filter:blur(48px);pointer-events:none;z-index:0;opacity:.7}
.blob-a{width:78vw;max-width:340px;aspect-ratio:1;top:-14%;right:-18%;background:radial-gradient(60% 60% at 50% 50%,var(--pinkS) 0%,var(--scrim) 62%,transparent 78%)}
.blob-b{width:82vw;max-width:360px;aspect-ratio:1;bottom:-6%;left:-24%;background:radial-gradient(55% 55% at 50% 50%,var(--tealS) 0%,var(--scrim) 55%,transparent 75%)}
.blob-c{width:40vw;max-width:180px;aspect-ratio:1;top:36%;left:42%;background:radial-gradient(circle,var(--pinkS) 0%,transparent 70%);opacity:.4}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes ringIn{from{opacity:0;transform:scale(.92) rotate(-3deg)}to{opacity:1;transform:scale(1) rotate(0)}}

/* Layout hierarchy */
.wrap{position:relative;z-index:1;max-width:430px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 74px) 20px 130px;min-height:100dvh;background:var(--scrim);display:flex;flex-direction:column;gap:18px}
.wrap>*{flex:0 0 auto}
#main{display:flex;flex-direction:column;gap:20px}
#pb{display:flex;flex-direction:column;gap:14px}
.topbar{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(390px,calc(100% - 40px));display:flex;align-items:center;justify-content:space-between;gap:16px;z-index:6;background:transparent;padding:4px 0 10px;min-height:58px;border-bottom:0}
.pchip{display:inline-flex !important;align-items:center !important;height:38px !important;padding:0 14px !important;border-radius:999px !important;background:var(--pinkS) !important;border:1.5px solid rgba(232,160,180,.6) !important;color:var(--rose) !important;font-size:.74rem !important;font-weight:700 !important;white-space:nowrap}
.wordmark{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;color:#B8456B;line-height:1;text-shadow:0 1px 12px var(--scrim),0 1px 3px var(--scrim)}
.wordmark i{font-size:20px;font-weight:400;font-style:normal;vertical-align:super;margin-left:2px}

/* Cards - hierarchy */
.shareblock{margin-top:2px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sharelist{display:flex;flex-direction:column;gap:0}
.sharelist label{margin:0 !important;padding:9px 0 !important;color:var(--ink) !important;cursor:pointer}
.card{background:var(--card) !important;border:1.5px solid var(--line);border-radius:22px;padding:18px 16px;box-shadow:0 2px 10px rgba(120,70,80,.08);display:flex;flex-direction:column;gap:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:2px;border-bottom:0}
.card-h h3{font-size:17px;line-height:1.2;margin:0}
.btn{position:relative;padding:14px 24px;border-radius:16px;border:none;font:inherit;font-weight:700;font-size:1rem;color:#FBF4EA;background:linear-gradient(180deg,#C4567A 0%,#B8456B 100%);cursor:pointer;transition:transform .08s,box-shadow .15s,filter .15s;box-shadow:0 4px 14px rgba(184,69,107,.35),0 2px 6px rgba(120,70,80,.15),inset 0 1px 0 rgba(255,255,255,.25);overflow:hidden}
.btn::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.25) 0%,transparent 50%,rgba(0,0,0,.15) 100%);pointer-events:none}
.btn:active{transform:translateY(2px) scale(.99);box-shadow:0 2px 6px rgba(184,69,107,.3),0 1px 3px rgba(120,70,80,.12),inset 0 1px 3px rgba(0,0,0,.2);filter:brightness(.98)}
.btn:focus-visible{outline:2px solid #B8456B;outline-offset:3px}
.btn.ghost{background:transparent;color:#B8456B;box-shadow:none;border:1.5px solid rgba(232,160,180,.6)}
.btn.ghost::before{display:none}
.btn.ghost:active{background:#F9DDE5;transform:translateY(1px) scale(.99)}
.btn.sm{padding:10px 16px;font-size:.875rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.875rem;font-weight:600;cursor:pointer;transition:all .15s;box-shadow:0 2px 6px rgba(120,70,80,.08)}
.chip:hover{border-color:#E8A0B4;background:var(--card2);box-shadow:0 4px 12px rgba(184,69,107,.15);transform:translateY(-1px)}
.chip:active{transform:translateY(1px);box-shadow:0 1px 3px rgba(120,70,80,.1)}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,var(--pinkS) 0%,var(--pinkS) 100%);border-color:#E8A0B4;color:var(--rose);box-shadow:0 4px 14px rgba(184,69,107,.25),inset 0 1px 0 rgba(255,255,255,.3)}
.bookgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.bookcard{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:0;overflow:hidden;min-height:0;box-shadow:0 2px 10px rgba(120,70,80,.05);transition:transform .15s ease,box-shadow .2s ease;cursor:pointer}
.bookcard:active{transform:scale(.98)}
.bookcard-cover{display:block;width:100%;aspect-ratio:2/2.6;position:relative;contain:layout paint}

.lbl{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);line-height:1.2;display:block;margin-bottom:6px}

/* Buttons - perfect center fix */
button{font-family:Sansita,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.btn{display:inline-flex !important;align-items:center !important;justify-content:center !important;gap:8px;text-align:center !important;line-height:1 !important;white-space:nowrap !important;background:#2A8A87 !important;color:#fff !important;border:0 !important;border-radius:999px !important;padding:0 24px !important;min-height:48px !important;cursor:pointer;font:inherit;font-weight:700 !important;box-shadow:0 4px 14px rgba(42,138,135,.24)}
.btn.pink{background:#B8456B !important;box-shadow:0 4px 14px rgba(184,69,107,.24) !important}
.btn.ghost{background:var(--card) !important;color:#2A8A87 !important;border:1.5px solid #2A8A87 !important;box-shadow:none !important}
.btn.sm{min-height:36px !important;padding:0 16px !important;font-size:.88rem !important}
.profbtn{display:inline-flex !important;align-items:center !important;gap:10px !important;height:52px !important;padding:4px 16px 4px 4px !important;border-radius:999px !important;background:var(--card) !important;border:1.5px solid var(--line) !important;box-shadow:0 2px 8px rgba(120,70,80,.06) !important;color:var(--ink) !important;font-weight:700 !important;line-height:1 !important;white-space:nowrap !important;max-width:62% !important}
.profbtn span{line-height:1 !important;overflow:hidden;text-overflow:ellipsis}
.logpill{width:100% !important;max-width:340px !important;margin:12px auto 0 !important;height:56px !important;border-radius:999px !important;background:#B8456B !important;color:#fff !important;display:flex !important;align-items:center !important;justify-content:center !important;gap:10px !important;font-weight:700 !important;box-shadow:0 8px 20px rgba(184,69,107,.3) !important;border:0 !important}
.logpill .plus{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.24);display:grid;place-items:center;flex-shrink:0}
.logpill.ghost{background:transparent !important;color:var(--rose) !important;border:1.5px solid rgba(184,69,107,.35) !important;box-shadow:none !important;max-width:340px !important;margin:12px auto 0 !important}
.logpill.ghost .plus{background:rgba(184,69,107,.12) !important;color:var(--rose) !important}
.logpill.ghost svg.pi{width:22px;height:22px;display:block}
.cal-ico{flex:0 0 auto;width:52px;height:52px;margin:0;border:0;border-radius:18px;background:rgba(86,140,190,.08);color:rgba(86,140,190,.55);display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s}
.logpill.slim2{flex:1;max-width:none!important;margin:12px 0 0!important;height:52px!important}
.cal-ico:hover{background:rgba(86,140,190,.18);color:#56779B}

/* Chips */
.card>label{margin-top:0 !important}
.chipfield{display:flex;flex-direction:column;gap:8px}
.chipfield .lbl{margin:0}
.chiprow{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex !important;align-items:center !important;justify-content:center !important;gap:6px;text-align:center !important;line-height:1 !important;white-space:nowrap !important;border:1.5px solid var(--line) !important;background:var(--card) !important;border-radius:999px !important;padding:0 18px !important;min-height:40px !important;font-size:.9rem !important;color:var(--ink) !important;cursor:pointer}
.chip[aria-pressed=true]{background:var(--pinkS) !important;border-color:var(--rose) !important;color:var(--rose) !important;font-weight:700 !important}

/* QA */
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa button{background:var(--tealS) !important;border:1.5px solid #C8E2E0 !important;border-radius:16px !important;padding:12px 6px !important;min-height:68px !important;display:flex !important;flex-direction:column !important;align-items:center !important;justify-content:center !important;text-align:center !important;gap:5px !important;font-size:.82rem !important;line-height:1.25 !important;color:var(--ink) !important}
/* floating quick actions */
.fab{position:fixed;left:0;top:0;width:58px;height:58px;box-sizing:border-box;border-radius:50%;display:grid;place-items:center;padding:0;border:0;background:none;box-shadow:none;z-index:6;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:none;transition:left .22s cubic-bezier(.2,.9,.25,1),top .22s cubic-bezier(.2,.9,.25,1),transform .16s}}
/* soft shadow painted as a gradient: a drop-shadow filter on a fixed element re-rasterises on every repaint */
.fab::before{content:'';position:absolute;left:4px;right:4px;bottom:-2px;height:70%;border-radius:50%;background:radial-gradient(closest-side,rgba(120,70,80,.34),rgba(120,70,80,.16) 62%,rgba(120,70,80,0));pointer-events:none;z-index:-1}
.fab.drag{transition:none}
.fab:active{transform:scale(.96)}
.fab:focus-visible{outline:2px solid #B8456B;outline-offset:3px}
.fab img{width:100%;height:100%;object-fit:contain;display:block}
.qaic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--tealS);color:#2A8A87}
.qaring{position:fixed;inset:0;z-index:8;touch-action:none;contain:layout paint style}
.qaring-scrim{position:absolute;inset:0;background:rgba(58,46,51,.30);opacity:0;will-change:opacity;transition:opacity .18s}
.qaring.on .qaring-scrim{opacity:1}
/* the entrance frame is decorative: never a tap target, so a stray activation cannot close it */
.qaring:not(.on) .qaring-core,.qaring:not(.on) .qaring-scrim,.qaring:not(.on) .qaring-item{pointer-events:none}
.qaring-core{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;box-sizing:border-box;padding:0;border:0;border-radius:50%;background:none;display:grid;place-items:center;cursor:pointer;transform:translate(var(--sx,0px),var(--sy,0px)) scale(1);transition:transform .32s cubic-bezier(.2,.9,.25,1);z-index:2}
.qaring.bloom.on .qaring-core{transform:translate(0,0) rotate(720deg) scale(1.06)}
.qaring:not(.bloom).on .qaring-core{transform:translate(0,0) scale(1.08)}
.fab:focus,.fab:focus-visible,.qaring-core:focus,.qaring-core:focus-visible{outline:0}
@media (prefers-reduced-motion: reduce){.qaring,.qaring .qaring-item,.qaring .qaring-core,.qaring-scrim,.qaring-art,.qaring-art-g{transition-duration:.01ms !important;transition-delay:0s !important}}
.fab svg{width:100%;height:100%;display:block}
.fabopts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.fabopt{width:56px;height:56px;border:1.5px solid var(--line);border-radius:16px;background:var(--card2);display:grid;place-items:center;cursor:pointer;padding:3px;transition:all .15s}
.fabopt img,.fabopt svg{width:100%;height:100%;object-fit:contain;display:block}
.fabopt[aria-pressed=true]{border-color:var(--rose);box-shadow:0 0 0 3px var(--pinkS)}
.qaring-core img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 8px 18px rgba(120,70,80,.38))}
.qaring-core svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 18px rgba(120,70,80,.38))}
.qaring-item{position:absolute;left:50%;top:50%;width:80px;height:94px;margin:-47px 0 0 -40px;padding:0;border:0;background:none;cursor:pointer;transform:translate(var(--x),var(--y)) scale(.9);opacity:0;z-index:1;outline:0;-webkit-tap-highlight-color:transparent;transition:opacity .18s ease,transform .32s cubic-bezier(.16,1.1,.3,1)}
.qaring-art{position:absolute;left:50%;top:50%;width:100%;height:100%;transform:translate(-50%,-50%);overflow:visible;pointer-events:none}
.qaring-art-g{transform-origin:50% 50%;transform:scale(.92);opacity:0;transition:transform .32s cubic-bezier(.16,1.1,.3,1),opacity .22s}
.qaring.on .qaring-art-g{transform:scale(1);opacity:1}
.qaring.on .qaring-item{transform:translate(var(--x),var(--y)) scale(1);opacity:1}
.petal-fill{fill:var(--pf,#F9DDE5)}
.petal-back{fill:var(--pb,#F7D2DE);opacity:.95}

.qaring-art .odd.petal-fill{fill:var(--pf2,#F5CFDA)}
.qaring-art .odd.petal-back{fill:var(--pb2,#F2C4D1)}
.petal-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding-top:2px;transform:rotate(calc(-1 * var(--r,0deg)));color:var(--pi,#B8456B);pointer-events:none}
.pi{display:grid;place-items:center;width:24px;height:24px}
.pl{font-size:.58rem;font-weight:700;line-height:1;color:#8E3454;white-space:nowrap}

/* Tiles */

/* Avatar */
.avatar{border-radius:50%;object-fit:cover;display:block;flex:0 0 auto;border:2px solid var(--card);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.avatar-wrap{display:block;flex:0 0 auto;position:relative;overflow:hidden;border-radius:50%;border:2px solid var(--card);box-shadow:0 2px 8px rgba(0,0,0,.08);background:var(--card2)}
.avatar-wrap .avatar{width:100%;height:100%;border:0;border-radius:0;box-shadow:none;object-fit:cover}
.adjbox{width:min(64vw,250px);aspect-ratio:1;margin:0 auto;border-radius:20px;overflow:hidden;background:var(--card2);border:1.5px solid var(--line);touch-action:none;cursor:grab}
.adjbox:active{cursor:grabbing}
.adjbox img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent !important;padding:0 !important;border:0 !important;box-shadow:none !important}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:#B8456B;border:3px solid var(--card);box-shadow:0 2px 6px rgba(0,0,0,.2);margin-top:-10px}
.avatar-fb{border-radius:50%;background:linear-gradient(135deg,var(--pinkS),var(--tealS)) !important;display:grid;place-items:center;font-family:'Playfair Display',serif;font-weight:700;color:var(--rose);flex:0 0 auto;border:2px solid var(--card)}

/* Greet hierarchy */
.greet{animation:fadeUp .5s ease .1s both;display:flex;flex-direction:column;gap:4px;padding:4px 64px 6px 4px;position:relative}
.greet .hi{font-family:'Playfair Display',serif;font-size:22px;font-weight:500;line-height:1.2;color:var(--ink)}
.greet .nm{font-size:36px;line-height:1;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.greet .date{margin-top:8px;font-size:.9rem;font-style:italic;color:#B8456B;line-height:1.3}

/* Ring - beautiful light version */
.ringlbl{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);line-height:1;margin-left:.2em}
.ringwrap{position:relative;width:100%;max-width:340px;aspect-ratio:1;margin:4px auto 8px;animation:ringIn .8s cubic-bezier(.16,1,.3,1) .15s both;display:grid;place-items:center}
.ringdisc{position:absolute;inset:13%;border-radius:50%;background:radial-gradient(100% 100% at 50% 18%, var(--card) 0%, var(--card) 58%, var(--card) 100%);box-shadow:inset 0 1px 0 var(--card2),0 12px 32px rgba(120,70,80,.07);pointer-events:none;border:1px solid rgba(234,223,210,.6)}
.ringcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;z-index:2;pointer-events:none}
.ringday{font-family:'Playfair Display',serif;font-size:58px;line-height:.88;font-weight:700;color:var(--ink);letter-spacing:-.035em}
.ringcap{margin-top:4px;font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);max-width:180px;line-height:1.3;text-align:center}
.ringpill{margin-top:10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;min-height:30px;border-radius:999px;background:var(--card) !important;border:1.5px solid var(--line) !important;box-shadow:0 2px 8px rgba(120,70,80,.08) !important;font-size:.8rem;font-weight:700;color:var(--ink) !important;line-height:1}
.ringpill{max-width:42%;box-sizing:border-box;padding:6px 12px;border-radius:18px;font-size:.74rem;line-height:1.25;text-align:center;white-space:normal;overflow-wrap:anywhere}
.ringnote{margin-top:10px;max-width:46%;font-size:.76rem;font-weight:700;color:var(--teal) !important;text-align:center;line-height:1.3;white-space:normal;overflow-wrap:anywhere}
.segwrap{display:flex;gap:6px;background:var(--line2);border-radius:999px;padding:4px;margin:2px 0 12px}
.segwrap button{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 10px;font:inherit;font-weight:700;font-size:.86rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.segwrap button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(120,70,80,.12)}
body.ro .segwrap{background:var(--roLine)}
body.ro .segwrap button[aria-pressed="true"]{background:var(--roCard);color:var(--roInk)}
.ringwrap svg{position:relative;z-index:1;width:100%;height:100%;display:block}

/* Stats */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:6px 0 2px}
.stat{background:var(--card) !important;border:1.5px solid var(--line) !important;border-radius:18px;padding:16px 8px !important;box-shadow:0 2px 10px rgba(120,70,80,.06) !important;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.stat .ic{width:26px;height:26px;border-radius:50%;background:var(--pinkS) !important;display:grid;place-items:center;color:var(--rose) !important;margin-bottom:4px}
.stat b{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--ink);line-height:1.1}
.stat b.word{font-size:14px;line-height:1.2}
.stat .lbl{margin-top:2px}
.stats3 button.stat{font:inherit;-webkit-appearance:none;appearance:none;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.stats3 button.stat:active{transform:scale(.97)}
.stats3 button.stat:focus-visible{outline:2px solid #B8456B;outline-offset:3px}
.stat .lbl .chev{color:var(--mut);font-weight:700;margin-left:1px}
.phasegraph{display:flex;justify-content:center;margin:0 0 2px}
.phasegraph svg{width:min(232px,62vw);height:auto;display:block;overflow:visible}
.phasegraph .pg-name{fill:var(--ink);font-family:'Playfair Display',serif;font-size:19px;font-weight:700}
.phasegraph .pg-sub{fill:var(--mut);font-size:10.5px;letter-spacing:.03em}

/* Forms */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
input,select,textarea{font:inherit;color:var(--ink) !important;width:100%;padding:13px 16px !important;border-radius:14px !important;border:1.5px solid var(--line) !important;background:var(--card) !important;margin:6px 0 14px !important;line-height:1.3 !important;box-shadow:0 1px 2px rgba(120,70,80,.04) !important}
textarea{resize:none !important;overflow:hidden !important;min-height:78px}
textarea.grow{overflow-y:auto !important}
input:focus,select:focus,textarea:focus{border-color:#B8456B !important;background:var(--card2) !important;outline:none !important}
label{display:block;font-size:.86rem;color:var(--mut) !important;margin-top:16px !important;margin-bottom:6px !important;line-height:1.2 !important;font-weight:700 !important;letter-spacing:.01em}
.log-t{display:flex;align-items:center;gap:7px}
.log-ic{display:inline-flex;color:#8A6F66;flex:0 0 auto}
.chip .log-ic{margin-right:5px}
.ck{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);line-height:1.3;flex:1 1 auto;min-width:0}
.ck input{width:22px;height:22px;margin:0;accent-color:#B8456B;flex:0 0 auto}
.ckt{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;word-break:break-word;color:var(--ink);font-size:1rem}
.cklist .ck:last-child{border-bottom:0}
.taskrow{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;min-width:0;padding:0;border-bottom:1px dashed var(--line)}
.taskrow .ck{border-bottom:0;padding:11px 0}
.taskrow:last-child{border-bottom:0}
.taskrow .del,.mealrow .del{width:30px;height:30px;min-height:30px;padding:0;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;font-size:.95rem;line-height:1}
.mealrow{display:flex;align-items:center;gap:12px;flex-wrap:nowrap;min-width:0;padding:10px 0;border-bottom:1px dashed var(--line);line-height:1.3}
.mealrow .ckt{flex:1 1 0}

/* Calendar */
.calsheet{display:flex;flex-direction:column;height:78vh;max-height:78vh;margin:0;padding:0}
.calsheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.calsheet-head h2{margin:0;font-size:1.1rem}
.calsheet-scroll{overflow-y:auto;flex:1;padding:0 12px 20px;-webkit-overflow-scrolling:touch}
.cal-month{padding:14px 4px 10px;border-bottom:1px solid var(--line)}
.cal-month-h{margin:0 0 8px;font-size:1rem;color:var(--ink);letter-spacing:.02em}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;width:100%;min-width:0}
.cal-month{min-width:0;width:100%}
.cal-wd{text-align:center;font-size:.6rem;font-weight:800;letter-spacing:.08em;color:var(--mut);padding:2px 0 4px}
.cal-cell{aspect-ratio:1;border:1px solid var(--line2);border-radius:10px;background:var(--card);color:var(--ink);font-size:.88rem;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;position:relative}
.cal-cell,.mg-cell{min-width:0;overflow:hidden;box-sizing:border-box}
.calsheet,.calsheet-scroll{min-width:0;width:100%;max-width:100%}
.cal-cell:hover{border-color:var(--rose)}
.cal-cell.pr{background:#FDEEF2;border:1.5px dashed #E8A0B4;color:var(--rose);font-weight:600;opacity:1;cursor:pointer}
.cal-cell.pr:disabled{opacity:1;cursor:pointer}
.cal-legend{display:flex;flex-wrap:wrap;gap:10px 16px}
.cal-leg{display:inline-flex;align-items:center;gap:7px;font-size:.76rem;color:var(--muted);font-weight:600}
.cal-sw{display:inline-block;width:12px;height:12px;border-radius:4px}
.sw-bleed{background:var(--pink)}
.sw-spot{background:var(--pinkS)}
.sw-logged{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.sw-pred{background:#FDEEF2;border:1.5px dashed #E8A0B4}
.cal-empty{aspect-ratio:1}
.cal-today{outline:2px solid #2A8A87;outline-offset:1px}
.cal-sel{background:var(--rose) !important;color:#fff !important;border-color:var(--rose) !important}
.cal-sel .mg-day,.cal-sel .mg-n,.cal-sel .mg-day.done,.cal-sel .mg-day.overdue{color:#fff !important}
.cal-continue{width:100%;margin:14px 0 4px;padding:14px;border:1.5px dashed var(--line2);border-radius:14px;background:transparent;color:var(--rose);font-weight:800;letter-spacing:.06em;cursor:pointer}
.cal-continue:hover{border-color:var(--rose);background:var(--pinkS)}
.pickfield{width:100%;text-align:left;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;background:var(--card);color:var(--ink);font-size:1rem;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}
.pickfield .pf-val{font-weight:600}
 .pickfield .pf-icon{color:var(--mut);display:flex}
 .iconbtn{width:40px;height:40px;border:1.5px solid var(--line);background:transparent;border-radius:12px;color:var(--rose);padding:8px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
 .iconbtn:hover{background:var(--pinkS)}
 .iconbtn:active{transform:translateY(1px)}
 .cknote{display:-webkit-box;margin:1px 0 8px 34px;padding:2px 10px;border:0;border-left:2px solid var(--line2);background:transparent;color:var(--mut);font:inherit;font-size:.75rem;line-height:1.4;text-align:left;cursor:pointer;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
 .cknote.open{-webkit-line-clamp:unset;overflow:visible}
 .pcal-notes{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:12px;margin-top:2px}
 .pcal-notes-h{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:0;background:transparent;border:0;cursor:pointer;color:var(--ink);font-family:'Playfair Display',serif;font-size:15px;font-weight:700}
 .pcal-notes-h .rside{display:flex;align-items:center;gap:8px;color:var(--mut)}
 .chev-ic{display:inline-flex;transition:transform .25s ease}
 .pnote{display:block;width:100%;text-align:left;background:var(--chip);border:1px solid var(--line2);border-radius:12px;padding:8px 10px;cursor:pointer;font:inherit;color:var(--ink)}
 .pnote-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
 .pnote-title{font-size:.78rem;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .pnote-text{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.75rem;color:var(--mut);margin-top:3px;line-height:1.4}
 .pnote.open .pnote-text{-webkit-line-clamp:unset;overflow:visible}
 .pcal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
 .pcal-step{display:flex;gap:8px}
 .pcal-step button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--rose);display:grid;place-items:center;cursor:pointer;padding:0}
 .pcal-step button:hover{border-color:var(--rose);background:var(--pinkS)}

.wt-wheels::before{content:"";position:absolute;left:0;right:0;top:66px;height:44px;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);pointer-events:none}

/* Sheet - light */
.sheet{position:fixed;inset:0;background:rgba(58,46,51,.35) !important;backdrop-filter:blur(8px);z-index:260;display:flex;align-items:flex-end;justify-content:center}
html.sheet-open,html.sheet-open body{overflow:hidden !important;overscroll-behavior:none}
.sheet-grip{display:flex;justify-content:center;align-items:center;width:72px;padding:8px 0 6px;margin:-8px auto -2px;border:0;border-radius:14px;background:none;color:var(--mut);cursor:pointer;flex:0 0 auto;touch-action:none;-webkit-tap-highlight-color:transparent}
.sheet-grip:active{color:var(--rose)}
.sheet-grip svg{display:block}
.sheet>div{background:var(--card) !important;width:100%;max-width:430px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0 !important;padding:24px 20px 28px !important;box-shadow:0 -16px 40px rgba(120,70,80,.18) !important;display:flex;flex-direction:column;gap:14px;border:1.5px solid var(--line) !important;border-bottom:0 !important}
.sheet>div{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px)) !important}
.sheet{animation:sheetFadeIn .22s ease both}
.sheet>div{animation:sheetSlideUp .38s cubic-bezier(.22,1.15,.36,1) both}
@keyframes sheetFadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetSlideUp{from{transform:translateY(96%);opacity:.85}to{transform:translateY(0);opacity:1}}
 @media (prefers-reduced-motion: reduce){.sheet,.sheet>div{animation:none !important}}
 .sheet.leaving{pointer-events:none;animation:sheetFadeOut .26s ease both}
 .sheet.leaving>div{animation:sheetSlideDown .3s cubic-bezier(.55,0,.65,.35) both}
 @keyframes sheetFadeOut{from{opacity:1}to{opacity:0}}
 @keyframes sheetSlideDown{from{transform:translateY(var(--outfrom,0px))}to{transform:translateY(103%)}}
 @media (prefers-reduced-motion: reduce){.sheet.leaving,.sheet.leaving>div{animation:none !important}}
.upbar{height:4px;border-radius:2px;background:var(--line2);overflow:hidden}
.upbar i{display:block;height:100%;background:var(--rose);border-radius:2px;transition:width .25s ease;min-width:2%}
.upblk{align-items:center}
.upstate{font-weight:700;color:var(--ink);font-size:.86rem}
.upbytes{color:var(--mut);font-size:.8rem}
.toast,#toast{display:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));bottom:auto;background:var(--ink) !important;color:var(--scrim) !important;padding:12px 20px !important;border-radius:999px !important;z-index:300;font-size:.85rem;line-height:1;box-shadow:0 10px 24px rgba(0,0,0,.22) !important;animation:toastIn .28s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}

/* Auth */
.auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 20px;background:var(--scrim) !important}
.auth .card{max-width:420px;width:100%;margin:auto;padding:28px 24px 22px;gap:0;background:var(--card) !important;display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:26px;box-shadow:0 12px 40px rgba(120,70,80,.12)}

.auth .field{margin:0 0 16px}
.auth .field label{display:block;margin:0 0 7px !important;font-size:.84rem;letter-spacing:.01em;color:var(--mut) !important}

.pwwrap{position:relative}
.pwwrap input{padding-right:66px !important}
.auth .field input.code{text-align:center;text-transform:uppercase;letter-spacing:.22em;text-indent:.22em;font-size:1.3rem;font-weight:700;padding:16px 15px !important}
.reveal{position:absolute;right:5px;top:50%;transform:translateY(-50%);height:34px;padding:0 10px;border:0;background:transparent;color:var(--teal);font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;border-radius:10px}
.reveal:hover{background:var(--tealS)}
.reveal:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.auth .rule{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-size:.8rem;line-height:1.3;color:var(--mut)}
.auth .rule::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line);flex:0 0 auto;transition:background .15s}
.auth .rule.ok{color:var(--teal)}
.auth .rule.ok::before{background:var(--teal)}
.auth .cons{display:flex !important;align-items:flex-start;gap:11px;margin:18px 0 0 !important;font-size:.86rem;font-weight:400 !important;line-height:1.4;letter-spacing:0;color:var(--ink) !important}
.auth .remember{display:flex;align-items:center;gap:10px;margin:4px 0 10px;font-size:.88rem;color:var(--ink);cursor:pointer;user-select:none}
.auth .remember input{width:20px;height:20px;margin:0;accent-color:var(--rose);cursor:pointer}
.auth .cons input[type=checkbox]{width:20px !important;height:20px !important;min-width:20px;margin:1px 0 0 !important}
.auth .err{display:none;margin:16px 0 0;padding:11px 13px;border-radius:12px;background:var(--pinkS);border:1px solid rgba(232,160,180,.8);color:var(--rose);font-size:.86rem;line-height:1.4}

.auth .card #go{width:100%;min-height:50px !important;margin-top:20px !important}

@keyframes authspin{to{transform:rotate(360deg)}}
.step-dots{display:flex;justify-content:center;gap:8px;margin:12px 0 4px}

.auth .gbtn{width:100%;min-height:48px !important;margin-top:4px !important;background:var(--card) !important;color:var(--ink) !important;border:1.5px solid var(--line) !important;box-shadow:none !important;display:flex !important;align-items:center;justify-content:center;gap:10px;font-weight:700}

input[type=checkbox]{width:22px !important;height:22px !important;min-width:22px;padding:0 !important;margin:0 !important;accent-color:#B8456B;flex:0 0 auto}
.brand{font-family:'Playfair Display',serif;color:#B8456B;font-size:2rem;line-height:1}

@media (prefers-reduced-motion: no-preference){

 .smart-focus-card:nth-child(even) .smart-focus-meter svg{animation-duration:4.4s;animation-delay:-1.1s}
 @keyframes bloomSway{0%,100%{transform:rotate(-2.6deg)}50%{transform:rotate(2.6deg)}}
 .smart-focus-card{transition:transform .32s cubic-bezier(.34,1.35,.64,1);animation:cardPop .55s cubic-bezier(.3,1.5,.45,1) both}
 .smart-focus-card:nth-child(2){animation-delay:.07s}
 .smart-focus-card:nth-child(3){animation-delay:.14s}
 .smart-focus-card:nth-child(4){animation-delay:.21s}
 .smart-focus-card:nth-child(5){animation-delay:.28s}
 .smart-focus-card:nth-child(6){animation-delay:.35s}
 .smart-focus-card:nth-child(7){animation-delay:.42s}
 @keyframes cardPop{from{transform:translateY(16px) scale(.6);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
 .smart-focus-card:active{transform:scale(.955)}
 .smart-focus-sheetflower svg{animation:bloomGrow 1.1s cubic-bezier(.36,1.22,.62,1) both;transform-origin:50% 96%;transform-box:fill-box}
 @keyframes bloomGrow{from{transform:scale(.32) rotate(-9deg);opacity:0}55%{opacity:1}to{transform:scale(1) rotate(0);opacity:1}}
}

.fs-step.on .fs-num{background:var(--rose);color:#fff}

@media (max-width:430px){.smart-section{padding:16px 18px}.smart-focus-wrap{margin-bottom:14px}.smart-focus-tap{grid-template-columns:112px 1fr;gap:12px}.smart-focus-meter,.smart-focus-meter svg{width:112px;height:112px}}

body.roSplash #splashFlower path:nth-child(1){fill:#a8c6d4}
body.roSplash #splashFlower path:nth-child(2){fill:#7faebd}
body.roSplash #splashFlower path:nth-child(3){fill:#5e97a8}
body.roSplash #splashFlower path:nth-child(4){fill:#3e8195}
body.roSplash #splashFlower path:nth-child(5){fill:#2f6b7e}
body.roSplash #splashFlower path:nth-child(6){fill:#245a6b}
/* profile: follower row + pairing */
.pairrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:0;margin:0;text-align:left;color:inherit;font:inherit;cursor:pointer;border-radius:14px}
.pairrow:active{opacity:.65}
.pairrow .chev{margin-left:auto;color:var(--mut);font-size:24px;line-height:1;padding-right:2px}
/* stop sharing: spin, burst, done */
#shareEnd{position:fixed;inset:0;z-index:9998;display:grid;place-items:center;background:var(--bg);opacity:0;transition:opacity .35s ease}
#shareEnd.on{opacity:1}
#shareEnd .se-stage{position:relative;width:min(78vw,300px);height:min(78vw,300px);display:grid;place-items:center}
#shareEnd .se-logo{width:112px;height:112px;display:block;filter:drop-shadow(0 12px 26px rgba(0,0,0,.14));animation:seSpin 5s cubic-bezier(.4,0,.2,1) forwards}
#shareEnd .se-logo.boom{animation:seBoom .6s cubic-bezier(.3,.85,.4,1) forwards}
#shareEnd .se-msg{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font:700 .95rem/1.4 system-ui,sans-serif;color:var(--ink);opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
#shareEnd .se-msg.on{opacity:1;transform:none}
#shareEnd .se-petal{position:absolute;left:50%;top:50%;pointer-events:none}
@keyframes seSpin{0%{opacity:0;transform:rotate(0deg) scale(.55)}12%{opacity:1;transform:rotate(0deg) scale(1)}100%{opacity:1;transform:rotate(1440deg) scale(1)}}
@keyframes seBoom{0%{opacity:1;transform:rotate(1440deg) scale(1)}55%{opacity:1;transform:rotate(1440deg) scale(1.5)}100%{opacity:0;transform:rotate(1440deg) scale(2.3)}}
body.splashPlay #splashFlower{animation:splashBurst 3.4s cubic-bezier(.4,0,.2,1) forwards}
body.splashPlay #splashWash{animation:splashWash 3.4s linear forwards}
@keyframes splashBurst{
 0%{opacity:0;transform:scale(.1) rotate(0deg)}
 8%{opacity:1}
 16%{transform:scale(1) rotate(180deg);animation-timing-function:ease-out}
 52%{opacity:1;transform:scale(1.05) rotate(540deg);animation-timing-function:ease-in}
 62%{transform:scale(.88) rotate(640deg);animation-timing-function:cubic-bezier(.7,0,1,.6)}
 90%{opacity:1;transform:scale(9) rotate(1080deg)}
 100%{opacity:1;transform:scale(11) rotate(1140deg)}}
@keyframes splashWash{0%,70%{opacity:0}88%,100%{opacity:1}}

}

 .store-track{grid-template-columns:repeat(6,minmax(0,1fr))}
 .bookcard{max-width:240px}
}

    showUpdateBanner(m);

   }
  }catch(e){}
  // Silent autodownload — but only on good networks; otherwise fall back to old banner

   showUpdateSheet(m,v);
   return
  }
  try{
   const args={url:m.url};

function apptData(){
 const from=addD(today(),-89),days=[...Array(90)].map((_,i)=>addD(today(),i-89));
 const c=cycleStats(),s=starts();
 const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10:null;
 const num=v=>{const n=spNum(v);return n!=null?n:null};
 const sleep=[],energy=[],mood=[];
 days.forEach(d=>{const l=L(d);const sv=num(l.sleep),ev=num(l.energy),mv=num(l.mood);
  if(sv!=null)sleep.push(sv);if(ev!=null)energy.push(ev);if(mv!=null)mood.push(mv)});
 const flow={light:0,medium:0,heavy:0},tg={};
 let curStreak=0,heavyStreak=0;
 days.forEach(d=>{const l=L(d);
  if(flow[l.flow]!=null)flow[l.flow]++;
  if(l.flow==='heavy'){curStreak++;heavyStreak=Math.max(heavyStreak,curStreak)}else curStreak=0;
  ((l.tags||[]).concat(l.customSx||[])).forEach(t=>{const k=String(t).trim();if(k)tg[k]=(tg[k]||0)+1})});
 const symptoms=Object.entries(tg).sort((a,b)=>b[1]-a[1]).slice(0,6);
 const painRx=/(pain|cramp|headach|migrain|pck)/i;
 const painDays=days.filter(d=>{const l=L(d);return(l.tags||[]).concat(l.customSx||[]).some(t=>painRx.test(String(t)))}).length;
 const aSleep=avg(sleep),aEnergy=avg(energy),aMood=avg(mood);
 const lastUats=s.slice(-4);
 const q=[];
 if(flow.heavy>=2)q.push('Is this bleeding expected for me, and should my iron or haemoglobin be checked?');
 if(heavyStreak>=3)q.push('Three or more heavy days in a row — should I track anything else or do any tests?');
 if(c.irregular)q.push('Should I be investigated for irregular cycles (e.g. thyroid, prolactin, PCOS work-up)?');
 if(painDays>=3)q.push('How should I manage cycle-related pain — is this level of pain expected?');
 if(aEnergy!=null&&aEnergy<2.6)q.push('My energy averages '+aEnergy+'/5 — are there low-energy tests or screens you would consider?');
 if(aMood!=null&&aMood<=2.4)q.push('My mood has averaged '+aMood+'/5 — should I discuss my mood specifically?');
 if(aSleep!=null&&aSleep<6.4)q.push('My sleep averages under '+aSleep+' hours — is something worth investigating?');
 if(s.length>=2)q.push('What do you see in my recorded cycle pattern (last starts: '+s.slice(-4).join(', ')+')?');
 if(!q.length)q.push('Open questions — anything you would like the clinician to know.');
 return{from,to:today(),name:D.p.name||user,s,lastStart:s.length?s[s.length-1]:null,cycle:c,irregular:!!c.irregular,
  aSleep,aEnergy,aMood,sleepN:sleep.length,energyN:energy.length,moodN:mood.length,
  flow,heavyStreak,painDays,symptoms,questions:q.slice(0,6)}}
function apptRegularity(c){
 if(c.n>=2){const v=c.max-c.min;return c.irregular?('Irregular · varies by '+v+' days · avg '+c.avg+'d'):('Regular-ish · avg '+c.avg+'d · range '+c.min+'–'+c.max+'d')}
 if(c.last)return 'Only one recorded start — not enough data yet';
 return 'No cycles logged'}
function apptCycleDay(c){if(!c.last)return '—';const d=Math.floor((new Date(today())-new Date(c.last))/864e5)+1;return 'Day '+d}
function apptNext(c){if(c.n<2)return '— (needs 2+ recorded starts)';const from=c.last||today();const next=addD(from,c.avg);return fmt(next,{day:'numeric',month:'long',year:'numeric'})}
function apptBlocks(k){
 const esc=E;
 const out=[];
 out.push({ki:'Patient',rows:[
  ['Name',esc(k.name)],
  ['Date of birth','<span class="blank" aria-hidden="true"></span>'],
  ['Height / weight','<span class="blank" aria-hidden="true"></span>'],
  ['Allergies','<span class="blank" aria-hidden="true"></span>'],
  ['Current medications','<span class="blank" aria-hidden="true"></span>'],
  ['Reason for visit / main concerns','<span class="blank" aria-hidden="true"></span>'],
 ]});
 out.push({ki:'Cycle overview',rows:[
  ['Last recorded period',k.lastStart?fmt(k.lastStart,{day:'numeric',month:'long',year:'numeric'}):'None yet'],
  ['Last 4 starts',k.s.slice(-4).join(', ')||'—'],
  ['Cycle length',(k.cycle.n>=2)?(k.cycle.min+'–'+k.cycle.max+' days · avg '+k.cycle.avg+'d'):'Not enough data'],
  ['Regularity',apptRegularity(k.cycle)],
  ['Current cycle day',apptCycleDay(k.cycle)],
  ['Next expected (est.)',apptNext(k.cycle)],
 ]});
 const b=[];
 b.push(k.flow.heavy+' heavy day'+(k.flow.heavy===1?'':'s'));
 b.push(k.flow.medium+' medium');
 b.push(k.flow.light+' light');
 out.push({ki:'Bleeding pattern (last 90 days)',rows:[
  ['Heavy days',k.flow.heavy+' (longest stretch: '+k.heavyStreak+'d)'],
  ['Medium days',String(k.flow.medium)],
  ['Light days',String(k.flow.light)],
  ['Days with pain symptoms',String(k.painDays)],
 ]});
 const avgRows=[];
 if(k.aMood!=null)avgRows.push(['Mood (1–5 scale)',k.aMood+' / 5  ('+k.moodN+' logged)']);
 if(k.aEnergy!=null)avgRows.push(['Energy (1–5 scale)',k.aEnergy+' / 5  ('+k.energyN+' logged)']);
 if(k.aSleep!=null)avgRows.push(['Sleep (average)',k.aSleep+'h  ('+k.sleepN+' logged)']);
 if(avgRows.length)out.push({ki:'Averages (last 90 days)',rows:avgRows});
 out.push({ki:'Most common symptoms (days)',list:k.symptoms.length?k.symptoms.map(([t,n])=>E(t)+' — '+n+' day'+(n===1?'':'s')):['None logged']});
 out.push({ki:'Questions to ask your doctor',list:k.questions});
 out.push({ki:'About this report',note:'Self-reported by the patient via Bloom (a period-tracking app) covering the last 90 days. Not validated medical data, not a diagnosis, and not a treatment plan. Please review with your clinician.'});
 return out}

async function apptShare(){
 try{
  const k=apptData(),Ctor=(window.jspdf&&window.jspdf.jsPDF);
  if(!Ctor){toast('PDF generator unavailable');return}

  const M=16,W=178;let y=22;
  const pageH=278,footAt=283;
  const ensure=h=>{if(y+h>pageH){doc.addPage();y=16}};
  const head=()=>{doc.setFillColor(184,69,107);doc.rect(0,0,210,2.6,'F')};
  const ki=t=>{ensure(12);y+=2;doc.setFont('times','bold');doc.setFontSize(9.5);doc.setTextColor(184,69,107);
   doc.text(t.toUpperCase(),M,y);y+=1.6;doc.setDrawColor(226,206,200);doc.setLineWidth(0.3);doc.line(M,y,M+60,y);y+=4.6};
  const row=([k,v])=>{ensure(9);doc.setFont('helvetica','bold');doc.setFontSize(8.4);doc.setTextColor(140,122,128);
   doc.text(String(k).toUpperCase(),M,y+3);doc.setFont('helvetica','normal');doc.setFontSize(10.2);doc.setTextColor(58,46,51);
   const lines=doc.splitTextToSize(String(v),W-62);doc.text(lines,M+62,y+3.4);
   y+=Math.max(6.4,lines.length*5.2)+2.4};
  const list=items=>{items.forEach(i=>{ensure(9);doc.setFont('helvetica','normal');doc.setFontSize(10.2);doc.setTextColor(58,46,51);
   const lines=doc.splitTextToSize('• '+i,W-8);doc.text(lines,M+4,y+3);y+=Math.max(6,lines.length*5.4)+1.2});y+=2};
  head();
  doc.setFont('times','bold');doc.setFontSize(21);doc.setTextColor(58,46,51);doc.text('Appointment summary',M,y);y+=6;
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(140,122,128);
  doc.text('Bloom · self-tracked cycle data for the last 90 days',M,y);y+=4;
  doc.text('Generated '+fmt(today(),{day:'numeric',month:'long',year:'numeric'})+' · Not a diagnosis · Not a medical record',M,y);y+=8;
  doc.setFont('times','bold');doc.setFontSize(15);doc.setTextColor(184,69,107);doc.text(E(k.name),M,y);y+=8;
  apptBlocks(k).forEach(s=>{ki(s.ki);if(s.rows)s.rows.forEach(row);if(s.list)list(s.list);if(s.note){ensure(10);doc.setFont('helvetica','italic');doc.setFontSize(8.6);doc.setTextColor(140,122,128);const lines=doc.splitTextToSize(s.note,W);doc.text(lines,M,y);y+=lines.length*4.6+2}});
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setDrawColor(234,223,210);doc.setLineWidth(0.3);doc.line(M,footAt,210-M,footAt);
   doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(150,130,138);
   doc.text('Bloom (period-tracking) · self-tracked, not validated · page '+i+' of '+n,M,footAt+4.5)}
  const blob=doc.output('blob');
  const file=new File([blob],'bloom-appointment-summary.pdf',{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[file]}))
   navigator.share({title:'Appointment summary',files:[file]}).catch(e=>{if(e&&e.name!=='AbortError')toast('Share failed');try{reportErr('appt.share',e)}catch(_){}});
  else{try{doc.save('bloom-appointment-summary.pdf');toast('PDF saved')}catch(e){toast('Share is not supported on this device')}}
 }catch(e){try{reportErr('appt.pdf',e)}catch(_){}toast('Could not create the PDF')}

function validCatalog(j){

let LIB_REFRESH_INFLIGHT=null;
function maybeRefreshLibrary(){
 try{
  const last=+ST.get('bloom_lib_fetched_at')||0;
  if(Date.now()-last<12*3600*1000)return; // only a successful refresh starts the cooldown
  if(LIB_REFRESH_INFLIGHT)return;
  refreshLibrary().catch(()=>{});
 }catch(e){}

let LIB_REFRESH_TIMEOUT=10000;
function libRefreshTimeoutSet(ms){LIB_REFRESH_TIMEOUT=Math.max(1,+ms||10000)}
function refreshLibraryOnce(){
 if(LIB_REFRESH_INFLIGHT)return LIB_REFRESH_INFLIGHT;
 const p=(async()=>{
  // one hard race for the whole attempt: fetch, json() and every side effect are bounded
  const ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
  let timedOut=false;
  const attempt=(async()=>{
   try{
    const etag=ST.get('bloom_lib_etag');
    const headers=etag?{'If-None-Match':etag}:{};
    const r=await fetch(LIB_REMOTE_EFFECTIVE,ctrl?{headers,signal:ctrl.signal}:{headers});
    if(r.status===304){if(timedOut)return 'timed-out';try{ST.set('bloom_lib_fetched_at',String(Date.now()))}catch(e){}return 'fresh'}
    if(!r.ok)return 'failed';
    const j=await r.json();
    if(timedOut)return 'timed-out';
    if(!validCatalog(j))return 'invalid'; // never overwrite a valid cache with malformed data
    const nextEtag=r.headers&&r.headers.get?r.headers.get('etag'):null;
    const curRaw=ST.get('bloom_library');
    let stored=null;try{stored=JSON.stringify(j)}catch(e){stored=null}
    if(stored===null)return 'invalid';
    if(curRaw!==stored){
     try{ST.set('bloom_library',stored)}catch(e){return 'failed'}
    }
    if(timedOut)return 'timed-out'; // lost the race: do not claim success
    try{if(nextEtag)ST.set('bloom_lib_etag',nextEtag)}catch(e){}
    try{ST.set('bloom_lib_fetched_at',String(Date.now()))}catch(e){}
    LIB_CATALOG=j.books; // replace the in-memory copy atomically
    LIB_SEARCH_CACHE=new Map();
    const changed=curRaw!==stored;
    if(changed){
     try{if(typeof BOOKCARD_CACHE!=='undefined')BOOKCARD_CACHE.clear()}catch(e){}
     if(view==='library'&&safeToRender())library();
    }
    return 'ok';
   }catch(e){return 'failed'}
  })();
  let timer=null;
  const result=await Promise.race([attempt,new Promise(res=>{timer=setTimeout(()=>{timedOut=true;try{if(ctrl)ctrl.abort()}catch(e){}res('failed')},LIB_REFRESH_TIMEOUT)})]);
  clearTimeout(timer); // always release the watchdog, on every outcome
  return result;
 })();
 LIB_REFRESH_INFLIGHT=p;
 p.finally(()=>{LIB_REFRESH_INFLIGHT=null}); // always release the single-flight lock
 return p;
}
async function refreshLibrary(){return refreshLibraryOnce()}

// Pure chip-count math; the filtered scope decides the counts when a search is active
function libChipCounts(fAll, L, personal, q){
 const nAll=fAll.length;
 const nFav=q?fAll.filter(id=>{const b=L[id];return b&&b.favorite}).length:personal.favs.length;
 const nRead=q?fAll.filter(id=>{const b=L[id];return b&&!b.finished}).length:personal.reading.length;
 const nFin=q?fAll.filter(id=>{const b=L[id];return b&&b.finished}).length:personal.fin.length;
 return {nAll,nFav,nRead,nFin};
}

function libObj(v){return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}
function libClone(v){try{return v==null?v:JSON.parse(JSON.stringify(v))}catch(e){return v}}
function libNum(v){const n=+v;return Number.isFinite(n)?n:0}
function libStamp(o,k){return libNum(o&&o[k])}
function libBool(rv,lv,rt,lt){
 if(rt||lt){if(rt>lt)return !!rv;if(lt>rt)return !!lv}
 return !!(rv||lv); // legacy docs: keep the old OR behaviour
}
function libHlId(h){if(!h||typeof h!=='object')return 'h';if(h.id)return String(h.id);return String(h.start||'')+':'+String(h.end||'')+':'+String(h.color||'')}
function libCleanDoc(doc){

 if(!c||typeof c!=='object')return {books:{}};
 if(!libObj(c.books))c.books={};

 return c;
}
function libMergeDocs(local,remote){
 const l=libObj(local),r=libObj(remote);
 const lBooks=libObj(l.books),rBooks=libObj(r.books);
 const lDel=libObj(l._del),rDel=libObj(r._del);
 const delBooks={};
 [libObj(rDel.books),libObj(lDel.books)].forEach(m=>Object.keys(m).forEach(id=>{
  const a=delBooks[id],b=m[id];if(!a||libNum(b&&b.t)>libNum(a&&a.t))delBooks[id]=b;
 }));
 const delHl={};
 [libObj(rDel.hl),libObj(lDel.hl)].forEach(m=>Object.keys(m).forEach(bookId=>{
  const src=libObj(m[bookId]),dst=delHl[bookId]=delHl[bookId]||{};
  Object.keys(src).forEach(id=>{const a=dst[id],b=src[id];if(!a||libNum(b&&b.t)>libNum(a&&a.t))dst[id]=b});
 }));
 const books={};
 const all=new Set([...Object.keys(lBooks),...Object.keys(rBooks)]);
 all.forEach(id=>{
  const a=rBooks[id],b=lBooks[id]; // a=remote, b=local
  if(!a){const o=libClone(b);o.dl=!!b.dl;books[id]=o;return}
  if(!b){const o=libClone(a);o.dl=false;books[id]=o;return}
  const out=Object.assign({},libClone(a),libClone(b));
  out.page=Math.max(libNum(b.page)||1,libNum(a.page)||1);
  out.pct=Math.max(libNum(b.pct),libNum(a.pct));
  out.lastRead=Math.max(libNum(b.lastRead),libNum(a.lastRead));
  out.favorite=libBool(a.favorite,b.favorite,libStamp(a,'favAt'),libStamp(b,'favAt'));
  out.finished=libBool(a.finished,b.finished,libStamp(a,'finAt'),libStamp(b,'finAt'));
  out.bookmarked=libBool(a.bookmarked,b.bookmarked,libStamp(a,'bmAt'),libStamp(b,'bmAt'));
  out.dl=!!b.dl; // this device's download flag, never the remote's
  // highlights: union by stable id, drop tombstoned ones
  const arrA=Array.isArray(a.hl)?a.hl:[],arrB=Array.isArray(b.hl)?b.hl:[];
  const hmap=new Map();
  arrB.forEach(h=>{if(h)hmap.set(libHlId(h),libClone(h))});
  arrA.forEach(h=>{if(!h)return;const k=libHlId(h);const cur=hmap.get(k);if(!cur||libStamp(h,'at')>=libStamp(cur,'at'))hmap.set(k,libClone(h))});
  const hlt=delHl[id]||{};
  const hl=[];
  hmap.forEach((h,k)=>{
   const t=hlt[libHlId(h)];
   if(t&&libStamp(h,'at')<=libNum(t.t))return; // deleted on one side and not edited afterwards
   hl.push(h);
  });
  out.hl=hl.slice(0,200);
  books[id]=out;
 });
 // book deletions: tombstones win unless the surviving copy was edited afterwards
 Object.keys(delBooks).forEach(id=>{
  if(!books[id])return;
  const b=books[id];
  const touched=Math.max(libNum(b.lastRead),libStamp(b,'favAt'),libStamp(b,'finAt'),libStamp(b,'bmAt'));
  if(libNum(delBooks[id]&&delBooks[id].t)>touched)delete books[id];
 });
 const out={books};
 if(Object.keys(delBooks).length||Object.keys(delHl).length)out._del={books:delBooks,hl:delHl};
 return out;
}

async function partnerLibPushAsync(){
 const uid=sbUser.id;
 // read the authoritative local library state only after the caller holds the lock;
 // an older queued argument can never overwrite a newer local store
 const liveSnap=libClone(libStoreRead());
 const liveStr=JSON.stringify(liveSnap);
 const baseRev=partnerLibRevGet(uid);
 try{
  const res=await sb.rpc('bloom_push_library',{p_doc:libCleanDoc(liveSnap),p_base_rev:baseRev});
  if(res&&res.error){partnerLibMarkDirty(uid);reportErr('partner.library.push',res.error);return 'failed'}
  const data=res&&res.data;
  if(!data||typeof data.status!=='string'){partnerLibMarkDirty(uid);reportErr('partner.library.push','unexpected RPC response');return 'failed'}
  if(data.status==='ok'){
   partnerLibRevSet(uid,data.rev);
   if(libSnapStr()===liveStr){partnerLibClearDirty(uid);return 'ok'}
   // local edits landed while the push was in flight; push again rather than claim synced
   partnerLibMarkDirty(uid);setTimeout(()=>partnerLibPush(libStoreRead()),0);return 'ok';
  }
  if(data.status==='conflict'){
   // reconcile the LATEST local library state with the returned cloud doc, not the stale snapshot
   const cur=libStoreRead();
   const curStr=JSON.stringify(cur);
   const merged=libMergeDocs(cur,data.doc||{});
   partnerLibRevSet(uid,data.rev);
   libSetStore(merged);
   const retry=await sb.rpc('bloom_push_library',{p_doc:libCleanDoc(merged),p_base_rev:+(data.rev||0)});
   if(retry&&retry.data&&retry.data.status==='ok'){
    partnerLibRevSet(uid,retry.data.rev);
    if(libSnapStr()===JSON.stringify(merged)){partnerLibClearDirty(uid);return 'ok'}
    partnerLibMarkDirty(uid);setTimeout(()=>partnerLibPush(libStoreRead()),0);return 'ok';
   }
   partnerLibMarkDirty(uid);reportErr('partner.library.push','conflict retry failed');return 'failed';
  }
  if(data.status==='forbidden'){partnerLibMarkDirty(uid);reportErr('partner.library.forbidden',data.reason||'uid mismatch');return 'failed'}
  partnerLibMarkDirty(uid);reportErr('partner.library.push','unexpected status '+data.status);return 'failed';
 }catch(e){partnerLibMarkDirty(uid);reportErr('partner.library.push',e);return 'failed';}
}

// Reading progress uses per-device cumulative counters:
//   logByDevice[date][deviceId] = cumulative seconds recorded by that device

function readDeviceId(){try{let v=ST.get('bloom_device_id');if(!v){v='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);ST.set('bloom_device_id',v)}return v}catch(e){return 'dev'}}

function readShape(o){

 Object.keys(srcBy).forEach(d=>{const devs=readObj(srcBy[d]);const out={};Object.keys(devs).forEach(k=>{const n=readNum(devs[k]);if(n)out[k]=n});if(Object.keys(out).length)by[d]=out});

 Object.keys(readObj(s.legacyLog)).forEach(d=>{const n=readNum(s.legacyLog[d]);if(n)legacy[d]=n});
 if(!Object.keys(srcBy).length){
  // One-time migration: the old log[date] total becomes the baseline. Both
  // devices migrate to the same max, so nothing is double counted.
  Object.keys(readObj(s.log)).forEach(d=>{const n=readNum(s.log[d]);if(n)legacy[d]=Math.max(legacy[d]||0,n)});
 }
 const finished={};Object.keys(readObj(s.finished)).forEach(k=>{const n=readNum(s.finished[k]);if(n)finished[k]=n});
 const unfinished={};Object.keys(readObj(s.unfinished)).forEach(k=>{const n=readNum(s.unfinished[k]);if(n)unfinished[k]=n});
 // A newer explicit unfinished stamp beats an older finished stamp.
 Object.keys(unfinished).forEach(k=>{
  if(finished[k]>unfinished[k])delete unfinished[k];
  else delete finished[k];
 });
 const log={};
 const days=new Set([...Object.keys(legacy),...Object.keys(by)]);
 days.forEach(d=>{let t=legacy[d]||0;Object.keys(by[d]||{}).forEach(k=>{t+=by[d][k]});if(t>0)log[d]=t});
 const goalMin=readValidMin(s.goalMin)?+s.goalMin:5;

function readGoalPick(l,r,key,valid,def,atKey){
 const lv=valid(l[key])?+l[key]:undefined,rv=valid(r[key])?+r[key]:undefined;
 const la=readNum(l[atKey]),ra=readNum(r[atKey]);

 if(rv===undefined)return {v:lv,at:la};

function readingMerge(local,remote){

 const dates=new Set([...Object.keys(l.by),...Object.keys(r.by)]);
 dates.forEach(d=>{
  const devs={};const a=l.by[d]||{},b=r.by[d]||{};
  new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{devs[k]=Math.max(a[k]||0,b[k]||0)});
  by[d]=devs;
 });
 const legacy={};
 new Set([...Object.keys(l.legacy),...Object.keys(r.legacy)]).forEach(d=>{legacy[d]=Math.max(l.legacy[d]||0,r.legacy[d]||0)});
 const log={};
 const days=new Set([...Object.keys(legacy),...Object.keys(by)]);
 days.forEach(d=>{let t=legacy[d]||0;Object.keys(by[d]||{}).forEach(k=>{t+=by[d][k]});if(t>0)log[d]=t});
 const finished={},unfinished={};
 new Set([...Object.keys(l.finished),...Object.keys(r.finished)]).forEach(k=>{finished[k]=Math.max(l.finished[k]||0,r.finished[k]||0)});
 new Set([...Object.keys(l.unfinished),...Object.keys(r.unfinished)]).forEach(k=>{unfinished[k]=Math.max(l.unfinished[k]||0,r.unfinished[k]||0)});
 Object.keys(unfinished).forEach(k=>{
  if(finished[k]>unfinished[k])delete unfinished[k];
  else delete finished[k];
 });

async function readingPushAsync(){
 const uid=sbUser.id;
 // never push a stale captured document: project the CURRENT local reading state
 const snap=readingDocFromD();
 const snapStr=JSON.stringify(snap);
 const baseRev=readingRevGet(uid);
 let res;
 try{res=await withTimeout(sb.rpc('bloom_push_reading',{p_doc:snap,p_base_rev:baseRev}),6000)}

 if(res&&res.error){readingMarkDirty(uid);reportErr('reading.push',res.error);return 'failed'}
 const data=res&&res.data;
 if(!data||typeof data.status!=='string'){readingMarkDirty(uid);reportErr('reading.push','unexpected RPC response');return 'failed'}
 if(data.status==='ok'){
  readingRevSet(uid,data.rev);
  if(readSnapStr()===snapStr){readingClearDirty(uid);return 'ok'}
  // newer local seconds were banked while the push was in flight; do not claim they are synced
  readingMarkDirty(uid);saveReading();return 'ok';
 }
 if(data.status==='conflict'){
  // reconcile the LATEST local state with the returned cloud doc, not the stale snapshot
  const cur=readingDocFromD();
  const curStr=JSON.stringify(cur);
  const merged=readingMerge(cur,data.doc||{});
  readingRevSet(uid,data.rev);
  let retry;
  try{retry=await withTimeout(sb.rpc('bloom_push_reading',{p_doc:merged,p_base_rev:+(data.rev||0)}),6000)}
  catch(e){readingMarkDirty(uid);reportErr('reading.push','conflict retry failed');return 'failed'}
  if(retry&&retry.data&&retry.data.status==='ok'){
   readingRevSet(uid,retry.data.rev);
   if(JSON.stringify(readingDocFromD())===curStr){
    applyReadingDoc(merged); // safe: nothing newer locally since the merge
    if(!RO&&typeof persistDoc==='function')persistDoc();
    readingClearDirty(uid);return 'ok';
   }
   // local moved ahead again while the retry was in flight
   readingMarkDirty(uid);saveReading();return 'ok';
  }
  readingMarkDirty(uid);reportErr('reading.push','conflict retry failed');return 'failed';
 }
 if(data.status==='forbidden'){readingMarkDirty(uid);reportErr('reading.push.forbidden',data.reason||'uid mismatch');return 'failed'}
 readingMarkDirty(uid);reportErr('reading.push','unexpected status '+data.status);return 'failed';
}

function bindStoreCards(scope){
 scope.querySelectorAll('.bookcard[data-bid]').forEach(b=>{
  if(b.dataset.bound==='1')return; // already has its listeners: never double-bind
  b.dataset.bound='1';
  const id=b.dataset.bid;const added=!!libEnsure().books[id];
  const holdMs=450,move=14;let timer=0,sx=0,sy=0;
  const down=e=>{const t=e.changedTouches?e.changedTouches[0]:e;sx=t.clientX;sy=t.clientY;
   clearTimeout(timer);timer=setTimeout(()=>{timer=0;if(added)showBookMenu(id)},holdMs)};
  const up=()=>{clearTimeout(timer);timer=0};
  const moveH=e=>{const t=e.changedTouches?e.changedTouches[0]:e;if(!timer)return;if(Math.abs(t.clientX-sx)>move||Math.abs(t.clientY-sy)>move)clearTimeout(timer)};
  b.addEventListener('pointerdown',down);
  b.addEventListener('pointermove',moveH,{passive:true});
  b.addEventListener('pointerup',up);
  b.addEventListener('pointercancel',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
  b.addEventListener('click',()=>{clearTimeout(timer);if(added)openBook(id);else showExploreSheet(id)})})}

function deleteAllData(){
 const yes=confirm('Delete all your Bloom data?\n\nEvery log, meal, task and journal entry will be erased from this phone and from the cloud. Your account stays, so you can start fresh. This cannot be undone.');
 if(!yes)return;
 sheet(`<h2>Delete everything</h2><p class="meta" style="margin:0 0 14px">This erases all logs, meals, tasks and journal entries \u2014 on this phone and in the cloud. Your partner loses access, and nothing can be recovered.</p>
  <label for="dlt">Type DELETE to confirm</label><input id="dlt" autocapitalize="characters" autocomplete="off" spellcheck="false"><p class="hint" id="dltErr"></p>
  <div class="row" style="gap:10px;margin-top:16px"><button class="btn ghost" id="dltNo" style="flex:1">Cancel</button><button class="btn pink" id="dltGo" style="flex:1">Delete everything</button></div>`);
 $('#dltNo').onclick=()=>sheet();
 $('#dltGo').onclick=async()=>{
  if($('#dlt').value.trim().toUpperCase()!=='DELETE'){$('#dltErr').textContent='Type DELETE exactly, then press again.';return}
  $('#dltGo').disabled=true;$('#dltGo').innerHTML='<span class="spinner" aria-hidden="true"></span>Deleting\u2026';
  await doDeleteAll()};
}
async function doDeleteAll(){
 sheet();
 const cl=await sbInit();
 // The cloud copy wins on the next sign-in, so wipe it first. If that fails we stop
 // before touching the phone, otherwise the data would simply come back.
 if(cl&&sbUser){
  D=blank();
  try{
   // compare-and-set like everything else; a fresh rev is fetched first
   let base=0;try{const row=await sbFetchDocWithRev(sbUser.id);if(row)base=+row.rev||0}catch(e){}
   let res=await cl.rpc('bloom_push_doc',{p_doc:D,p_base_rev:base});
   if(res&&res.data&&res.data.status==='conflict'){res=await cl.rpc('bloom_push_doc',{p_doc:D,p_base_rev:+res.data.rev||0})}
   if(!(res&&res.data&&res.data.status==='ok'))return toast('Could not reach the cloud \u2014 nothing was deleted')
  }
  catch(e){return toast('Could not reach the cloud \u2014 nothing was deleted')}
   try{await cl.from('bloom_profiles').upsert({id:sbUser.id,name:'',avatar:null,goals:[]})}catch(e){reportErr('profile.delete',e)}
  }
  // partner access goes next, so nobody keeps following an empty cycle
  try{if(cl&&sbUser)await cl.rpc('bloom_revoke_partner_codes')}catch(e){reportErr('partner.revoke',e)}
 try{await reminderCancel()}catch(e){}
  // local caches for every account on this device, plus the session
  wipeLocalData();
  try{sessionStorage.clear()}catch(e){}
 try{if(cl)await cl.auth.signOut()}catch(e){}
 try{setRoleFlag('')}catch(e){}
  sbUser=null;user=null;D=null;sbLastPush='';sbRev=0;onbStep=0;
 if(cloudTimer){clearInterval(cloudTimer);cloudTimer=null}
 toast('All your data was deleted');
 authView('in')}

  o.innerHTML='<div class="se-stage"><img class="se-logo" alt="" src="'+LOGO+'"><div class="se-msg">Sharing stopped</div></div>';

  for(let i=0;i<26;i++){
   const d=document.createElement('div');d.className='se-petal';
   const w=Math.min(innerWidth,innerHeight)*(.10+Math.random()*.18),h=w*1.15;
   d.style.width=w+'px';d.style.height=h+'px';d.style.marginLeft=(-w/2)+'px';d.style.marginTop=(-h/2)+'px';
   const ci=Math.floor(Math.random()*4);
   d.innerHTML=splashPetalSVG(PAL[ci],PAL[Math.min(5,ci+2)]);
   stage.appendChild(d);
   if(!d.animate)continue;
   const a=(i/26)*Math.PI*2+Math.random()*.5,dist=W*(.45+Math.random()*.45);
   const dx=Math.cos(a)*dist,dy=Math.sin(a)*dist,rot=(Math.random()<.5?-1:1)*(240+Math.random()*420);
   d.animate([
    {opacity:0,transform:'translate(0,0) scale(.2) rotate(0deg)'},
    {opacity:1,transform:'translate('+(dx*.25)+'px,'+(dy*.25)+'px) scale(.9) rotate('+(rot*.25)+'deg)'},
    {opacity:0,transform:'translate('+dx+'px,'+dy+'px) scale(1.3) rotate('+rot+'deg)'}
   ],{duration:900+Math.random()*300,delay:5000,easing:'cubic-bezier(.2,.7,.3,1)',fill:'both'});
  }
  setTimeout(()=>{const l=o.querySelector('.se-logo'),m=o.querySelector('.se-msg');if(l)l.classList.add('boom');if(m)m.classList.add('on')},5000);
  setTimeout(()=>o.classList.remove('on'),6100);
  setTimeout(()=>{try{o.remove()}catch(e){}done()},6520);
 });

let busyEl=null,busyN=0,busyTimer=null;
function busyBurst(){
 if(!busyEl)return;
 busyEl.querySelectorAll('.splash-petal').forEach(n=>n.remove());
 const PAL=(document.body.classList.contains('ro')||document.body.classList.contains('roSplash'))?SPLASH_PAL_RO:SPLASH_PAL;
 const reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
 const W=Math.max(innerWidth,innerHeight),N=reduce?10:26;
 const {spread,dur}=splashPetalTiming(1300);
 for(let i=0;i<N;i++){
  const d=document.createElement('div');d.className='splash-petal';
  const w=Math.min(innerWidth,innerHeight)*(.14+Math.random()*.24),h=w*1.15;
  d.style.setProperty('--w',w+'px');d.style.setProperty('--h',h+'px');
  const ci=Math.floor(Math.random()*4);d.innerHTML=splashPetalSVG(PAL[ci],PAL[Math.min(5,ci+2)]);
  busyEl.appendChild(d);
  const a=(i/N)*Math.PI*2+Math.random()*.4,dist=W*(.25+Math.random()*.45);
  const dx=Math.cos(a)*dist,dy=Math.sin(a)*dist,r0=Math.random()*360;
  if(reduce){d.style.opacity='.85';d.style.transform='translate('+(dx*.5)+'px,'+(dy*.5)+'px) scale(.9) rotate('+r0+'deg)';continue}
  d.animate([
   {opacity:0,transform:'translate(0,0) scale(.2) rotate('+r0+'deg)',offset:0},
   {opacity:1,transform:'translate('+(dx*.25)+'px,'+(dy*.25)+'px) scale(.8) rotate('+(r0+40)+'deg)',offset:.35},
   {opacity:0,transform:'translate('+dx+'px,'+dy+'px) scale(1.2) rotate('+(r0+90)+'deg)',offset:1}
  ],{duration:dur,delay:Math.round(spread*Math.random()*.4),easing:'cubic-bezier(.15,.7,.3,1)',fill:'both'});
 }
}
function busyOn(){
 busyN++;
 if(busyEl)return;
 const e=document.createElement('div');e.id='busy';e.setAttribute('role','status');e.setAttribute('aria-live','polite');e.setAttribute('aria-busy','true');
 e.innerHTML='<span class="sr">Loading</span>';
 document.body.appendChild(e);busyEl=e;

var SPLASH_MIN=2600,SPLASH_MAX=3200,RESUME_MIN=1800,RESUME_MAX=2400,SPLASH_AFTER_MS=180000;
var splashDone=false,splashAppReady=false,splashT0=0,splashMin=SPLASH_MIN,splashPlaying=false;
const splashTimers=[],splashAnimations=[];
function splashClearTimers(){while(splashTimers.length){const id=splashTimers.pop();try{clearTimeout(id)}catch(e){}}}
function splashClearAnimations(){while(splashAnimations.length){const a=splashAnimations.pop();try{a.cancel()}catch(e){}}}
function splashBgMark(){try{localStorage.setItem('bloom_last_bg',String(Date.now()))}catch(e){}}
function splashAwayMs(){try{const v=+localStorage.getItem('bloom_last_bg')||0;return v?Date.now()-v:null}catch(e){return null}}
function splashShouldShow(away){const a=away!=null&&away>=0?away:splashAwayMs();return a==null?true:a>=SPLASH_AFTER_MS}
function splashSkip(){const e=document.getElementById('splash');if(!e)return;e.classList.add('gone');e.style.display='none';splashDone=true;splashPlaying=false;splashClearTimers();splashClearAnimations()}
const SPLASH_HTML=(()=>{const e=document.getElementById('splash');return e?e.outerHTML:''})();
function splashMount(){let e=document.getElementById('splash');
 if(!e&&SPLASH_HTML){document.body.insertAdjacentHTML('afterbegin',SPLASH_HTML);e=document.getElementById('splash')}
 if(!e)return null;
 e.classList.remove('gone');e.style.display='';return e}
function splashHide(){
 const e=document.getElementById('splash');

const SPLASH_PAL=['#e9a5ad','#d68f98','#cd818f','#b87082','#ac6476','#a15a6b'];
const SPLASH_PAL_RO=['#a8c6d4','#7faebd','#5e97a8','#3e8195','#2f6b7e','#245a6b'];
const splashPetalSVG=(c,c2)=>'<svg viewBox="-50 -60 100 120"><path d="M0,-56 C46,-42 52,22 0,58 C-52,22 -46,-42 0,-56Z" fill="'+c+'"/><path d="M0,-6 C22,-2 30,22 0,50 C-16,26 -12,8 0,-6Z" fill="'+c2+'" opacity=".9"/></svg>';
function splashPetalTiming(min){return{spread:Math.max(320,Math.round(min*.45)),dur:Math.max(260,Math.round(min*.42))}}
function splashPlay(replay){
 if(splashPlaying&&!replay)return;
 const stage=splashMount();if(!stage)return;
 splashClearTimers();splashClearAnimations();
 splashPlaying=true;splashT0=Date.now();splashDone=false;splashAppReady=!!replay;
 splashMin=replay?RESUME_MIN:SPLASH_MIN;
 const max=replay?RESUME_MAX:SPLASH_MAX;
 stage.querySelectorAll('.splash-petal').forEach(n=>n.remove());
 const W=Math.max(innerWidth,innerHeight),N=44;
 const {spread,dur}=splashPetalTiming(splashMin);
 for(let i=0;i<N;i++){
  const d=document.createElement('div');d.className='splash-petal';
  const w=Math.min(innerWidth,innerHeight)*(.16+Math.random()*.3),h=w*1.15;
  d.style.setProperty('--w',w+'px');d.style.setProperty('--h',h+'px');

  const a=(i/N)*Math.PI*2+Math.random()*.4,dist=W*(.65+Math.random()*.55);
  const dx=Math.cos(a)*dist,dy=Math.sin(a)*dist,rot=(Math.random()<.5?-1:1)*(300+Math.random()*500);
  const r0=Math.random()*360,delay=Math.round(spread*(.7+Math.random()*.3));
  const anim=d.animate([
   {opacity:0,transform:'translate(0,0) scale(.15) rotate('+r0+'deg)',offset:0},
   {opacity:1,transform:'translate('+(dx*.1)+'px,'+(dy*.1)+'px) scale(.7) rotate('+(r0+rot*.1)+'deg)',offset:.1},
   {opacity:1,transform:'translate('+(dx*.6)+'px,'+(dy*.6)+'px) scale(1.3) rotate('+(r0+rot*.6)+'deg)',offset:.7},
   {opacity:0,transform:'translate('+dx+'px,'+dy+'px) scale(1.5) rotate('+(r0+rot)+'deg)',offset:1}
  ],{duration:dur+Math.random()*Math.round(dur*.2),delay:delay,easing:'cubic-bezier(.15,.7,.3,1)',fill:'both'});
  splashAnimations.push(anim);
 }
 document.body.classList.remove('splashPlay');void document.body.offsetWidth;document.body.classList.add('splashPlay');
 splashTimers.push(setTimeout(()=>{if(splashAppReady&&!splashDone)splashHide()},splashMin));
 splashTimers.push(setTimeout(()=>{if(!splashDone)splashHide()},max));
 splashTimers.push(setTimeout(()=>{const h=document.getElementById('splashHint');if(h&&!splashDone)h.style.opacity=.9},max+200));

 stage.onclick=()=>{if(splashDone)return;splashPlay(false)};
}

function localSessionBoot(sess){
 if(sess&&String(sess).indexOf('p:')===0)return false;

  // the custom session flag can go missing in some WebViews; fall back to the
  // supabase auth token's own email as proof of an established account
  try{const raw=Object.keys(localStorage).find(k=>/^sb-[^-]+-auth-token$/.test(k));const j=raw?JSON.parse(localStorage.getItem(raw)):null;const em=(j&&j.user&&j.user.email)||(j&&j.email);mail=em?String(em).toLowerCase():null}catch(e){}
 }
 if(!mail){
  try{const po=ST.get('bloom_own');if(po)mail=String(po).toLowerCase()}catch(e){}
 }
 if(!mail)return false;
 let cached=null;try{cached=J(key(mail),null)}catch(e){}
 if(!cached||typeof cached!=='object')return false;
 user=mail;D=Object.assign(blank(),cached);loadRev(mail);applyTheme();restoreNav();shell();

 }else{

 }
 try{startReconnectWatch()}catch(e){}
 return true}
